<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05 - Vibrant Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #E5E5E5; }
        .fade-in { animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .hide { display: none !important; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .card-shadow { box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex items-center justify-center p-4">
    <!-- Device Frame -->
    <div class="w-full max-w-md h-[850px] bg-[#FFF8F5] rounded-[3rem] shadow-2xl overflow-hidden relative flex flex-col border-[8px] border-white">
        
        <!-- STATE 1: EMPTY -->
        <div id="state-empty" class="app-state flex-1 flex flex-col items-center justify-center p-8 text-center fade-in">
            <div class="w-40 h-40 mb-8 rounded-[3rem] bg-[#FFE0B2] flex items-center justify-center card-shadow rotate-3">
                <svg class="w-20 h-20 text-[#FF9E00]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h1 class="text-3xl mb-3 font-bold text-[#FF9E00]">Hello there!</h1>
            <p class="text-gray-600 mb-10 font-medium px-4">Your beautiful gallery is empty. Let's fill it with happy moments.</p>
            <button onclick="switchState('state-feed')" class="px-10 py-5 bg-[#FF6B6B] text-white rounded-[2rem] font-bold hover:scale-105 transition-transform card-shadow w-full text-lg">Bring in Photos ✨</button>
        </div>

        <!-- STATE 2: FEED -->
        <div id="state-feed" class="app-state flex-1 flex flex-col hide fade-in bg-[#FFF8F5]">
            <!-- Header -->
            <div class="px-6 pt-12 pb-4 bg-[#FFF8F5] sticky top-0 z-20">
                <h2 class="text-3xl font-bold mb-6 text-[#2D3436]">My Photos</h2>
                
                <div class="relative mb-6">
                    <input type="text" placeholder="Find dogs, beach, summer..." class="w-full bg-white rounded-[2rem] py-4 pl-14 pr-4 font-medium text-gray-700 card-shadow focus:outline-none focus:ring-4 focus:ring-[#FFE0B2] transition">
                    <span class="absolute left-5 top-4 text-2xl">🔍</span>
                </div>
                
                <!-- Utilities -->
                <div class="grid grid-cols-3 gap-3">
                    <button class="bg-[#B5EAD7] text-[#2D3436] rounded-2xl py-3 font-bold text-sm card-shadow flex flex-col items-center justify-center"><span class="text-xl mb-1">🧹</span> Clean</button>
                    <button class="bg-[#FFDAC1] text-[#2D3436] rounded-2xl py-3 font-bold text-sm card-shadow flex flex-col items-center justify-center"><span class="text-xl mb-1">🗄️</span> Space</button>
                    <button class="bg-[#FFB7B2] text-[#2D3436] rounded-2xl py-3 font-bold text-sm card-shadow flex flex-col items-center justify-center"><span class="text-xl mb-1">🔐</span> Vault</button>
                </div>
            </div>

            <!-- Photos -->
            <div class="flex-1 overflow-y-auto p-6 pt-2 pb-32">
                <!-- Group Card -->
                <div class="bg-white rounded-[2rem] p-4 card-shadow mb-6 border-2 border-transparent hover:border-[#FFE0B2] transition">
                    <h3 class="text-xl font-bold mb-3 px-2 flex justify-between items-center">
                        <span>Weekend Vibes</span>
                        <span class="bg-[#B5EAD7] text-xs px-3 py-1 rounded-full text-[#2D3436]">NEW</span>
                    </h3>
                    <div onclick="switchState('state-detail')" class="cursor-pointer h-48 w-full bg-cover bg-center rounded-[1.5rem] mb-3 hover:opacity-90 transition" style="background-image: url('https://images.unsplash.com/photo-1542314831-c6a4d1409384?auto=format&fit=crop&w=800&q=60');"></div>
                    <div class="flex gap-3">
                        <div onclick="switchState('state-detail')" class="cursor-pointer flex-1 h-32 bg-cover bg-center rounded-[1.5rem] hover:opacity-90 transition" style="background-image: url('https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=500&q=60');"></div>
                        <div onclick="switchState('state-detail')" class="cursor-pointer flex-1 h-32 bg-cover bg-center rounded-[1.5rem] hover:opacity-90 transition" style="background-image: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=500&q=60');"></div>
                    </div>
                </div>
            </div>

            <!-- Bottom Nav -->
            <div class="absolute bottom-6 left-6 right-6 bg-white rounded-[2rem] card-shadow flex justify-around p-4 z-20">
                <button class="flex flex-col items-center text-[#FF6B6B] font-bold"><span class="text-2xl mb-1">📸</span> <span class="text-[10px]">Photos</span></button>
                <button class="flex flex-col items-center text-gray-400 hover:text-gray-800 transition font-bold"><span class="text-2xl mb-1">📁</span> <span class="text-[10px]">Albums</span></button>
                <button class="flex flex-col items-center text-gray-400 hover:text-gray-800 transition font-bold"><span class="text-2xl mb-1">⚙️</span> <span class="text-[10px]">Settings</span></button>
            </div>
        </div>

        <!-- STATE 3: DETAIL -->
        <div id="state-detail" class="app-state flex-1 flex flex-col hide fade-in bg-[#FFF8F5] z-30 relative p-4">
            <!-- Header -->
            <div class="pt-8 pb-4 flex justify-between items-center z-10">
                <button onclick="switchState('state-feed')" class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center card-shadow text-2xl hover:scale-105 transition">👈</button>
                <span class="font-bold text-lg bg-white px-4 py-2 rounded-2xl card-shadow">Tokyo, Japan</span>
                <button class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center card-shadow text-2xl hover:scale-105 transition">ℹ️</button>
            </div>
            
            <div class="flex-1 w-full bg-cover bg-center rounded-[3rem] card-shadow mt-4 relative overflow-hidden" style="background-image: url('https://images.unsplash.com/photo-1542314831-c6a4d1409384?auto=format&fit=crop&w=800&q=80');">
                <!-- Overlay actions -->
                <div class="absolute bottom-6 left-6 right-6 flex justify-between gap-4">
                    <button class="flex-1 bg-white/90 backdrop-blur-md py-4 rounded-[1.5rem] font-bold text-gray-800 hover:bg-white transition flex items-center justify-center card-shadow"><span class="mr-2 text-xl">🚀</span> Share</button>
                    <button class="w-16 h-16 bg-[#FF6B6B] text-white rounded-[1.5rem] flex items-center justify-center card-shadow hover:scale-105 transition text-2xl">❤️</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        function switchState(stateId) {
            document.querySelectorAll('.app-state').forEach(el => el.classList.add('hide'));
            document.getElementById(stateId).classList.remove('hide');
        }
    </script>
</body>
</html>
