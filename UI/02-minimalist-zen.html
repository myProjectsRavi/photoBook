<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Book - Minimalist Zen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .hide { display: none; }
        .zen-shadow { box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05); }
        .subtle-border { border: 1px solid rgba(0,0,0,0.04); }
    </style>
</head>
<body class="min-h-screen text-gray-900 antialiased flex flex-col items-center justify-center">

    <!-- Mobile Device Frame Wrapper -->
    <div class="relative w-full max-w-md h-[850px] max-h-[95vh] rounded-[3rem] bg-white shadow-[0_30px_60px_-15px_rgba(0,0,0,0.1)] overflow-hidden flex flex-col relative z-10 border border-gray-100">
        
        <!-- Header / Search -->
        <div class="pt-14 pb-6 px-8 z-20 bg-white">
            <h1 class="text-3xl font-bold tracking-tight mb-6">Gallery</h1>
            <div class="bg-gray-50 rounded-2xl px-5 py-4 flex items-center space-x-3 subtle-border transition focus-within:ring-2 focus-within:ring-black">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" placeholder="Search your life..." class="bg-transparent outline-none w-full placeholder-gray-400 font-medium text-gray-900">
            </div>
            
            <div class="mt-6 flex space-x-6 text-sm font-medium text-gray-400">
                <button class="text-black border-b-2 border-black pb-1">All Photos</button>
                <button class="hover:text-black transition pb-1">Albums</button>
                <button class="hover:text-black transition pb-1">Vault</button>
            </div>
        </div>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 overflow-y-auto px-8 pb-24 relative z-0 bg-white" id="main-content">
            
            <!-- STATE: BEFORE LOAD -->
            <div id="state-before" class="h-full flex flex-col items-center justify-center text-center space-y-6">
                <div class="w-24 h-24 bg-gray-50 rounded-full flex items-center justify-center mb-2 subtle-border">
                    <svg class="w-10 h-10 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                </div>
                <h2 class="text-2xl font-semibold tracking-tight">Your space is clear</h2>
                <p class="text-gray-400 text-sm max-w-[200px] leading-relaxed">Your photos are entirely private and indexed locally.</p>
            </div>

            <!-- STATE: AFTER LOAD -->
            <div id="state-after" class="hide space-y-8">
                <div>
                    <h3 class="text-sm font-medium text-gray-400 uppercase tracking-wider mb-4">Today</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="aspect-square rounded-2xl bg-gray-100 bg-cover bg-center overflow-hidden" style="background-image: url('https://images.unsplash.com/photo-1518005020951-eccb494ad742?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60');"></div>
                        <div class="aspect-square rounded-2xl bg-gray-100 bg-cover bg-center overflow-hidden" style="background-image: url('https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60');"></div>
                    </div>
                </div>
                <div>
                    <h3 class="text-sm font-medium text-gray-400 uppercase tracking-wider mb-4">October</h3>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="aspect-square bg-gray-100 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1506744626753-eda81827351c?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=60');"></div>
                        <div class="aspect-square bg-gray-100 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1470770841072-f978dac4f827?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=60');"></div>
                        <div class="aspect-square bg-gray-100 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1433086966358-54859d0ed716?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=60');"></div>
                        <div class="aspect-square bg-gray-100 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=60');"></div>
                    </div>
                </div>
            </div>

            <!-- STATE: AFTER NAVIGATING (Viewing a Photo) -->
            <div id="state-nav" class="hide h-full flex flex-col pt-4">
                <div class="flex justify-between items-center mb-6">
                    <button class="p-2 -ml-2 text-gray-400 hover:text-black transition"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg></button>
                    <button class="p-2 -mr-2 text-gray-400 hover:text-black transition"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg></button>
                </div>
                <div class="flex-1 w-full rounded-2xl bg-gray-100 bg-cover bg-center mb-8" style="background-image: url('https://images.unsplash.com/photo-1518005020951-eccb494ad742?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=60');"></div>
                <div class="mb-4 text-center">
                    <h3 class="text-lg font-medium">Morning Fog</h3>
                    <p class="text-sm text-gray-400 mt-1">Today, 8:42 AM</p>
                </div>
                <div class="flex justify-center space-x-8 text-gray-400 pb-4">
                    <button class="flex flex-col items-center hover:text-black transition"><svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg><span class="text-xs">Favorite</span></button>
                    <button class="flex flex-col items-center hover:text-black transition"><svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg><span class="text-xs">Share</span></button>
                    <button class="flex flex-col items-center hover:text-black transition"><svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg><span class="text-xs">Delete</span></button>
                </div>
            </div>
        </div>

        <!-- Floating Action Bar (Minimalist) -->
        <div class="absolute right-6 bottom-10 flex flex-col items-center space-y-4 z-20">
            <button class="w-14 h-14 bg-black text-white rounded-full flex items-center justify-center shadow-xl hover:scale-105 transition transform"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></button>
        </div>
    </div>

    <!-- Prototype Controls (For Reviewer) -->
    <div class="fixed bottom-4 right-4 bg-white/90 backdrop-blur-md p-4 rounded-2xl shadow-xl border border-gray-200 z-50 flex space-x-2">
        <span class="text-sm font-bold mr-2 self-center">State:</span>
        <button onclick="setState('before')" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-sm font-medium">Before Load</button>
        <button onclick="setState('after')" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-sm font-medium">After Load</button>
        <button onclick="setState('nav')" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-sm font-medium">After Navigating</button>
    </div>

    <script>
        function setState(state) {
            document.getElementById('state-before').classList.add('hide');
            document.getElementById('state-after').classList.add('hide');
            document.getElementById('state-nav').classList.add('hide');
            
            document.getElementById('state-' + state).classList.remove('hide');
        }
    </script>
</body>
</html>
