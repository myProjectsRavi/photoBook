<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Multi-Colored - Classic Sidebar Glass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .bg-mesh {
            background-color: #ff99f0;
            background-image: 
                radial-gradient(at 40% 20%, hsla(28,100%,74%,1) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189,100%,56%,1) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(355,100%,93%,1) 0px, transparent 50%),
                radial-gradient(at 80% 50%, hsla(340,100%,76%,1) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .glass { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15); }
        .glass-panel { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(30px); border-right: 1px solid rgba(255, 255, 255, 0.5); }
        .glass-btn { background: rgba(255, 255, 255, 0.5); transition: all 0.3s ease; border: 1px solid rgba(255, 255, 255, 0.4); }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.8); transform: translateY(-2px); }
        .hide { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-mesh min-h-screen text-gray-800 antialiased flex items-center justify-center p-8">

    <!-- Desktop Frame Wrapper -->
    <div class="w-full max-w-5xl h-[800px] rounded-[2rem] shadow-2xl overflow-hidden flex glass">
        
        <!-- LEFT NAVIGATION BAR -->
        <div class="w-64 glass-panel flex flex-col py-8 px-6 z-20 relative">
            <div class="flex items-center mb-10">
                <span class="text-3xl mr-3">📸</span>
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight">PhotoBook</h1>
            </div>

            <nav class="flex-1 space-y-2">
                <button onclick="switchState('state-search')" class="w-full flex items-center px-4 py-3 glass-btn rounded-xl font-semibold text-gray-800 hover:shadow-md transition text-left"><span class="mr-3 text-lg">🔍</span> Search</button>
                <button onclick="switchState('state-feed')" class="w-full flex items-center px-4 py-3 glass-btn rounded-xl font-semibold text-gray-800 hover:shadow-md transition text-left"><span class="mr-3 text-lg">🖼️</span> Feed</button>
                <button class="w-full flex items-center px-4 py-3 rounded-xl font-semibold text-gray-700 hover:bg-white/40 transition text-left"><span class="mr-3 text-lg">📁</span> Albums</button>
                
                <div class="pt-6 pb-2">
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-wider pl-4 mb-2">Tools</p>
                    <button class="w-full flex items-center px-4 py-3 rounded-xl font-semibold text-gray-700 hover:bg-white/40 transition text-left"><span class="mr-3 text-lg">🔒</span> Vault</button>
                    <button class="w-full flex items-center px-4 py-3 rounded-xl font-semibold text-gray-700 hover:bg-white/40 transition text-left"><span class="mr-3 text-lg">👯</span> Duplicates</button>
                    <button class="w-full flex items-center px-4 py-3 rounded-xl font-semibold text-gray-700 hover:bg-white/40 transition text-left"><span class="mr-3 text-lg">🧹</span> Cleanup</button>
                </div>
            </nav>

            <div class="mt-auto">
                <button class="w-full flex items-center px-4 py-3 rounded-xl font-semibold text-gray-700 hover:bg-white/40 transition text-left"><span class="mr-3 text-lg">⚙️</span> Settings</button>
            </div>
        </div>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 relative overflow-hidden bg-white/10">
            
            <!-- STATE: SEARCH / EMPTY -->
            <div id="state-search" class="app-state absolute inset-0 flex flex-col p-10 overflow-y-auto fade-in">
                <div class="max-w-3xl mx-auto w-full pt-16">
                    <div class="text-center mb-10">
                        <div class="w-24 h-24 glass rounded-full flex items-center justify-center mx-auto mb-6 shadow-sm"><span class="text-4xl text-indigo-600">✨</span></div>
                        <h2 class="text-4xl font-bold text-gray-900 mb-3 tracking-tight">Search anything</h2>
                        <p class="text-gray-700 font-medium text-lg">Private on-device photo search. Your photos never leave this device.</p>
                    </div>

                    <div class="glass rounded-full px-6 py-4 flex items-center space-x-4 mb-10 shadow-lg border-white border-2">
                        <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        <input type="text" placeholder="Type a word, place, date, or moment..." class="bg-transparent outline-none w-full text-lg placeholder-gray-500 font-medium text-gray-900">
                        <button onclick="switchState('state-feed')" class="bg-indigo-600 text-white px-6 py-2 rounded-full font-bold shadow-md hover:bg-indigo-700 transition">Find</button>
                    </div>

                    <div>
                        <p class="text-sm font-bold text-gray-600 mb-4 uppercase tracking-wider flex items-center"><span class="text-lg mr-2">💡</span> Try searching for:</p>
                        <div class="flex flex-wrap gap-3">
                            <button onclick="switchState('state-feed')" class="glass-btn px-5 py-3 rounded-2xl font-semibold text-gray-800 flex items-center shadow-sm"><span class="mr-2">🏖️</span> "Beach 2023"</button>
                            <button onclick="switchState('state-feed')" class="glass-btn px-5 py-3 rounded-2xl font-semibold text-gray-800 flex items-center shadow-sm"><span class="mr-2">🐶</span> "Dogs playing"</button>
                            <button onclick="switchState('state-feed')" class="glass-btn px-5 py-3 rounded-2xl font-semibold text-gray-800 flex items-center shadow-sm"><span class="mr-2">🤳</span> "Selfies"</button>
                            <button onclick="switchState('state-feed')" class="glass-btn px-5 py-3 rounded-2xl font-semibold text-gray-800 flex items-center shadow-sm"><span class="mr-2">📄</span> "Documents"</button>
                            <button onclick="switchState('state-feed')" class="glass-btn px-5 py-3 rounded-2xl font-semibold text-gray-800 flex items-center shadow-sm"><span class="mr-2">🍕</span> "Food in Italy"</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- STATE: FEED -->
            <div id="state-feed" class="app-state absolute inset-0 hide flex flex-col p-8 overflow-y-auto fade-in">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-3xl font-bold text-gray-900">Results for "Mountains"</h2>
                    <div class="glass px-4 py-2 rounded-full font-medium text-sm text-gray-700">12 photos found</div>
                </div>
                
                <div class="grid grid-cols-3 gap-6">
                    <div onclick="switchState('state-detail')" class="cursor-pointer h-64 rounded-3xl bg-cover bg-center shadow-md transition transform hover:scale-[1.02] border-4 border-white/50" style="background-image: url('https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?auto=format&fit=crop&w=600&q=80');"></div>
                    <div onclick="switchState('state-detail')" class="cursor-pointer h-64 rounded-3xl bg-cover bg-center shadow-md transition transform hover:scale-[1.02] border-4 border-white/50" style="background-image: url('https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=600&q=80');"></div>
                    <div onclick="switchState('state-detail')" class="cursor-pointer h-64 rounded-3xl bg-cover bg-center shadow-md transition transform hover:scale-[1.02] border-4 border-white/50" style="background-image: url('https://images.unsplash.com/photo-1506744626753-eda81827351c?auto=format&fit=crop&w=600&q=80');"></div>
                    <div onclick="switchState('state-detail')" class="cursor-pointer col-span-2 h-80 rounded-3xl bg-cover bg-center shadow-md transition transform hover:scale-[1.02] border-4 border-white/50" style="background-image: url('https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=1000&q=80');"></div>
                    <div onclick="switchState('state-detail')" class="cursor-pointer h-80 rounded-3xl bg-cover bg-center shadow-md transition transform hover:scale-[1.02] border-4 border-white/50" style="background-image: url('https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?auto=format&fit=crop&w=600&q=80');"></div>
                </div>
            </div>

            <!-- STATE: DETAIL -->
            <div id="state-detail" class="app-state absolute inset-0 hide flex flex-col p-8 fade-in bg-white/30 backdrop-blur-md">
                <div class="flex justify-between items-center mb-6">
                    <button onclick="switchState('state-feed')" class="glass-btn px-4 py-2 rounded-full font-bold flex items-center hover:bg-white transition"><span class="mr-2">&larr;</span> Back to Results</button>
                    <div class="glass px-4 py-2 rounded-full font-medium text-sm text-gray-700">Oct 24, 2023 • Yosemite Valley</div>
                </div>
                
                <div class="flex-1 rounded-[2rem] bg-cover bg-center shadow-2xl mb-6 border-4 border-white" style="background-image: url('https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?auto=format&fit=crop&w=1200&q=100');"></div>
                
                <div class="glass rounded-[2rem] p-6 flex justify-between items-center shadow-lg">
                    <div>
                        <h3 class="text-2xl font-bold text-gray-900 mb-1">Mountain Retreat</h3>
                        <p class="text-gray-600 font-medium">4000 x 3000 • 2.4 MB</p>
                    </div>
                    <div class="flex space-x-4">
                        <button class="glass-btn px-6 py-3 rounded-xl font-bold text-pink-600 flex items-center shadow-sm"><span class="mr-2 text-xl">❤️</span> Favorite</button>
                        <button class="glass-btn px-6 py-3 rounded-xl font-bold text-blue-600 flex items-center shadow-sm"><span class="mr-2 text-xl">📤</span> Share</button>
                        <button class="glass-btn px-6 py-3 rounded-xl font-bold text-indigo-600 flex items-center shadow-sm"><span class="mr-2 text-xl">📝</span> Copy Text</button>
                        <button class="glass-btn px-6 py-3 rounded-xl font-bold text-gray-700 flex items-center shadow-sm"><span class="mr-2 text-xl">🔒</span> Vault</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function switchState(stateId) {
            document.querySelectorAll('.app-state').forEach(el => el.classList.add('hide'));
            document.getElementById(stateId).classList.remove('hide');
        }
    </script>
</body>
</html>
