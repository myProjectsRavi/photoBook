<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Multi-Colored - Split Sidebar Glass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .bg-mesh {
            background-color: #ffecd2;
            background-image: 
                radial-gradient(at 40% 20%, hsla(28,100%,74%,1) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(340,100%,76%,1) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(355,100%,93%,1) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .glass-solid { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(40px); box-shadow: 10px 0 30px rgba(0,0,0,0.05); }
        .glass-btn { background: rgba(255, 255, 255, 0.5); transition: all 0.3s ease; border: 1px solid rgba(255, 255, 255, 0.8); }
        .glass-btn:hover { background: rgba(255, 255, 255, 1); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .hide { display: none !important; }
        .fade-in { animation: popIn 0.3s ease-out forwards; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.99); } to { opacity: 1; transform: scale(1); } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-mesh min-h-screen text-gray-800 antialiased flex items-center justify-center p-8">

    <!-- Desktop Frame Wrapper - Edge to Edge -->
    <div class="w-full max-w-[1200px] h-[800px] rounded-[2rem] shadow-2xl overflow-hidden flex bg-white/30 backdrop-blur-xl border-[4px] border-white/60">
        
        <!-- SOLID GLASS SIDEBAR -->
        <div class="w-80 glass-solid flex flex-col py-10 px-8 z-20">
            <div class="flex items-center mb-12">
                <div class="w-12 h-12 bg-gradient-to-br from-orange-400 to-pink-500 rounded-xl flex items-center justify-center text-white text-2xl shadow-lg mr-4">✦</div>
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight">PhotoBook</h1>
            </div>

            <nav class="flex-1 space-y-3">
                <button onclick="switchState('state-search')" class="w-full flex items-center px-5 py-4 bg-white rounded-2xl font-bold text-gray-900 shadow-sm text-left border border-gray-100"><span class="mr-4 text-xl">🔍</span> Search</button>
                <button onclick="switchState('state-feed')" class="w-full flex items-center px-5 py-4 hover:bg-white/50 rounded-2xl font-bold text-gray-600 transition text-left"><span class="mr-4 text-xl">🖼️</span> Feed</button>
                <button class="w-full flex items-center px-5 py-4 hover:bg-white/50 rounded-2xl font-bold text-gray-600 transition text-left"><span class="mr-4 text-xl">📁</span> Albums</button>
                
                <div class="pt-8 pb-2">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-widest pl-5 mb-3">Organization</p>
                    <button class="w-full flex items-center px-5 py-3.5 hover:bg-white/50 rounded-2xl font-bold text-gray-600 transition text-left"><span class="mr-4 text-xl">🔒</span> Vault</button>
                    <button class="w-full flex items-center px-5 py-3.5 hover:bg-white/50 rounded-2xl font-bold text-gray-600 transition text-left"><span class="mr-4 text-xl">👯</span> Duplicates</button>
                    <button class="w-full flex items-center px-5 py-3.5 hover:bg-white/50 rounded-2xl font-bold text-gray-600 transition text-left"><span class="mr-4 text-xl">🧹</span> Cleanup</button>
                </div>
            </nav>

            <div class="mt-auto">
                <button class="w-full flex items-center px-5 py-4 hover:bg-white/50 rounded-2xl font-bold text-gray-600 transition text-left"><span class="mr-4 text-xl">⚙️</span> Settings</button>
            </div>
        </div>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 relative overflow-hidden">
            
            <!-- STATE: SEARCH / EMPTY -->
            <div id="state-search" class="app-state absolute inset-0 flex flex-col p-12 overflow-y-auto fade-in">
                <div class="max-w-3xl mx-auto w-full pt-16">
                    <div class="text-center mb-12">
                        <h2 class="text-5xl font-bold text-gray-900 mb-4 tracking-tight">Search anything</h2>
                        <p class="text-gray-700 font-medium text-xl opacity-80">Private on-device photo search. Your photos never leave this device.</p>
                    </div>

                    <div class="bg-white/80 backdrop-blur-md rounded-[2rem] px-8 py-5 flex items-center space-x-4 mb-12 shadow-xl border border-white">
                        <span class="text-2xl opacity-50">🔍</span>
                        <input type="text" placeholder="Type a word, place, date, or moment..." class="bg-transparent outline-none w-full text-2xl placeholder-gray-500 font-bold text-gray-900">
                        <button onclick="switchState('state-feed')" class="bg-gradient-to-r from-orange-400 to-pink-500 text-white px-8 py-3.5 rounded-xl font-bold shadow-lg hover:opacity-90 transition text-xl">Find</button>
                    </div>

                    <div class="bg-white/50 backdrop-blur-md p-8 rounded-[2rem] border border-white shadow-sm">
                        <p class="text-sm font-bold text-gray-600 mb-6 uppercase tracking-widest flex items-center"><span class="text-xl mr-3">💡</span> Try searching for:</p>
                        <div class="flex flex-wrap gap-4">
                            <button onclick="switchState('state-feed')" class="glass-btn px-6 py-4 rounded-xl font-bold text-gray-800 flex items-center shadow-sm text-lg"><span class="mr-3 text-2xl">🏖️</span> "Beach 2023"</button>
                            <button onclick="switchState('state-feed')" class="glass-btn px-6 py-4 rounded-xl font-bold text-gray-800 flex items-center shadow-sm text-lg"><span class="mr-3 text-2xl">🐶</span> "Dogs playing"</button>
                            <button onclick="switchState('state-feed')" class="glass-btn px-6 py-4 rounded-xl font-bold text-gray-800 flex items-center shadow-sm text-lg"><span class="mr-3 text-2xl">🤳</span> "Selfies"</button>
                            <button onclick="switchState('state-feed')" class="glass-btn px-6 py-4 rounded-xl font-bold text-gray-800 flex items-center shadow-sm text-lg"><span class="mr-3 text-2xl">📄</span> "Documents"</button>
                            <button onclick="switchState('state-feed')" class="glass-btn px-6 py-4 rounded-xl font-bold text-gray-800 flex items-center shadow-sm text-lg"><span class="mr-3 text-2xl">🍕</span> "Food in Italy"</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- STATE: FEED -->
            <div id="state-feed" class="app-state absolute inset-0 hide flex flex-col p-10 overflow-y-auto fade-in">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-4xl font-bold text-gray-900">Results for "Mountains"</h2>
                    <div class="bg-white/50 backdrop-blur-md px-6 py-3 rounded-full font-bold text-gray-700 shadow-sm border border-white">12 photos found</div>
                </div>
                
                <div class="grid grid-cols-3 gap-6">
                    <div onclick="switchState('state-detail')" class="cursor-pointer h-72 rounded-[2rem] bg-cover bg-center shadow-md transition transform hover:scale-[1.02] border-[4px] border-white/60" style="background-image: url('https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?auto=format&fit=crop&w=600&q=80');"></div>
                    <div onclick="switchState('state-detail')" class="cursor-pointer h-72 rounded-[2rem] bg-cover bg-center shadow-md transition transform hover:scale-[1.02] border-[4px] border-white/60" style="background-image: url('https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=600&q=80');"></div>
                    <div onclick="switchState('state-detail')" class="cursor-pointer h-72 rounded-[2rem] bg-cover bg-center shadow-md transition transform hover:scale-[1.02] border-[4px] border-white/60" style="background-image: url('https://images.unsplash.com/photo-1506744626753-eda81827351c?auto=format&fit=crop&w=600&q=80');"></div>
                    <div onclick="switchState('state-detail')" class="cursor-pointer col-span-2 h-[26rem] rounded-[2rem] bg-cover bg-center shadow-md transition transform hover:scale-[1.02] border-[4px] border-white/60" style="background-image: url('https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=1000&q=80');"></div>
                    <div onclick="switchState('state-detail')" class="cursor-pointer h-[26rem] rounded-[2rem] bg-cover bg-center shadow-md transition transform hover:scale-[1.02] border-[4px] border-white/60" style="background-image: url('https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?auto=format&fit=crop&w=600&q=80');"></div>
                </div>
            </div>

            <!-- STATE: DETAIL (Slide over right pane) -->
            <!-- We will make this fill the content area, but design it to look like a massive card -->
            <div id="state-detail" class="app-state absolute inset-0 hide flex flex-col p-10 fade-in">
                <div class="flex-1 bg-white/80 backdrop-blur-2xl rounded-[2.5rem] shadow-2xl border border-white flex flex-col overflow-hidden">
                    <div class="flex justify-between items-center p-6 border-b border-gray-100">
                        <button onclick="switchState('state-feed')" class="bg-gray-100 px-5 py-3 rounded-xl font-bold flex items-center hover:bg-gray-200 transition text-gray-800 text-lg"><span class="mr-2 text-xl">&larr;</span> Back</button>
                        <div class="font-bold text-sm text-gray-500 uppercase tracking-widest">Oct 24, 2023 • Yosemite Valley</div>
                        <div class="w-20"></div> <!-- spacer -->
                    </div>
                    
                    <div class="flex-1 bg-cover bg-contain bg-no-repeat bg-center bg-[#F3F4F6]" style="background-image: url('https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?auto=format&fit=crop&w=1200&q=100');"></div>
                    
                    <div class="p-8 flex justify-between items-center bg-white">
                        <div>
                            <h3 class="text-3xl font-extrabold text-gray-900 mb-1">Mountain Retreat</h3>
                            <p class="text-gray-500 font-bold text-lg">4000 x 3000 • 2.4 MB</p>
                        </div>
                        <div class="flex space-x-3">
                            <button class="bg-pink-50 hover:bg-pink-100 px-6 py-4 rounded-xl font-bold text-pink-600 flex items-center transition text-lg"><span class="mr-2 text-xl">❤️</span> Favorite</button>
                            <button class="bg-blue-50 hover:bg-blue-100 px-6 py-4 rounded-xl font-bold text-blue-600 flex items-center transition text-lg"><span class="mr-2 text-xl">📤</span> Share</button>
                            <button class="bg-indigo-50 hover:bg-indigo-100 px-6 py-4 rounded-xl font-bold text-indigo-600 flex items-center transition text-lg"><span class="mr-2 text-xl">📝</span> Copy Text</button>
                            <button class="bg-gray-100 hover:bg-gray-200 px-6 py-4 rounded-xl font-bold text-gray-800 flex items-center transition text-lg"><span class="mr-2 text-xl">🔒</span> Vault</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function switchState(stateId) {
            document.querySelectorAll('.app-state').forEach(el => el.classList.add('hide'));
            document.getElementById(stateId).classList.remove('hide');
        }
    </script>
</body>
</html>
