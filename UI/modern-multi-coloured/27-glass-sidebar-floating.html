<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Multi-Colored - Floating Glass Sidebar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .bg-mesh {
            background-color: #8ec5fc;
            background-image: 
                radial-gradient(at 40% 20%, hsla(280,100%,74%,1) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189,100%,56%,1) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(355,100%,93%,1) 0px, transparent 50%),
                radial-gradient(at 80% 50%, hsla(340,100%,76%,1) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .glass { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1); }
        .glass-btn { background: rgba(255, 255, 255, 0.5); transition: all 0.3s ease; border: 1px solid rgba(255, 255, 255, 0.4); }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.8); transform: translateY(-2px); }
        .hide { display: none !important; }
        .fade-in { animation: popIn 0.4s ease-out forwards; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-mesh min-h-screen text-gray-800 antialiased flex items-center justify-center p-8">

    <!-- Desktop Frame Wrapper -->
    <div class="w-full max-w-6xl h-[800px] flex gap-6">
        
        <!-- FLOATING LEFT NAVIGATION BAR -->
        <div class="w-72 glass rounded-[2.5rem] flex flex-col py-8 px-6 z-20 shadow-2xl">
            <div class="flex items-center mb-10 pl-2">
                <span class="text-3xl mr-3">🎨</span>
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight">PhotoBook</h1>
            </div>

            <nav class="flex-1 space-y-3">
                <button onclick="switchState('state-search')" class="w-full flex items-center px-5 py-4 glass-btn rounded-[1.5rem] font-bold text-gray-800 hover:shadow-md transition text-left"><span class="mr-4 text-xl">🔍</span> Search</button>
                <button onclick="switchState('state-feed')" class="w-full flex items-center px-5 py-4 glass-btn rounded-[1.5rem] font-bold text-gray-800 hover:shadow-md transition text-left"><span class="mr-4 text-xl">🖼️</span> Feed</button>
                <button class="w-full flex items-center px-5 py-4 rounded-[1.5rem] font-bold text-gray-600 hover:bg-white/40 transition text-left"><span class="mr-4 text-xl">📁</span> Albums</button>
                
                <div class="pt-6 pb-2">
                    <p class="text-xs font-extrabold text-gray-500 uppercase tracking-widest pl-5 mb-3">Tools</p>
                    <button class="w-full flex items-center px-5 py-3 rounded-2xl font-semibold text-gray-600 hover:bg-white/40 transition text-left"><span class="mr-4 text-xl">🔒</span> Vault</button>
                    <button class="w-full flex items-center px-5 py-3 rounded-2xl font-semibold text-gray-600 hover:bg-white/40 transition text-left"><span class="mr-4 text-xl">👯</span> Duplicates</button>
                    <button class="w-full flex items-center px-5 py-3 rounded-2xl font-semibold text-gray-600 hover:bg-white/40 transition text-left"><span class="mr-4 text-xl">🧹</span> Cleanup</button>
                </div>
            </nav>

            <div class="mt-auto">
                <button class="w-full flex items-center px-5 py-4 rounded-[1.5rem] font-bold text-gray-600 hover:bg-white/40 transition text-left"><span class="mr-4 text-xl">⚙️</span> Settings</button>
            </div>
        </div>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 relative overflow-hidden glass rounded-[2.5rem] shadow-2xl border-[6px] border-white/30">
            
            <!-- STATE: SEARCH / EMPTY -->
            <div id="state-search" class="app-state absolute inset-0 flex flex-col p-12 overflow-y-auto fade-in">
                <div class="max-w-3xl mx-auto w-full pt-12">
                    <div class="text-center mb-12">
                        <div class="w-24 h-24 glass rounded-[2rem] flex items-center justify-center mx-auto mb-8 shadow-sm rotate-6"><span class="text-4xl text-blue-600 -rotate-6">✨</span></div>
                        <h2 class="text-4xl font-extrabold text-gray-900 mb-4 tracking-tight">Search anything</h2>
                        <p class="text-gray-700 font-medium text-xl">Private on-device photo search. Your photos never leave this device.</p>
                    </div>

                    <div class="glass rounded-[2rem] px-6 py-4 flex items-center space-x-4 mb-12 shadow-lg border-white border-2">
                        <svg class="w-8 h-8 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        <input type="text" placeholder="Type a word, place, date, or moment..." class="bg-transparent outline-none w-full text-xl placeholder-gray-500 font-bold text-gray-900">
                        <button onclick="switchState('state-feed')" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold shadow-md hover:bg-blue-700 transition text-lg">Find</button>
                    </div>

                    <div class="glass p-8 rounded-[2rem]">
                        <p class="text-sm font-extrabold text-gray-500 mb-6 uppercase tracking-widest flex items-center"><span class="text-xl mr-3">💡</span> Try searching for:</p>
                        <div class="flex flex-wrap gap-4">
                            <button onclick="switchState('state-feed')" class="glass-btn px-6 py-3.5 rounded-xl font-bold text-gray-800 flex items-center shadow-sm hover:scale-105 transition text-lg"><span class="mr-3">🏖️</span> "Beach 2023"</button>
                            <button onclick="switchState('state-feed')" class="glass-btn px-6 py-3.5 rounded-xl font-bold text-gray-800 flex items-center shadow-sm hover:scale-105 transition text-lg"><span class="mr-3">🐶</span> "Dogs playing"</button>
                            <button onclick="switchState('state-feed')" class="glass-btn px-6 py-3.5 rounded-xl font-bold text-gray-800 flex items-center shadow-sm hover:scale-105 transition text-lg"><span class="mr-3">🤳</span> "Selfies"</button>
                            <button onclick="switchState('state-feed')" class="glass-btn px-6 py-3.5 rounded-xl font-bold text-gray-800 flex items-center shadow-sm hover:scale-105 transition text-lg"><span class="mr-3">📄</span> "Documents"</button>
                            <button onclick="switchState('state-feed')" class="glass-btn px-6 py-3.5 rounded-xl font-bold text-gray-800 flex items-center shadow-sm hover:scale-105 transition text-lg"><span class="mr-3">🍕</span> "Food in Italy"</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- STATE: FEED -->
            <div id="state-feed" class="app-state absolute inset-0 hide flex flex-col p-8 overflow-y-auto fade-in">
                <div class="flex justify-between items-center mb-8 bg-white/20 p-4 rounded-[2rem] backdrop-blur-md border border-white/40 shadow-sm">
                    <h2 class="text-2xl font-bold text-gray-900 ml-4">Results for "Mountains"</h2>
                    <div class="bg-white/60 px-5 py-2 rounded-xl font-bold text-sm text-blue-700 shadow-sm">12 photos found</div>
                </div>
                
                <div class="grid grid-cols-3 gap-6">
                    <div onclick="switchState('state-detail')" class="cursor-pointer h-64 rounded-3xl bg-cover bg-center shadow-md transition transform hover:scale-[1.02] border-[6px] border-white/60" style="background-image: url('https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?auto=format&fit=crop&w=600&q=80');"></div>
                    <div onclick="switchState('state-detail')" class="cursor-pointer h-64 rounded-3xl bg-cover bg-center shadow-md transition transform hover:scale-[1.02] border-[6px] border-white/60" style="background-image: url('https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=600&q=80');"></div>
                    <div onclick="switchState('state-detail')" class="cursor-pointer h-64 rounded-3xl bg-cover bg-center shadow-md transition transform hover:scale-[1.02] border-[6px] border-white/60" style="background-image: url('https://images.unsplash.com/photo-1506744626753-eda81827351c?auto=format&fit=crop&w=600&q=80');"></div>
                    <div onclick="switchState('state-detail')" class="cursor-pointer col-span-2 h-80 rounded-3xl bg-cover bg-center shadow-md transition transform hover:scale-[1.02] border-[6px] border-white/60" style="background-image: url('https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=1000&q=80');"></div>
                    <div onclick="switchState('state-detail')" class="cursor-pointer h-80 rounded-3xl bg-cover bg-center shadow-md transition transform hover:scale-[1.02] border-[6px] border-white/60" style="background-image: url('https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?auto=format&fit=crop&w=600&q=80');"></div>
                </div>
            </div>

            <!-- STATE: DETAIL -->
            <div id="state-detail" class="app-state absolute inset-0 hide flex flex-col p-8 fade-in bg-white/40 backdrop-blur-xl">
                <div class="flex justify-between items-center mb-6">
                    <button onclick="switchState('state-feed')" class="glass-btn px-5 py-3 rounded-xl font-bold flex items-center hover:bg-white transition shadow-sm text-gray-800"><span class="mr-2 text-xl">&larr;</span> Back to Results</button>
                    <div class="bg-white/80 px-5 py-3 rounded-xl font-bold text-sm text-gray-700 shadow-sm border border-white">Oct 24, 2023 • Yosemite Valley</div>
                </div>
                
                <div class="flex-1 rounded-[2.5rem] bg-cover bg-contain bg-no-repeat bg-center shadow-2xl mb-6 border-[8px] border-white/80" style="background-image: url('https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?auto=format&fit=crop&w=1200&q=100');"></div>
                
                <div class="glass rounded-[2.5rem] p-6 flex justify-between items-center shadow-xl border-2 border-white">
                    <div class="pl-2">
                        <h3 class="text-3xl font-extrabold text-gray-900 mb-2">Mountain Retreat</h3>
                        <p class="text-gray-600 font-bold">4000 x 3000 • 2.4 MB</p>
                    </div>
                    <div class="flex space-x-3">
                        <button class="bg-white/80 hover:bg-white px-6 py-4 rounded-2xl font-bold text-pink-600 flex items-center shadow-sm transition"><span class="mr-3 text-2xl">❤️</span> Favorite</button>
                        <button class="bg-white/80 hover:bg-white px-6 py-4 rounded-2xl font-bold text-blue-600 flex items-center shadow-sm transition"><span class="mr-3 text-2xl">📤</span> Share</button>
                        <button class="bg-white/80 hover:bg-white px-6 py-4 rounded-2xl font-bold text-indigo-600 flex items-center shadow-sm transition"><span class="mr-3 text-2xl">📝</span> Copy Text</button>
                        <button class="bg-white/80 hover:bg-white px-6 py-4 rounded-2xl font-bold text-gray-800 flex items-center shadow-sm transition"><span class="mr-3 text-2xl">🔒</span> Move to Vault</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function switchState(stateId) {
            document.querySelectorAll('.app-state').forEach(el => el.classList.add('hide'));
            document.getElementById(stateId).classList.remove('hide');
        }
    </script>
</body>
</html>
