<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Book - Glassmorphism Prime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .bg-mesh {
            background-color: #ff99f0;
            background-image: 
                radial-gradient(at 40% 20%, hsla(28,100%,74%,1) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189,100%,56%,1) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(355,100%,93%,1) 0px, transparent 50%),
                radial-gradient(at 80% 50%, hsla(340,100%,76%,1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(22,100%,77%,1) 0px, transparent 50%),
                radial-gradient(at 80% 100%, hsla(242,100%,70%,1) 0px, transparent 50%),
                radial-gradient(at 0% 0%, hsla(343,100%,76%,1) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }
        .hide { display: none; }
    </style>
</head>
<body class="bg-mesh min-h-screen text-gray-800 antialiased overflow-hidden flex flex-col items-center justify-center">

    <!-- Mobile Device Frame Wrapper -->
    <div class="relative w-full max-w-md h-[850px] max-h-[95vh] rounded-[3rem] border-[8px] border-white/40 shadow-2xl overflow-hidden flex flex-col relative z-10 glass">
        
        <!-- Header / Search -->
        <div class="pt-12 pb-4 px-6 z-20">
            <div class="glass rounded-full px-5 py-3 flex items-center space-x-3">
                <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" placeholder="Search... try today or selfie" class="bg-transparent outline-none w-full placeholder-gray-600 font-medium text-gray-800">
            </div>
            
            <div class="mt-6 flex justify-between items-center text-sm font-semibold">
                <p class="text-gray-800 leading-tight w-1/2">Private, secure, and fully on-device.</p>
                <div class="flex space-x-4 text-indigo-700">
                    <button class="hover:text-indigo-900 transition">Declutter</button>
                    <button class="hover:text-indigo-900 transition">Storage</button>
                </div>
            </div>

            <!-- Chips -->
            <div class="mt-6 flex space-x-3 overflow-x-auto pb-2 scrollbar-hide">
                <button class="glass-btn px-4 py-2 rounded-2xl text-sm font-medium whitespace-nowrap">WhatsApp</button>
                <button class="glass-btn px-4 py-2 rounded-2xl text-sm font-medium whitespace-nowrap">Telegram</button>
                <button class="glass-btn px-4 py-2 rounded-2xl text-sm font-medium whitespace-nowrap">Camera</button>
            </div>
        </div>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 overflow-y-auto px-6 pb-24 relative z-0" id="main-content">
            
            <!-- STATE: BEFORE LOAD -->
            <div id="state-before" class="h-full flex flex-col items-center justify-center text-center space-y-6">
                <div class="w-32 h-32 glass rounded-full flex items-center justify-center mb-4">
                    <svg class="w-16 h-16 text-indigo-600 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <h2 class="text-3xl font-bold text-gray-900">Search anything</h2>
                <p class="text-gray-700 font-medium">Private on-device photo search. Your photos never leave this device.</p>
                <div class="glass w-full py-4 rounded-2xl mt-8">
                    <p class="text-gray-600 font-medium text-sm">No photos in this feed yet.</p>
                </div>
            </div>

            <!-- STATE: AFTER LOAD -->
            <div id="state-after" class="hide space-y-4">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-gray-900">Today</h3>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="h-40 rounded-3xl bg-cover bg-center shadow-md transition transform hover:scale-105" style="background-image: url('https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60');"></div>
                    <div class="h-40 rounded-3xl bg-cover bg-center shadow-md transition transform hover:scale-105" style="background-image: url('https://images.unsplash.com/photo-1682687982501-1e5898cb8f4b?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60');"></div>
                    <div class="h-40 rounded-3xl bg-cover bg-center shadow-md transition transform hover:scale-105 col-span-2" style="background-image: url('https://images.unsplash.com/photo-1472214103451-9374bd1c798e?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=60');"></div>
                </div>
                <div class="flex justify-between items-center mt-6 mb-4">
                    <h3 class="text-lg font-bold text-gray-900">Yesterday</h3>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div class="h-24 rounded-2xl bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=60');"></div>
                    <div class="h-24 rounded-2xl bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=60');"></div>
                    <div class="h-24 rounded-2xl bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=60');"></div>
                </div>
            </div>

            <!-- STATE: AFTER NAVIGATING (Viewing a Photo) -->
            <div id="state-nav" class="hide h-full flex flex-col">
                <div class="flex-1 rounded-3xl bg-cover bg-center shadow-2xl relative overflow-hidden" style="background-image: url('https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=60');">
                    <!-- Overlay controls -->
                    <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-center bg-gradient-to-b from-black/50 to-transparent">
                        <button class="text-white p-2 glass rounded-full"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg></button>
                        <div class="flex space-x-2">
                            <button class="text-white p-2 glass rounded-full"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg></button>
                        </div>
                    </div>
                </div>
                <div class="glass mt-4 p-5 rounded-3xl">
                    <h3 class="text-xl font-bold text-gray-900">Mountain Retreat</h3>
                    <p class="text-sm text-gray-700 mt-1">Oct 24, 2023 • 2.4 MB • 4K</p>
                    <div class="mt-4 flex space-x-3">
                        <button class="flex-1 glass-btn py-3 rounded-2xl font-semibold text-indigo-700">Share</button>
                        <button class="flex-1 glass-btn py-3 rounded-2xl font-semibold text-red-600">Delete</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Floating Action Bar -->
        <div class="absolute right-4 bottom-12 glass rounded-full flex flex-col items-center py-4 space-y-5 shadow-2xl z-20">
            <button class="p-2 text-gray-800 hover:text-indigo-600 transition transform hover:scale-110"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg></button>
            <button class="p-2 text-gray-800 hover:text-indigo-600 transition transform hover:scale-110"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></button>
            <button class="p-2 text-indigo-600 glass rounded-full transition transform hover:scale-110"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
        </div>
    </div>

    <!-- Prototype Controls (For Reviewer) -->
    <div class="fixed bottom-4 right-4 bg-white/90 backdrop-blur-md p-4 rounded-2xl shadow-xl border border-gray-200 z-50 flex space-x-2">
        <span class="text-sm font-bold mr-2 self-center">State:</span>
        <button onclick="setState('before')" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-sm font-medium">Before Load</button>
        <button onclick="setState('after')" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-sm font-medium">After Load</button>
        <button onclick="setState('nav')" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-sm font-medium">After Navigating</button>
    </div>

    <script>
        function setState(state) {
            document.getElementById('state-before').classList.add('hide');
            document.getElementById('state-after').classList.add('hide');
            document.getElementById('state-nav').classList.add('hide');
            
            document.getElementById('state-' + state).classList.remove('hide');
        }
    </script>
</body>
</html>
