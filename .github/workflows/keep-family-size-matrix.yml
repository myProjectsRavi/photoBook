name: Keep Family Size Matrix (Disposable)

on:
  push:
    branches:
      - exp/2.0.15-keep-family-size-matrix

permissions:
  contents: read

jobs:
  measure:
    name: measure-${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        group: [baseline, mlkit, crypto, room, work, zxing, all]
    env:
      GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply identical size candidate plus selected keep-family removal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          group = os.environ['GROUP']

          build = Path('app/build.gradle.kts')
          s = build.read_text()
          old_jni = "        jniLibs {\n            // Ensure native libs are stored uncompressed and 16KB page-aligned\n            // Required by Google Play for devices with 16KB memory pages\n            useLegacyPackaging = false\n        }\n"
          new_jni = "        jniLibs {\n            // Ensure native libs are stored uncompressed and 16KB page-aligned\n            // Required by Google Play for devices with 16KB memory pages\n            useLegacyPackaging = false\n            excludes += setOf(\"**/x86/**\", \"**/x86_64/**\")\n        }\n"
          if s.count(old_jni) != 1:
              raise SystemExit(f'JNI block mismatch: {s.count(old_jni)}')
          s = s.replace(old_jni, new_jni, 1)

          material = '    implementation("com.google.android.material:material:1.12.0")\n'
          appcompat = '    implementation("androidx.appcompat:appcompat:1.6.1")\n'
          if s.count(material) != 1:
              raise SystemExit(f'Material dependency mismatch: {s.count(material)}')
          build.write_text(s.replace(material, appcompat, 1))

          theme = Path('app/src/main/res/values/themes.xml')
          t = theme.read_text()
          old_theme = 'parent="Theme.Material3.DayNight.NoActionBar"'
          new_theme = 'parent="Theme.AppCompat.DayNight.NoActionBar"'
          if t.count(old_theme) != 1:
              raise SystemExit(f'theme mismatch: {t.count(old_theme)}')
          theme.write_text(t.replace(old_theme, new_theme, 1))

          families = {
              'mlkit': [
                  '-keep class com.google.mlkit.** { *; }\n',
              ],
              'crypto': [
                  '-keep class androidx.security.crypto.** { *; }\n',
                  '-keep class com.google.crypto.tink.** { *; }\n',
              ],
              'room': [
                  '-keep class * extends androidx.room.RoomDatabase { *; }\n',
                  '-keep @androidx.room.Entity class * { *; }\n',
                  '-keep @androidx.room.Dao interface * { *; }\n',
              ],
              'work': [
                  '-keep class * extends androidx.work.Worker { *; }\n',
                  '-keep class * extends androidx.work.CoroutineWorker { *; }\n',
                  '-keep class * extends androidx.work.ListenableWorker { *; }\n',
              ],
              'zxing': [
                  '-keep class com.google.zxing.** { *; }\n',
              ],
          }
          if group not in {'baseline', 'all', *families.keys()}:
              raise SystemExit(f'unknown group: {group}')

          selected = []
          if group == 'all':
              for rules in families.values():
                  selected.extend(rules)
          elif group != 'baseline':
              selected.extend(families[group])

          rules_file = Path('app/proguard-rules.pro')
          r = rules_file.read_text()
          for rule in selected:
              if r.count(rule) != 1:
                  raise SystemExit(f'expected exactly one rule {rule!r}; found {r.count(rule)}')
              r = r.replace(rule, '', 1)
          rules_file.write_text(r)
          print(f'group={group} removed_rules={len(selected)}')
          PY

      - name: Build exact release bundle
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease -x :app:verifyReleaseBundleSize

      - name: Report exact bundle bytes
        shell: bash
        run: |
          set -euo pipefail
          report="build/reports/keep-family-size/$GROUP"
          mkdir -p "$report"
          python3 - <<'PY' | tee "$report/result.txt"
          from pathlib import Path
          import os, subprocess, zipfile

          group = os.environ['GROUP']
          aab = Path('app/build/outputs/bundle/release/app-release.aab')
          limit = 20 * 1024 * 1024
          size = aab.stat().st_size
          with zipfile.ZipFile(aab) as z:
              abis = sorted({n.split('/lib/',1)[1].split('/',1)[0] for n in z.namelist() if '/lib/' in n and n.endswith('.so')})
              dex = sum(i.compress_size for i in z.infolist() if '/dex/' in i.filename)
              mapping = sum(i.compress_size for i in z.infolist() if i.filename.endswith('/proguard.map'))
          print('source_sha=' + subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip())
          print(f'group={group}')
          print(f'aab_bytes={size}')
          print(f'aab_mib={size/1024/1024:.3f}')
          print(f'aab_margin_bytes={limit-size}')
          print(f'aab_under_20_mib={size <= limit}')
          print('aab_abis=' + ','.join(abis))
          print(f'dex_compressed_bytes={dex}')
          print(f'proguard_map_compressed_bytes={mapping}')
          if abis != ['arm64-v8a', 'armeabi-v7a']:
              raise SystemExit(f'unexpected ABIs: {abis}')
          PY

      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keep-family-size-${{ matrix.group }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: build/reports/keep-family-size/${{ matrix.group }}/
