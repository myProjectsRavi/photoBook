name: Dependency Size Measurement (Disposable)

on:
  push:
    branches:
      - "exp/2.0.15-dependency-size-measurement"

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        variant: [remove-material-views, coil-compose-base]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Inject best-known size configuration and dependency variant
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          build = Path("app/build.gradle.kts")
          s = build.read_text()
          old_ndk = '            ndk {\n                debugSymbolLevel = "SYMBOL_TABLE"\n            }\n'
          new_ndk = '            ndk {\n                debugSymbolLevel = "SYMBOL_TABLE"\n                abiFilters += listOf("arm64-v8a", "armeabi-v7a")\n            }\n'
          if s.count(old_ndk) != 1:
              raise SystemExit(f"release ndk block mismatch: {s.count(old_ndk)}")
          s = s.replace(old_ndk, new_ndk, 1)
          old_split = '        abi {\n            isEnable = true\n            reset()\n            include("arm64-v8a", "armeabi-v7a")'
          new_split = '        abi {\n            isEnable = false\n            reset()\n            include("arm64-v8a", "armeabi-v7a")'
          if s.count(old_split) != 1:
              raise SystemExit(f"ABI split block mismatch: {s.count(old_split)}")
          s = s.replace(old_split, new_split, 1)

          variant = os.environ['VARIANT']
          if variant == 'remove-material-views':
              dep = '    implementation("com.google.android.material:material:1.12.0")\n'
              if s.count(dep) != 1:
                  raise SystemExit(f"material dependency mismatch: {s.count(dep)}")
              s = s.replace(dep, '', 1)
          elif variant == 'coil-compose-base':
              dep = '    implementation("io.coil-kt:coil-compose:2.6.0")\n'
              repl = '    implementation("io.coil-kt:coil-compose-base:2.6.0")\n'
              if s.count(dep) != 1:
                  raise SystemExit(f"Coil dependency mismatch: {s.count(dep)}")
              s = s.replace(dep, repl, 1)
          else:
              raise SystemExit(f"unknown variant {variant}")
          build.write_text(s)

          rules = Path("app/proguard-rules.pro")
          r = rules.read_text()
          removable = [
              '-keep class com.google.mlkit.** { *; }\n',
              '-keep class androidx.security.crypto.** { *; }\n',
              '-keep class com.google.crypto.tink.** { *; }\n',
              '-keep class * extends androidx.room.RoomDatabase { *; }\n',
              '-keep @androidx.room.Entity class * { *; }\n',
              '-keep @androidx.room.Dao interface * { *; }\n',
              '-keep class * extends androidx.work.Worker { *; }\n',
              '-keep class * extends androidx.work.CoroutineWorker { *; }\n',
              '-keep class * extends androidx.work.ListenableWorker { *; }\n',
              '-keep class com.google.zxing.** { *; }\n',
          ]
          for rule in removable:
              if r.count(rule) != 1:
                  raise SystemExit(f"expected exactly one rule: {rule!r}; found {r.count(rule)}")
              r = r.replace(rule, '', 1)
          rules.write_text(r)
          PY
          echo "variant=$VARIANT"
          git diff -- app/build.gradle.kts app/proguard-rules.pro

      - name: Run unit tests, lint, and build measurement AAB
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:bundleRelease \
            -x :app:verifyReleaseBundleSize

      - name: Report exact AAB size
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          mkdir -p "build/reports/dependency-size/$VARIANT"
          python3 - <<'PY' | tee "build/reports/dependency-size/$VARIANT/result.txt"
          from pathlib import Path
          import os, zipfile
          aab = Path("app/build/outputs/bundle/release/app-release.aab")
          if not aab.is_file():
              raise SystemExit("AAB missing")
          limit = 20 * 1024 * 1024
          size = aab.stat().st_size
          print(f"variant={os.environ['VARIANT']}")
          print(f"aab_bytes={size}")
          print(f"aab_mib={size / 1024 / 1024:.2f}")
          print(f"under_20_mib={size <= limit}")
          print(f"margin_bytes={limit - size}")
          with zipfile.ZipFile(aab) as z:
              names = z.namelist()
              libs = [n for n in names if "/lib/" in n and n.endswith(".so")]
              abis = sorted({n.split("/lib/", 1)[1].split("/", 1)[0] for n in libs})
              print("abis=" + ",".join(abis))
              mapping = next((z.getinfo(n) for n in names if n.endswith("/proguard.map")), None)
              if mapping:
                  print(f"mapping_compressed_bytes={mapping.compress_size}")
              dexes = [z.getinfo(n) for n in names if "/dex/classes" in n and n.endswith(".dex")]
              print(f"dex_compressed_bytes={sum(i.compress_size for i in dexes)}")
              publicsuffix = next((z.getinfo(n) for n in names if n.endswith("publicsuffixes.gz")), None)
              print(f"okhttp_publicsuffix_present={publicsuffix is not None}")
              if publicsuffix:
                  print(f"okhttp_publicsuffix_compressed_bytes={publicsuffix.compress_size}")
          if abis != ["arm64-v8a", "armeabi-v7a"]:
              raise SystemExit(f"Unexpected AAB ABIs: {abis}")
          PY

      - name: Upload measurement report
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-size-${{ matrix.variant }}-${{ github.run_id }}
          path: build/reports/dependency-size/${{ matrix.variant }}/result.txt
          if-no-files-found: error
          retention-days: 14
