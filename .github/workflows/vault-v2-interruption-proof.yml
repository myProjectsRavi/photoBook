name: Vault v2 Interruption Recovery Proof (Disposable)

on:
  push:
    branches:
      - exp/2.0.15-vault-v2-interruption-proof

permissions:
  contents: read

jobs:
  recovery-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FEATURE_SHA: d2017c22241049b21fcdd99e5a2e92d8bf382d01
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prove exact feature tree plus disposable workflow only
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$FEATURE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 1
          grep -Fxq '.github/workflows/vault-v2-interruption-proof.yml' <<< "$changed"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install emulator host runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0

      - name: Add ephemeral interruption recovery instrumentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/androidTest/java/com/photobook/app/feature/vault
          cat > app/src/androidTest/java/com/photobook/app/feature/vault/VaultMigrationInterruptionInstrumentedTest.kt <<'KOTLIN'
          package com.photobook.app.feature.vault

          import androidx.security.crypto.EncryptedFile
          import androidx.security.crypto.MasterKey
          import androidx.test.ext.junit.runners.AndroidJUnit4
          import androidx.test.platform.app.InstrumentationRegistry
          import com.google.crypto.tink.KeysetHandle
          import com.google.crypto.tink.RegistryConfiguration
          import com.google.crypto.tink.StreamingAead
          import com.google.crypto.tink.streamingaead.PredefinedStreamingAeadParameters
          import com.google.crypto.tink.streamingaead.StreamingAeadConfig
          import com.photobook.app.data.db.VaultEntity
          import dagger.hilt.android.EntryPointAccessors
          import java.io.ByteArrayInputStream
          import java.io.File
          import kotlinx.coroutines.runBlocking
          import org.junit.Assert.assertArrayEquals
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.junit.runner.RunWith

          @RunWith(AndroidJUnit4::class)
          class VaultMigrationInterruptionInstrumentedTest {
              @Test
              fun migrationCrashStates_recoverFailClosedWithoutPlaintextLoss() = runBlocking {
                  val context = InstrumentationRegistry.getInstrumentation().targetContext
                  val vaultDir = File(context.filesDir, "vault_store").apply { mkdirs() }
                  val dao = EntryPointAccessors.fromApplication(
                      context.applicationContext,
                      VaultServiceEntryPoint::class.java,
                  ).vaultDao()
                  val service = VaultService(context)
                  val crypto = VaultAuthCrypto(context)

                  StreamingAeadConfig.register()
                  val handle = KeysetHandle.generateNew(
                      PredefinedStreamingAeadParameters.AES256_GCM_HKDF_4KB,
                  )
                  val session = VaultCryptoSession(
                      handle.getPrimitive(RegistryConfiguration.get(), StreamingAead::class.java),
                  )

                  val masterKey = MasterKey.Builder(context)
                      .setKeyScheme(MasterKey.KeyScheme.AES256_GCM)
                      .build()

                  suspend fun insert(id: String, name: String) {
                      dao.deleteVaultItemById(id)
                      val inserted = dao.insertVaultItem(
                          VaultEntity(
                              id = id,
                              sourcePhotoId = id.hashCode().toLong(),
                              originalFileName = "$id.jpg",
                              mimeType = "image/jpeg",
                              encryptedFileName = name,
                              addedAtMs = 1_700_000_000_000L,
                          ),
                      )
                      assertTrue(inserted != -1L)
                  }

                  fun writeLegacy(file: File, payload: ByteArray) {
                      if (file.exists()) assertTrue(file.delete())
                      val encrypted = EncryptedFile.Builder(
                          context,
                          file,
                          masterKey,
                          EncryptedFile.FileEncryptionScheme.AES256_GCM_HKDF_4KB,
                      ).build()
                      encrypted.openFileOutput().use { it.write(payload) }
                  }

                  fun writeV2(file: File, id: String, payload: ByteArray) {
                      if (file.exists()) assertTrue(file.delete())
                      crypto.encryptToFile(
                          session,
                          ByteArrayInputStream(payload),
                          file,
                          crypto.associatedData(id),
                      )
                  }

                  fun readV2(file: File, id: String): ByteArray =
                      crypto.openDecryptedInput(session, file, crypto.associatedData(id)).use { it.readBytes() }

                  // Crash state 1: verified final v2 exists but Room still points at legacy.
                  val id1 = "interrupt-verified"
                  val legacyName1 = "interrupt_verified.pbvault"
                  val finalName1 = crypto.v2FileNameFor(legacyName1)
                  val legacy1 = File(vaultDir, legacyName1)
                  val final1 = File(vaultDir, finalName1)
                  val payload1 = ByteArray(384 * 1024) { i -> ((i * 17 + 3) % 251).toByte() }
                  writeLegacy(legacy1, payload1)
                  writeV2(final1, id1, payload1)
                  insert(id1, legacyName1)

                  service.listItems(session = session, includePreviews = false)
                  assertEquals(finalName1, dao.getVaultItemById(id1)?.encryptedFileName)
                  assertFalse(legacy1.exists())
                  assertTrue(final1.exists())
                  assertArrayEquals(payload1, readV2(final1, id1))

                  // Crash state 2: corrupt/unreadable final v2 exists while legacy remains authoritative.
                  val id2 = "interrupt-corrupt"
                  val legacyName2 = "interrupt_corrupt.pbvault"
                  val finalName2 = crypto.v2FileNameFor(legacyName2)
                  val legacy2 = File(vaultDir, legacyName2)
                  val final2 = File(vaultDir, finalName2)
                  val payload2 = ByteArray(320 * 1024) { i -> ((i * 29 + 11) % 251).toByte() }
                  writeLegacy(legacy2, payload2)
                  final2.writeBytes(byteArrayOf(1, 2, 3, 4, 5, 6, 7))
                  insert(id2, legacyName2)

                  service.listItems(session = session, includePreviews = false)
                  assertEquals(finalName2, dao.getVaultItemById(id2)?.encryptedFileName)
                  assertFalse(legacy2.exists())
                  assertTrue(final2.exists())
                  assertArrayEquals(payload2, readV2(final2, id2))

                  // Crash state 3: Room already points at v2 but legacy/temp cleanup did not finish.
                  val id3 = "interrupt-post-db"
                  val legacyName3 = "interrupt_post_db.pbvault"
                  val finalName3 = crypto.v2FileNameFor(legacyName3)
                  val legacy3 = File(vaultDir, legacyName3)
                  val final3 = File(vaultDir, finalName3)
                  val temp3 = File(vaultDir, crypto.temporaryV2FileName(id3))
                  val payload3 = ByteArray(256 * 1024) { i -> ((i * 13 + 19) % 251).toByte() }
                  writeLegacy(legacy3, payload3)
                  writeV2(final3, id3, payload3)
                  temp3.writeBytes(byteArrayOf(9, 8, 7, 6))
                  insert(id3, finalName3)

                  service.listItems(session = session, includePreviews = false)
                  assertEquals(finalName3, dao.getVaultItemById(id3)?.encryptedFileName)
                  assertFalse(legacy3.exists())
                  assertFalse(temp3.exists())
                  assertTrue(final3.exists())
                  assertArrayEquals(payload3, readV2(final3, id3))

                  // Fail-closed state: metadata says legacy but its ciphertext is absent.
                  val id4 = "interrupt-missing-legacy"
                  val legacyName4 = "interrupt_missing.pbvault"
                  val missingLegacy4 = File(vaultDir, legacyName4)
                  if (missingLegacy4.exists()) assertTrue(missingLegacy4.delete())
                  insert(id4, legacyName4)
                  val failed = runCatching {
                      service.listItems(session = session, includePreviews = false)
                  }
                  assertTrue("missing authoritative legacy ciphertext must fail closed", failed.isFailure)
                  assertEquals(legacyName4, dao.getVaultItemById(id4)?.encryptedFileName)
                  assertFalse(File(vaultDir, crypto.v2FileNameFor(legacyName4)).exists())
              }
          }
          KOTLIN

          untracked="$(git ls-files --others --exclude-standard)"
          [[ "$untracked" == 'app/src/androidTest/java/com/photobook/app/feature/vault/VaultMigrationInterruptionInstrumentedTest.kt' ]]
          chmod +x ./gradlew
          ./gradlew :app:compileDebugAndroidTestKotlin :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Boot API35 emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -n1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          IMAGE='system-images;android-35;google_apis;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=0 emulator "$IMAGE"
          echo no | "$AVDMANAGER" create avd --force --name pb-vault-recovery --package "$IMAGE" --device pixel_2 --path "$ANDROID_AVD_HOME/pb-vault-recovery.avd"
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          nohup "$EMULATOR" -avd pb-vault-recovery -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -memory 4096 -cores 2 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 150); do
            if "$ADB" get-state 2>/dev/null | grep -q '^device$'; then break; fi
            kill -0 "$pid" 2>/dev/null || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }
            sleep 2
          done
          "$ADB" wait-for-device
          for _ in $(seq 1 150); do
            [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && break
            sleep 2
          done
          [[ "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]

      - name: Run recovery proof fully offline
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          uid="$(id -u)"
          app_apk="$(find app/build/outputs/apk/debug -type f -name '*arm64-v8a*.apk' -print -quit)"
          test_apk="$(find app/build/outputs/apk/androidTest/debug -type f -name '*.apk' -print -quit)"
          test -f "$app_apk" && test -f "$test_apk"
          ! "$AAPT" dump permissions "$app_apk" | grep -q 'android.permission.INTERNET'
          "$ADB" install "$app_apk"
          "$ADB" install "$test_apk"
          "$ADB" shell cmd connectivity airplane-mode enable || true
          "$ADB" shell svc wifi disable || true
          "$ADB" shell svc data disable || true
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 -m owner --uid-owner "$uid" -j REJECT
          cleanup() {
            sudo iptables -D OUTPUT -m owner --uid-owner "$uid" -j REJECT 2>/dev/null || true
            sudo iptables -D OUTPUT -o lo -j ACCEPT 2>/dev/null || true
          }
          trap cleanup EXIT
          [[ "$("$ADB" shell settings get global airplane_mode_on | tr -d '\r')" == 1 ]]
          if curl -fsS --connect-timeout 2 --max-time 3 https://www.google.com >/dev/null 2>&1; then exit 1; fi
          instrumentation="$("$ADB" shell pm list instrumentation | tr -d '\r' | grep '(target=com.photobook.app)' | head -n1 | sed -E 's/^instrumentation:([^ ]+).*/\1/')"
          "$ADB" logcat -c
          "$ADB" shell am instrument -w -r -e class com.photobook.app.feature.vault.VaultMigrationInterruptionInstrumentedTest "$instrumentation" | tee "$RUNNER_TEMP/recovery.txt"
          grep -Eq 'OK \(1 test\)|OK \(1 tests\)' "$RUNNER_TEMP/recovery.txt"
          "$ADB" logcat -d | grep -E 'FATAL EXCEPTION|AndroidRuntime|OutOfMemoryError|ANR in com\.photobook\.app' > "$RUNNER_TEMP/crash-buffer.txt" || true
          test ! -s "$RUNNER_TEMP/crash-buffer.txt"

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vault-v2-interruption-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/recovery.txt
            ${{ runner.temp }}/crash-buffer.txt
            ${{ runner.temp }}/emulator.log
