name: Build Verified Play AAB

on:
  push:
    branches:
      - "release/2.0.16-signed-aab"
    paths:
      - ".github/workflows/release-signed-aab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-aab:
    name: signed-play-aab
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_UPLOAD_CERT_SHA256: ${{ secrets.PLAY_UPLOAD_CERT_SHA256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify exact release source
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED_MAIN="d3794c1ac2bf32c8f0427f778574914183dfa684"
          changed_runtime="$(git diff --name-only "$VERIFIED_MAIN"...HEAD -- app build.gradle.kts settings.gradle.kts gradle gradle.properties 2>/dev/null || true)"
          if [[ -n "$changed_runtime" ]]; then
            echo "Release branch changed runtime/build source after verified main:" >&2
            printf '%s\n' "$changed_runtime" >&2
            exit 1
          fi
          metadata="$(./gradlew -q :app:printReleaseMetadata)"
          grep -Fxq "versionCode=23" <<<"$metadata"
          grep -Fxq "versionName=2.0.16" <<<"$metadata"

      - name: Require private signing inputs
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.PLAY_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for entry in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            if [[ -z "${!entry:-}" ]]; then
              echo "Required GitHub Actions signing secret is missing: $entry" >&2
              exit 1
            fi
          done

      - name: Prepare ephemeral upload keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/photobook-play-upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list             -keystore "$KEYSTORE_PATH"             -storepass "$STORE_PASSWORD"             -alias "$KEY_ALIAS"             >/dev/null
          {
            printf 'storeFile=%s\n' "$KEYSTORE_PATH"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties

      - name: Build and verify exact signed AAB
        shell: bash
        run: |
          set -euo pipefail
          ./finish_release.sh
          REPORT="outputs/release/PhotoBook-v2.0.16-vc23-production-verification.txt"
          AAB="outputs/release/PhotoBook-v2.0.16-vc23-production.aab"
          test -s "$REPORT"
          test -s "$AAB"
          grep -Fxq "versionCode=23" "$REPORT"
          grep -Fxq "versionName=2.0.16" "$REPORT"
          grep -Fxq "internetPermission=ABSENT" "$REPORT"
          grep -Fxq "bundledSemanticModel=PRESENT" "$REPORT"
          grep -Fxq "jarSignature=VERIFIED" "$REPORT"

      - name: Remove private signing material
        if: always()
        shell: bash
        run: |
          set +e
          rm -f keystore.properties
          rm -f "$RUNNER_TEMP/photobook-play-upload.jks"

      - name: Upload verified Play artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: photobook-2.0.16-vc23-play-aab
          retention-days: 1
          if-no-files-found: error
          path: |
            outputs/release/PhotoBook-v2.0.16-vc23-production.aab
            outputs/release/PhotoBook-v2.0.16-vc23-production-verification.txt
