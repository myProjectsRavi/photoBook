name: Hosted API35 Low-RAM No-GMS Stress (Disposable)

on:
  push:
    branches:
      - exp/2.0.15-hosted-max-acceptance
    paths:
      - .github/workflows/hosted-api35-lowram-no-gms.yml

permissions:
  contents: read

jobs:
  low-memory-no-gms:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: 9fd29f9987f6879f330b5b9cb4f33cde3c9b6d23
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prove production tree unchanged and checkout exact candidate
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "$CANDIDATE_SHA"...HEAD | grep -E '^app/src/main/|^app/build.gradle.kts$|^app/proguard-rules.pro$|^gradle/|^build.gradle.kts$|^settings.gradle.kts$'; then
            echo 'Production/build source changed on hosted-proof branch' >&2
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/candidate"
          git worktree add --detach "$RUNNER_TEMP/candidate" "$CANDIDATE_SHA"
          test "$(git -C "$RUNNER_TEMP/candidate" rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C "$RUNNER_TEMP/candidate" status --porcelain)"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build exact minified ARM64 benchmark APK
        working-directory: ${{ runner.temp }}/candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleBenchmark
      - name: Install emulator host runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
      - name: Provision API35 1GB emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -n1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          IMAGE='system-images;android-35;google_apis;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" "$GITHUB_WORKSPACE/build/reports/hosted-lowram"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=0 emulator "$IMAGE"
          echo no | "$AVDMANAGER" create avd --force --name pb-api35-lowram --package "$IMAGE" --device pixel_2 --path "$ANDROID_AVD_HOME/pb-api35-lowram.avd"
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          nohup "$EMULATOR" -avd pb-api35-lowram -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -memory 1024 -cores 2 > "$RUNNER_TEMP/lowram-emulator.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 150); do
            if "$ADB" get-state 2>/dev/null | grep -q '^device$'; then break; fi
            kill -0 "$pid" 2>/dev/null || { cat "$RUNNER_TEMP/lowram-emulator.log"; exit 1; }
            sleep 2
          done
          "$ADB" wait-for-device
          for _ in $(seq 1 150); do
            [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && break
            sleep 2
          done
          [[ "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]
          sdk="$("$ADB" shell getprop ro.build.version.sdk | tr -d '\r')"
          abilist="$("$ADB" shell getprop ro.product.cpu.abilist | tr -d '\r')"
          ram_kb="$("$ADB" shell cat /proc/meminfo | tr -d '\r' | awk '$1 == "MemTotal:" {print $2; exit}')"
          [[ "$sdk" == 35 ]]
          [[ ",$abilist," == *,arm64-v8a,* ]]
          [[ "$ram_kb" =~ ^[0-9]+$ ]]
          (( ram_kb <= 1363148 ))
          printf 'candidate_sha=%s\nsdk=%s\nabilist=%s\nram_kb=%s\n' "$CANDIDATE_SHA" "$sdk" "$abilist" "$ram_kb" > "$GITHUB_WORKSPACE/build/reports/hosted-lowram/summary.txt"
      - name: Disable Play Services, cut network, install exact app, run 50 cycles
        working-directory: ${{ runner.temp }}/candidate
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK_ROOT/platform-tools:$PATH"
          ADB="$SDK_ROOT/platform-tools/adb"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          REPORT="$GITHUB_WORKSPACE/build/reports/hosted-lowram/summary.txt"
          uid="$(id -u)"
          "$ADB" shell cmd connectivity airplane-mode enable || true
          "$ADB" shell svc wifi disable || true
          "$ADB" shell svc data disable || true
          "$ADB" shell pm disable-user --user 0 com.google.android.gms > "$RUNNER_TEMP/disable-gms.txt" 2>&1 || true
          "$ADB" shell pm disable-user --user 0 com.android.vending > "$RUNNER_TEMP/disable-vending.txt" 2>&1 || true
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 -m owner --uid-owner "$uid" -j REJECT
          cleanup() {
            sudo iptables -D OUTPUT -m owner --uid-owner "$uid" -j REJECT 2>/dev/null || true
            sudo iptables -D OUTPUT -o lo -j ACCEPT 2>/dev/null || true
          }
          trap cleanup EXIT
          [[ "$("$ADB" shell settings get global airplane_mode_on | tr -d '\r')" == 1 ]]
          if curl -fsS --connect-timeout 2 --max-time 3 https://www.google.com >/dev/null 2>&1; then exit 1; fi
          disabled="$($ADB shell pm list packages -d | tr -d '\r')"
          grep -Fq 'package:com.google.android.gms' <<<"$disabled"
          echo 'play_services_disabled=PASS' | tee -a "$REPORT"
          apk="$(find app/build/outputs/apk/benchmark -type f -name '*arm64-v8a*.apk' -print -quit)"
          test -f "$apk"
          ! "$AAPT" dump permissions "$apk" | grep -q 'android.permission.INTERNET'
          "$ADB" install -r "$apk" | tee "$RUNNER_TEMP/lowram-install.txt"
          grep -Fq Success "$RUNNER_TEMP/lowram-install.txt"
          "$ADB" shell dumpsys package com.photobook.app > "$RUNNER_TEMP/lowram-package.txt"
          ! sed -n '/requested permissions:/,/install permissions:/p' "$RUNNER_TEMP/lowram-package.txt" | grep -q 'android.permission.INTERNET'
          "$ADB" shell am start -W -n com.photobook.app/.MainActivity | tee "$RUNNER_TEMP/lowram-start.txt"
          grep -Fq 'Status: ok' "$RUNNER_TEMP/lowram-start.txt"
          OUT_DIR="$GITHUB_WORKSPACE/build/reports/hosted-lowram/stress" ITERATIONS=50 PRESERVE_LOGCAT=0 bash tools/benchmark/phase0_device_stress.sh | tee "$RUNNER_TEMP/lowram-stress.txt"
          grep -Fq 'PASS: no crash/ANR/OOM signature observed' "$RUNNER_TEMP/lowram-stress.txt"
          {
            echo 'offline_network_gate=PASS'
            echo 'installed_internet_permission=ABSENT'
            echo 'lifecycle_stress_iterations=50'
            echo 'crash_anr_oom=ABSENT'
            echo 'api35_1gb_no_gms_stress=PASS'
            echo 'NOTE=emulator surrogate; not physical low-RAM evidence'
          } | tee -a "$REPORT"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-api35-lowram-no-gms-${{ github.run_id }}
          path: |
            build/reports/hosted-lowram/
            ${{ runner.temp }}/lowram-emulator.log
            ${{ runner.temp }}/lowram-start.txt
            ${{ runner.temp }}/lowram-stress.txt
            ${{ runner.temp }}/disable-gms.txt
            ${{ runner.temp }}/disable-vending.txt
          retention-days: 14
          if-no-files-found: warn
