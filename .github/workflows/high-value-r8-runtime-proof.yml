name: High-value R8 Runtime Proof (Disposable)

on:
  push:
    branches:
      - exp/2.0.15-high-value-r8-runtime-proof

permissions:
  contents: read

concurrency:
  group: high-value-r8-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply exact candidate and high-value pruning
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          build = Path('app/build.gradle.kts')
          s = build.read_text()
          old_jni = "        jniLibs {\n            // Ensure native libs are stored uncompressed and 16KB page-aligned\n            // Required by Google Play for devices with 16KB memory pages\n            useLegacyPackaging = false\n        }\n"
          new_jni = "        jniLibs {\n            // Ensure native libs are stored uncompressed and 16KB page-aligned\n            // Required by Google Play for devices with 16KB memory pages\n            useLegacyPackaging = false\n            excludes += setOf(\"**/x86/**\", \"**/x86_64/**\")\n        }\n"
          if s.count(old_jni) != 1:
              raise SystemExit(f'JNI block mismatch: {s.count(old_jni)}')
          s = s.replace(old_jni, new_jni, 1)

          material = '    implementation("com.google.android.material:material:1.12.0")\n'
          appcompat = '    implementation("androidx.appcompat:appcompat:1.6.1")\n'
          if s.count(material) != 1:
              raise SystemExit(f'Material dependency mismatch: {s.count(material)}')
          build.write_text(s.replace(material, appcompat, 1))

          theme = Path('app/src/main/res/values/themes.xml')
          t = theme.read_text()
          old_theme = 'parent="Theme.Material3.DayNight.NoActionBar"'
          if t.count(old_theme) != 1:
              raise SystemExit(f'theme mismatch: {t.count(old_theme)}')
          theme.write_text(t.replace(old_theme, 'parent="Theme.AppCompat.DayNight.NoActionBar"', 1))

          rules = Path('app/proguard-rules.pro')
          r = rules.read_text()
          selected = [
              '-keep class androidx.security.crypto.** { *; }\n',
              '-keep class com.google.crypto.tink.** { *; }\n',
              '-keep class com.google.zxing.** { *; }\n',
              '-keep class com.google.mlkit.** { *; }\n',
          ]
          for rule in selected:
              if r.count(rule) != 1:
                  raise SystemExit(f'keep rule mismatch: {rule!r} count={r.count(rule)}')
              r = r.replace(rule, '', 1)
          rules.write_text(r)
          PY
          git diff -- app/build.gradle.kts app/src/main/res/values/themes.xml app/proguard-rules.pro

      - name: Build release bundle and minified benchmark APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:bundleRelease -x :app:verifyReleaseBundleSize \
            :app:assembleBenchmark

      - name: Prove size ABIs and privacy
        shell: bash
        run: |
          set -euo pipefail
          report=build/reports/high-value-r8-proof
          mkdir -p "$report"
          python3 - <<'PY' | tee "$report/size.txt"
          from pathlib import Path
          import zipfile

          aab = Path('app/build/outputs/bundle/release/app-release.aab')
          limit = 20 * 1024 * 1024
          size = aab.stat().st_size
          with zipfile.ZipFile(aab) as z:
              abis = sorted({n.split('/lib/', 1)[1].split('/', 1)[0] for n in z.namelist() if '/lib/' in n and n.endswith('.so')})
          print(f'aab_bytes={size}')
          print(f'aab_mib={size / 1024 / 1024:.3f}')
          print(f'aab_margin_bytes={limit - size}')
          print('aab_abis=' + ','.join(abis))
          if size > limit:
              raise SystemExit(f'AAB exceeds 20 MiB by {size - limit} bytes')
          if abis != ['arm64-v8a', 'armeabi-v7a']:
              raise SystemExit(f'unexpected release ABIs: {abis}')
          PY

          release_manifest="$(find app/build/intermediates/merged_manifest/release -type f -name AndroidManifest.xml | head -n 1)"
          test -n "$release_manifest" && test -f "$release_manifest"
          if grep -q 'android.permission.INTERNET' "$release_manifest"; then
            echo 'INTERNET present in release merged manifest'
            exit 1
          fi
          echo 'release_merged_manifest_internet=ABSENT' | tee -a "$report/summary.txt"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt 2>/dev/null | sort | tail -n 1)"
          test -x "$AAPT"
          benchmark_apk="$(find app/build/outputs/apk/benchmark -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$benchmark_apk" && test -f "$benchmark_apk"
          "$AAPT" dump permissions "$benchmark_apk" | tee "$report/benchmark-permissions.txt"
          if "$AAPT" dump permissions "$benchmark_apk" | grep -q 'android.permission.INTERNET'; then
            echo 'INTERNET present in minified benchmark APK'
            exit 1
          fi
          echo 'benchmark_packaged_internet=ABSENT' | tee -a "$report/summary.txt"

      - name: Install emulator host runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0

      - name: Provision API 35 emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort | tail -n 1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          IMAGE="system-images;android-35;google_apis;x86_64"
          AVD="photobook-high-value-r8-api35"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=0 emulator "$IMAGE"
          echo no | "$AVDMANAGER" create avd --force --name "$AVD" --package "$IMAGE" --device pixel_2 --path "$ANDROID_AVD_HOME/$AVD.avd"
          test -e /dev/kvm || { echo 'KVM unavailable'; exit 1; }
          sudo chmod 666 /dev/kvm
          "$EMULATOR" -accel-check
          nohup "$EMULATOR" -avd "$AVD" -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -memory 2048 -cores 2 > "$RUNNER_TEMP/high-value-r8-emulator.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 120); do
            if "$ADB" get-state 2>/dev/null | grep -q '^device$'; then break; fi
            kill -0 "$pid" 2>/dev/null || { cat "$RUNNER_TEMP/high-value-r8-emulator.log"; exit 1; }
            sleep 2
          done
          "$ADB" wait-for-device
          for _ in $(seq 1 120); do
            [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && break
            sleep 2
          done
          [[ "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]
          echo "sdk=$("$ADB" shell getprop ro.build.version.sdk | tr -d '\r') abi=$("$ADB" shell getprop ro.product.cpu.abi | tr -d '\r') abilist=$("$ADB" shell getprop ro.product.cpu.abilist | tr -d '\r')"

      - name: Prove minified startup crypto QR and bundled OCR
        shell: bash
        run: |
          set -euo pipefail
          report=build/reports/high-value-r8-proof
          mkdir -p "$report"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"

          adb_retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$ADB" "$@"; then
                return 0
              fi
              echo "ADB transient failure attempt=$attempt args=$*" >&2
              "$ADB" wait-for-device >/dev/null 2>&1 || true
              sleep 2
            done
            return 1
          }

          benchmark_apk="$(find app/build/outputs/apk/benchmark -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$benchmark_apk" && test -f "$benchmark_apk"
          adb_retry install -r "$benchmark_apk"

          adb_retry shell dumpsys package com.photobook.app > "$report/package.txt"
          if sed -n '/requested permissions:/,/install permissions:/p' "$report/package.txt" | grep -q 'android.permission.INTERNET'; then
            echo 'Installed minified app requests INTERNET'
            exit 1
          fi
          echo 'installed_app_internet=ABSENT' | tee -a "$report/summary.txt"

          for mode in no yes; do
            adb_retry shell cmd uimode night "$mode"
            adb_retry shell am force-stop com.photobook.app
            adb_retry logcat -c
            adb_retry shell am start -W -n com.photobook.app/.MainActivity | tee "$report/start-main-$mode.txt"
            sleep 2
            adb_retry shell dumpsys activity activities > "$report/activity-main-$mode.txt"
            grep -q 'com.photobook.app/.MainActivity' "$report/activity-main-$mode.txt"
            adb_retry shell pidof com.photobook.app | tee "$report/pid-main-$mode.txt"
            adb_retry logcat -d > "$report/logcat-main-$mode.txt"
            if grep -Eqi 'FATAL EXCEPTION|AndroidRuntime.*Process: com.photobook.app|NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError' "$report/logcat-main-$mode.txt"; then
              echo "Minified MainActivity crash in night=$mode"
              exit 1
            fi
          done
          echo 'minified_main_startup_light_dark=PASS' | tee -a "$report/summary.txt"

          for iteration in 1 2; do
            adb_retry shell am force-stop com.photobook.app
            adb_retry logcat -c
            adb_retry shell am start -W -n com.photobook.app/.verification.HighValueR8ProofActivity | tee "$report/start-proof-$iteration.txt"
            for _ in $(seq 1 30); do
              sleep 1
              adb_retry logcat -d > "$report/logcat-proof-$iteration.txt"
              if grep -Fq 'PHOTOBOOK_HIGH_VALUE_R8_PROOF=PASS' "$report/logcat-proof-$iteration.txt"; then break; fi
              if grep -Fq 'PHOTOBOOK_HIGH_VALUE_R8_PROOF=FAIL' "$report/logcat-proof-$iteration.txt"; then break; fi
            done
            grep -F 'PHOTOBOOK_HIGH_VALUE_R8_PROOF=PASS' "$report/logcat-proof-$iteration.txt"
            grep -F 'qr=PASS ocr=PASS' "$report/logcat-proof-$iteration.txt"
            if grep -Fq 'PHOTOBOOK_HIGH_VALUE_R8_PROOF=FAIL' "$report/logcat-proof-$iteration.txt"; then
              echo "High-value R8 proof explicitly failed in iteration $iteration"
              exit 1
            fi
            if grep -Eqi 'FATAL EXCEPTION|AndroidRuntime.*Process: com.photobook.app|NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError' "$report/logcat-proof-$iteration.txt"; then
              echo "High-value R8 proof process crashed in iteration $iteration"
              exit 1
            fi
            if [[ "$iteration" -eq 1 ]]; then
              grep -F 'previousPresent=false' "$report/logcat-proof-$iteration.txt"
              grep -F 'filePreviousPresent=false' "$report/logcat-proof-$iteration.txt"
            else
              grep -F 'previousPresent=true' "$report/logcat-proof-$iteration.txt"
              grep -F 'filePreviousPresent=true' "$report/logcat-proof-$iteration.txt"
            fi
          done
          echo 'high_value_r8_runtime=PASS' | tee -a "$report/summary.txt"

      - name: Capture proof evidence
        if: always()
        shell: bash
        run: |
          set +e
          report=build/reports/high-value-r8-proof
          mkdir -p "$report"
          printf 'head=%s\n' "$(git rev-parse HEAD)" > "$report/source.txt"
          cp "$RUNNER_TEMP/high-value-r8-emulator.log" "$report/emulator.log" 2>/dev/null

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: high-value-r8-runtime-proof-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: build/reports/high-value-r8-proof/
