name: Theme Dependency Size Measurement (Disposable)

on:
  push:
    branches:
      - exp/2.0.15-theme-size-measurement

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, appcompat-theme]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply measurement-only packaging and theme variant
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          build = Path('app/build.gradle.kts')
          s = build.read_text()
          old_ndk = '            ndk {\n                debugSymbolLevel = "SYMBOL_TABLE"\n            }\n'
          new_ndk = '            ndk {\n                debugSymbolLevel = "SYMBOL_TABLE"\n                abiFilters += listOf("arm64-v8a", "armeabi-v7a")\n            }\n'
          if s.count(old_ndk) != 1:
              raise SystemExit(f'release ndk block mismatch: {s.count(old_ndk)}')
          s = s.replace(old_ndk, new_ndk, 1)

          old_split = '        abi {\n            isEnable = true\n            reset()\n            include("arm64-v8a", "armeabi-v7a")'
          new_split = '        abi {\n            isEnable = false\n            reset()\n            include("arm64-v8a", "armeabi-v7a")'
          if s.count(old_split) != 1:
              raise SystemExit(f'ABI split block mismatch: {s.count(old_split)}')
          s = s.replace(old_split, new_split, 1)

          variant = os.environ['VARIANT']
          if variant == 'appcompat-theme':
              material = '    implementation("com.google.android.material:material:1.12.0")\n'
              appcompat = '    implementation("androidx.appcompat:appcompat:1.6.1")\n'
              if s.count(material) != 1:
                  raise SystemExit(f'material dependency mismatch: {s.count(material)}')
              s = s.replace(material, appcompat, 1)
          elif variant != 'baseline':
              raise SystemExit(f'unknown variant {variant}')
          build.write_text(s)

          if variant == 'appcompat-theme':
              theme = Path('app/src/main/res/values/themes.xml')
              t = theme.read_text()
              old = 'parent="Theme.Material3.DayNight.NoActionBar"'
              new = 'parent="Theme.AppCompat.DayNight.NoActionBar"'
              if t.count(old) != 1:
                  raise SystemExit(f'theme parent mismatch: {t.count(old)}')
              theme.write_text(t.replace(old, new, 1))

          rules = Path('app/proguard-rules.pro')
          r = rules.read_text()
          removable = [
              '-keep class com.google.mlkit.** { *; }\n',
              '-keep class androidx.security.crypto.** { *; }\n',
              '-keep class com.google.crypto.tink.** { *; }\n',
              '-keep class * extends androidx.room.RoomDatabase { *; }\n',
              '-keep @androidx.room.Entity class * { *; }\n',
              '-keep @androidx.room.Dao interface * { *; }\n',
              '-keep class * extends androidx.work.Worker { *; }\n',
              '-keep class * extends androidx.work.CoroutineWorker { *; }\n',
              '-keep class * extends androidx.work.ListenableWorker { *; }\n',
              '-keep class com.google.zxing.** { *; }\n',
          ]
          for rule in removable:
              if r.count(rule) != 1:
                  raise SystemExit(f'expected exactly one broad keep rule, found {r.count(rule)}: {rule!r}')
              r = r.replace(rule, '', 1)
          rules.write_text(r)
          PY
          echo "variant=$VARIANT"
          git diff -- app/build.gradle.kts app/src/main/res/values/themes.xml app/proguard-rules.pro
      - name: Build and measure minified ARM-only AAB
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:bundleRelease \
            -x :app:verifyReleaseBundleSize
          mkdir -p "build/reports/theme-size/$VARIANT"
          python3 - <<'PY' | tee "build/reports/theme-size/${VARIANT}/summary.txt"
          from pathlib import Path
          import os, zipfile

          variant = os.environ['VARIANT']
          aab = Path('app/build/outputs/bundle/release/app-release.aab')
          if not aab.is_file():
              raise SystemExit('AAB missing')
          size = aab.stat().st_size
          limit = 20 * 1024 * 1024
          print(f'variant={variant}')
          print(f'aab_bytes={size}')
          print(f'aab_mib={size / 1024 / 1024:.3f}')
          print(f'under_20_mib={size <= limit}')
          print(f'bytes_over_gate={max(0, size - limit)}')
          with zipfile.ZipFile(aab) as z:
              libs = [n for n in z.namelist() if '/lib/' in n and n.endswith('.so')]
              abis = sorted({n.split('/lib/', 1)[1].split('/', 1)[0] for n in libs})
              print('abis=' + ','.join(abis))
              if abis != ['arm64-v8a', 'armeabi-v7a']:
                  raise SystemExit(f'unexpected ABIs: {abis}')
              mapping = next((z.getinfo(n) for n in z.namelist() if n.endswith('/proguard.map')), None)
              if mapping:
                  print(f'mapping_compressed_bytes={mapping.compress_size}')
                  print(f'mapping_uncompressed_bytes={mapping.file_size}')
          PY
      - name: Upload measurement
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: theme-size-${{ matrix.variant }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: build/reports/theme-size/${{ matrix.variant }}/
