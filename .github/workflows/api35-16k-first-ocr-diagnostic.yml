name: API35 16K First OCR Diagnostic (Disposable)

on:
  push:
    branches:
      - exp/2.0.15-api35-16k-first-ocr-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CANDIDATE_SHA: 04909b6e485c1ede12160aeac136598bee8d303f
    steps:
      - name: Checkout disposable workflow branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prove workflow-only branch delta
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$CANDIDATE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          [[ "${changed[0]}" == '.github/workflows/api35-16k-first-ocr-diagnostic.yml' ]]

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install emulator host runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0

      - name: Checkout exact candidate and build app plus instrumentation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CANDIDATE_SHA"
          rm -rf "$RUNNER_TEMP/candidate"
          git worktree add --detach "$RUNNER_TEMP/candidate" "$CANDIDATE_SHA"
          test "$(git -C "$RUNNER_TEMP/candidate" rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C "$RUNNER_TEMP/candidate" status --porcelain)"
          cd "$RUNNER_TEMP/candidate"
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          manifest="$(find app/build/intermediates/merged_manifest/debug -type f -name AndroidManifest.xml -print -quit)"
          test -f "$manifest"
          ! grep -q 'android.permission.INTERNET' "$manifest"
          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo 'debug_merged_manifest_internet=ABSENT'
          } > "$GITHUB_WORKSPACE/first-ocr-diagnostic-summary.txt"

      - name: Provision rooted API35 16K emulator with compatibility disabled
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -n1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          IMAGE='system-images;android-35;google_apis_ps16k;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=0 emulator "$IMAGE"
          echo no | "$AVDMANAGER" create avd --force --name photobook-16k-first-ocr --package "$IMAGE" --device pixel_2 --path "$ANDROID_AVD_HOME/photobook-16k-first-ocr.avd"
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          nohup "$EMULATOR" -avd photobook-16k-first-ocr -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -memory 2048 -cores 2 > "$RUNNER_TEMP/first-ocr-emulator.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 150); do
            if "$ADB" get-state 2>/dev/null | grep -q '^device$'; then break; fi
            kill -0 "$pid" 2>/dev/null || { cat "$RUNNER_TEMP/first-ocr-emulator.log"; exit 1; }
            sleep 2
          done
          "$ADB" wait-for-device
          for _ in $(seq 1 150); do
            [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && break
            sleep 2
          done
          [[ "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]
          "$ADB" root
          "$ADB" wait-for-device
          sdk="$("$ADB" shell getprop ro.build.version.sdk | tr -d '\r')"
          abi="$("$ADB" shell getprop ro.product.cpu.abi | tr -d '\r')"
          abilist="$("$ADB" shell getprop ro.product.cpu.abilist | tr -d '\r')"
          page="$("$ADB" shell getconf PAGE_SIZE | tr -d '\r')"
          [[ "$sdk" == 35 ]]
          [[ "$page" == 16384 ]]
          [[ ",$abilist," == *,arm64-v8a,* ]]
          "$ADB" shell setprop bionic.linker.16kb.app_compat.enabled false
          "$ADB" shell setprop pm.16kb.app_compat.disabled true
          bionic="$("$ADB" shell getprop bionic.linker.16kb.app_compat.enabled | tr -d '\r')"
          pm_disabled="$("$ADB" shell getprop pm.16kb.app_compat.disabled | tr -d '\r')"
          [[ "$bionic" == false ]]
          [[ "$pm_disabled" == true ]]
          {
            echo "sdk=$sdk"
            echo "abi=$abi"
            echo "abilist=$abilist"
            echo "page_size=$page"
            echo "bionic_16k_compat=$bionic"
            echo "pm_16k_compat_disabled=$pm_disabled"
          } | tee -a "$GITHUB_WORKSPACE/first-ocr-diagnostic-summary.txt"

      - name: Cut network, install exact candidate, and cold-start app
        working-directory: ${{ runner.temp }}/candidate
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          uid="$(id -u)"
          "$ADB" shell cmd connectivity airplane-mode enable || true
          "$ADB" shell svc wifi disable || true
          "$ADB" shell svc data disable || true
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 -m owner --uid-owner "$uid" -j REJECT
          cleanup() {
            sudo iptables -D OUTPUT -m owner --uid-owner "$uid" -j REJECT 2>/dev/null || true
            sudo iptables -D OUTPUT -o lo -j ACCEPT 2>/dev/null || true
          }
          trap cleanup EXIT
          [[ "$("$ADB" shell settings get global airplane_mode_on | tr -d '\r')" == 1 ]]
          if curl -fsS --connect-timeout 2 --max-time 3 https://www.google.com >/dev/null 2>&1; then exit 1; fi
          if "$ADB" shell 'command -v ping >/dev/null 2>&1'; then ! "$ADB" shell ping -c 1 -W 1 8.8.8.8 >/dev/null 2>&1; fi
          echo 'offline_network_gate=PASS' | tee -a "$GITHUB_WORKSPACE/first-ocr-diagnostic-summary.txt"
          app_apk="$(find app/build/outputs/apk/debug -type f -name '*arm64-v8a*.apk' -print -quit)"
          test_apk="$(find app/build/outputs/apk/androidTest/debug -type f -name '*.apk' -print -quit)"
          test -f "$app_apk" && test -f "$test_apk"
          ! "$AAPT" dump permissions "$app_apk" | grep -q 'android.permission.INTERNET'
          "$ADB" install -r "$app_apk" | tee "$RUNNER_TEMP/install-app.txt"
          "$ADB" install -r "$test_apk" | tee "$RUNNER_TEMP/install-test.txt"
          grep -Fq Success "$RUNNER_TEMP/install-app.txt"
          grep -Fq Success "$RUNNER_TEMP/install-test.txt"
          "$ADB" shell dumpsys package com.photobook.app > "$GITHUB_WORKSPACE/package-before-ocr.txt"
          ! sed -n '/requested permissions:/,/install permissions:/p' "$GITHUB_WORKSPACE/package-before-ocr.txt" | grep -q 'android.permission.INTERNET'
          "$ADB" shell pm path com.photobook.app | tee "$GITHUB_WORKSPACE/pm-path.txt"
          "$ADB" shell am force-stop com.photobook.app
          "$ADB" shell am start -W -n com.photobook.app/.MainActivity | tee "$GITHUB_WORKSPACE/cold-start.txt"
          grep -Fq 'Status: ok' "$GITHUB_WORKSPACE/cold-start.txt"
          echo 'cold_startup=PASS' | tee -a "$GITHUB_WORKSPACE/first-ocr-diagnostic-summary.txt"

      - name: Run FIRST OCR once and capture crash evidence before retry
        working-directory: ${{ runner.temp }}/candidate
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"
          REPORT="$GITHUB_WORKSPACE/first-ocr-diagnostic-summary.txt"
          mkdir -p "$GITHUB_WORKSPACE/first-attempt-evidence/tombstones" "$GITHUB_WORKSPACE/first-attempt-evidence/anr"
          instrumentation="$("$ADB" shell pm list instrumentation | tr -d '\r' | grep '(target=com.photobook.app)' | head -n1 | sed -E 's/^instrumentation:([^ ]+).*/\1/')"
          test -n "$instrumentation"
          "$ADB" shell am force-stop com.photobook.app || true
          "$ADB" logcat -b all -c || true
          "$ADB" shell dmesg > "$GITHUB_WORKSPACE/first-attempt-evidence/dmesg-before.txt" 2>&1 || true
          "$ADB" shell pidof com.photobook.app > "$GITHUB_WORKSPACE/first-attempt-evidence/pid-before.txt" 2>&1 || true
          start_ms="$(date +%s%3N)"
          set +e
          timeout 90 "$ADB" shell am instrument -w -r -e class com.photobook.app.ml.LocalOcrEngineInstrumentedTest "$instrumentation" > "$GITHUB_WORKSPACE/first-attempt-evidence/instrumentation.txt" 2>&1
          rc=$?
          set -e
          end_ms="$(date +%s%3N)"
          elapsed=$((end_ms-start_ms))
          "$ADB" shell pidof com.photobook.app > "$GITHUB_WORKSPACE/first-attempt-evidence/pid-after.txt" 2>&1 || true
          "$ADB" logcat -b all -d -v threadtime > "$GITHUB_WORKSPACE/first-attempt-evidence/logcat-all.txt" 2>&1 || true
          "$ADB" shell dmesg > "$GITHUB_WORKSPACE/first-attempt-evidence/dmesg-after.txt" 2>&1 || true
          "$ADB" shell dumpsys activity exit-info com.photobook.app > "$GITHUB_WORKSPACE/first-attempt-evidence/exit-info.txt" 2>&1 || true
          "$ADB" shell 'ls -la /data/tombstones' > "$GITHUB_WORKSPACE/first-attempt-evidence/tombstone-list.txt" 2>&1 || true
          "$ADB" pull /data/tombstones/. "$GITHUB_WORKSPACE/first-attempt-evidence/tombstones/" > "$GITHUB_WORKSPACE/first-attempt-evidence/tombstone-pull.txt" 2>&1 || true
          "$ADB" shell 'ls -la /data/anr' > "$GITHUB_WORKSPACE/first-attempt-evidence/anr-list.txt" 2>&1 || true
          "$ADB" pull /data/anr/. "$GITHUB_WORKSPACE/first-attempt-evidence/anr/" > "$GITHUB_WORKSPACE/first-attempt-evidence/anr-pull.txt" 2>&1 || true
          outcome=FAIL
          if [[ "$rc" -eq 0 ]] && grep -Eq 'OK \(1 test\)|OK \(1 tests\)' "$GITHUB_WORKSPACE/first-attempt-evidence/instrumentation.txt" && ! grep -Eq 'Process crashed|INSTRUMENTATION_FAILED|FAILURES' "$GITHUB_WORKSPACE/first-attempt-evidence/instrumentation.txt"; then
            outcome=PASS
          fi
          {
            echo "first_ocr_rc=$rc"
            echo "first_ocr_elapsed_ms=$elapsed"
            echo "first_ocr_outcome=$outcome"
          } | tee -a "$REPORT"
          # Diagnostic job deliberately continues regardless of first-run outcome;
          # the evidence capture itself is the gate for this step.

      - name: Run SECOND OCR as control only after first evidence is frozen
        working-directory: ${{ runner.temp }}/candidate
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"
          REPORT="$GITHUB_WORKSPACE/first-ocr-diagnostic-summary.txt"
          mkdir -p "$GITHUB_WORKSPACE/second-attempt-control"
          instrumentation="$("$ADB" shell pm list instrumentation | tr -d '\r' | grep '(target=com.photobook.app)' | head -n1 | sed -E 's/^instrumentation:([^ ]+).*/\1/')"
          "$ADB" shell am force-stop com.photobook.app || true
          "$ADB" logcat -b all -c || true
          start_ms="$(date +%s%3N)"
          set +e
          timeout 90 "$ADB" shell am instrument -w -r -e class com.photobook.app.ml.LocalOcrEngineInstrumentedTest "$instrumentation" > "$GITHUB_WORKSPACE/second-attempt-control/instrumentation.txt" 2>&1
          rc=$?
          set -e
          end_ms="$(date +%s%3N)"
          elapsed=$((end_ms-start_ms))
          "$ADB" logcat -b all -d -v threadtime > "$GITHUB_WORKSPACE/second-attempt-control/logcat-all.txt" 2>&1 || true
          "$ADB" shell dumpsys activity exit-info com.photobook.app > "$GITHUB_WORKSPACE/second-attempt-control/exit-info.txt" 2>&1 || true
          outcome=FAIL
          if [[ "$rc" -eq 0 ]] && grep -Eq 'OK \(1 test\)|OK \(1 tests\)' "$GITHUB_WORKSPACE/second-attempt-control/instrumentation.txt" && ! grep -Eq 'Process crashed|INSTRUMENTATION_FAILED|FAILURES' "$GITHUB_WORKSPACE/second-attempt-control/instrumentation.txt"; then
            outcome=PASS
          fi
          {
            echo "second_ocr_rc=$rc"
            echo "second_ocr_elapsed_ms=$elapsed"
            echo "second_ocr_outcome=$outcome"
            echo 'first_run_diagnostic_capture=COMPLETE'
          } | tee -a "$REPORT"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api35-16k-first-ocr-diagnostic-${{ github.run_id }}
          path: |
            first-ocr-diagnostic-summary.txt
            package-before-ocr.txt
            pm-path.txt
            cold-start.txt
            first-attempt-evidence/
            second-attempt-control/
            ${{ runner.temp }}/first-ocr-emulator.log
          retention-days: 14
          if-no-files-found: error
