name: Vault Preview Cache Lifecycle Final Review (Disposable)

on:
  push:
    branches:
      - fix/2.0.15-vault-preview-cache-lifecycle-v4
    paths:
      - .github/workflows/vault-preview-cache-fix.yml

permissions:
  contents: write

env:
  BASE_SHA: e91ce30b0df4c6303363a2279df7330baeb900c9

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: fix/2.0.15-vault-preview-cache-lifecycle-v4

      - name: Verify reviewed v4 starting scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/vault-preview-cache-fix.yml"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply cancellation-safe cleanup delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(text, old, new, expected, label):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, got {count}')
              return text.replace(old, new)

          main_path = Path('app/src/main/java/com/photobook/app/MainActivity.kt')
          main = main_path.read_text()
          main = replace_exact(
              main,
              '        coroutineScope.launch {\n'
              '            runCatching { vaultService.clearPreviewCache() }\n'
              '        }\n',
              '        coroutineScope.launch {\n'
              '            vaultService.clearPreviewCache()\n'
              '        }\n',
              1,
              'close-time cleanup launch',
          )
          main_path.write_text(main)

          service_path = Path('app/src/main/java/com/photobook/app/feature/vault/VaultService.kt')
          service = service_path.read_text()
          old_clear = (
              '    suspend fun clearPreviewCache() = withContext(Dispatchers.IO) {\n'
              '        previewCacheMutex.lock()\n'
              '        try {\n'
              '            val previewRoot = File(context.cacheDir, VAULT_PREVIEW_DIR)\n'
              '            if (previewRoot.exists() && !previewRoot.deleteRecursively()) {\n'
              '                previewCacheNeedsCleanup.set(true)\n'
              '                throw IOException("Unable to clear Vault preview cache")\n'
              '            }\n'
              '            previewCacheNeedsCleanup.set(false)\n'
              '        } finally {\n'
              '            previewCacheMutex.unlock()\n'
              '        }\n'
              '    }\n'
          )
          new_clear = (
              '    suspend fun clearPreviewCache(): Boolean = withContext(Dispatchers.IO) {\n'
              '        previewCacheMutex.lock()\n'
              '        try {\n'
              '            val previewRoot = File(context.cacheDir, VAULT_PREVIEW_DIR)\n'
              '            val cleared = try {\n'
              '                !previewRoot.exists() || previewRoot.deleteRecursively()\n'
              '            } catch (_: SecurityException) {\n'
              '                false\n'
              '            }\n'
              '            previewCacheNeedsCleanup.set(!cleared)\n'
              '            cleared\n'
              '        } finally {\n'
              '            previewCacheMutex.unlock()\n'
              '        }\n'
              '    }\n'
          )
          service = replace_exact(service, old_clear, new_clear, 1, 'clearPreviewCache result')
          service_path.write_text(service)
          PY
          git diff --check

      - name: Prove final cleanup semantics
        shell: bash
        run: |
          set -euo pipefail
          main=app/src/main/java/com/photobook/app/MainActivity.kt
          vault=app/src/main/java/com/photobook/app/feature/vault/VaultService.kt
          test "$(grep -c 'vaultService.clearPreviewCache()' "$main")" -eq 1
          ! grep -q 'runCatching { vaultService.clearPreviewCache() }' "$main"
          test "$(grep -c 'suspend fun clearPreviewCache(): Boolean' "$vault")" -eq 1
          test "$(grep -c 'previewCacheNeedsCleanup.set(!cleared)' "$vault")" -eq 1
          test "$(grep -c 'catch (_: SecurityException)' "$vault")" -eq 1

      - name: Compile production and test source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug

      - name: Commit only final reviewed production delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PhotoBook verification"
          git config user.email "95069115+myProjectsRavi@users.noreply.github.com"
          git add app/src/main/java/com/photobook/app/MainActivity.kt \
                  app/src/main/java/com/photobook/app/feature/vault/VaultService.kt
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          git commit -m "Preserve Vault cleanup cancellation semantics"
          git push origin HEAD:fix/2.0.15-vault-preview-cache-lifecycle-v4
