name: Vault Preview Cache Lifecycle V4 (Disposable)

on:
  push:
    branches:
      - fix/2.0.15-vault-preview-cache-lifecycle-v4
    paths:
      - .github/workflows/vault-preview-cache-fix.yml

permissions:
  contents: write

env:
  BASE_SHA: 50385fc6c062a269e41c0921954639682eb0b593

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: fix/2.0.15-vault-preview-cache-lifecycle-v4

      - name: Verify isolated v3 starting point
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/vault-preview-cache-fix.yml"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply reviewed v4 delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(text, old, new, expected, label):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, got {count}')
              return text.replace(old, new)

          main_path = Path('app/src/main/java/com/photobook/app/MainActivity.kt')
          main = main_path.read_text()

          old_close = '''    fun closeVault() {
              vaultService.clearPreviewCache()
              showVault = false
              vaultItems = emptyList()
              isVaultLoading = false
              isVaultBusy = false
          }
          '''
          new_close = '''    fun closeVault() {
              showVault = false
              vaultService.invalidatePreviewCache()
              vaultItems = emptyList()
              isVaultLoading = false
              isVaultBusy = false
              coroutineScope.launch {
                  runCatching { vaultService.clearPreviewCache() }
              }
          }
          '''
          main = replace_exact(main, old_close, new_close, 1, 'closeVault')

          old_return = '''        return if (showVault) {
                      items
                  } else {
                      vaultService.clearPreviewCache()
                      emptyList()
                  }
          '''
          new_return = '''        return when {
                      !showVault -> emptyList()
                      vaultService.isPreviewLoadCurrent(previewGeneration) -> items
                      else -> vaultItems
                  }
          '''
          main = replace_exact(main, old_return, new_return, 1, 'visible Vault result arbitration')
          main_path.write_text(main)

          service_path = Path('app/src/main/java/com/photobook/app/feature/vault/VaultService.kt')
          service = service_path.read_text()

          import_anchor = 'import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.withContext\n'
          import_replacement = 'import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.sync.Mutex\nimport kotlinx.coroutines.withContext\n'
          service = replace_exact(service, import_anchor, import_replacement, 1, 'Mutex import')

          old_fields = '''    private val previewCacheGeneration = java.util.concurrent.atomic.AtomicLong(0L)
              private val previewCacheNeedsCleanup = java.util.concurrent.atomic.AtomicBoolean(true)
          
              internal fun beginPreviewLoad(): Long = previewCacheGeneration.incrementAndGet()
          '''
          new_fields = '''    private val previewCacheGeneration = java.util.concurrent.atomic.AtomicLong(0L)
              private val previewCacheNeedsCleanup = java.util.concurrent.atomic.AtomicBoolean(true)
              private val previewCacheMutex = Mutex()
          
              internal fun beginPreviewLoad(): Long = previewCacheGeneration.incrementAndGet()
          
              internal fun isPreviewLoadCurrent(generation: Long): Boolean =
                  previewCacheGeneration.get() == generation
          
              internal fun invalidatePreviewCache() {
                  previewCacheGeneration.incrementAndGet()
                  previewCacheNeedsCleanup.set(true)
              }
          '''
          service = replace_exact(service, old_fields, new_fields, 1, 'preview state fields')

          old_list = '''    suspend fun listItems(
              session: VaultCryptoSession,
              includePreviews: Boolean = false,
              previewGeneration: Long? = null,
          ): List<VaultItem> = withContext(Dispatchers.IO) {
              val expectedPreviewGeneration = if (includePreviews) {
                  requireNotNull(previewGeneration) { "Preview generation is required for Vault previews" }
              } else {
                  null
              }
              if (
                  expectedPreviewGeneration != null &&
                  previewCacheNeedsCleanup.compareAndSet(true, false)
              ) {
                  val previewRoot = File(context.cacheDir, VAULT_PREVIEW_DIR)
                  if (previewRoot.exists() && !previewRoot.deleteRecursively()) {
                      previewCacheNeedsCleanup.set(true)
                      throw IOException("Unable to clear stale Vault preview cache")
                  }
              }
              migrateLegacyItemsIfNeeded()
              migrateLegacyCiphertextIfNeeded(session)
              vaultDao.getAllVaultItems().map { entity ->
                  val item = entity.toVaultItem()
                  if (expectedPreviewGeneration != null) {
                      item.copy(
                          previewUri = createPreviewUri(
                              entity = entity,
                              session = session,
                              expectedPreviewGeneration = expectedPreviewGeneration,
                          ),
                      )
                  } else {
                      item
                  }
              }
          }
          '''
          new_list = '''    suspend fun listItems(
              session: VaultCryptoSession,
              includePreviews: Boolean = false,
              previewGeneration: Long? = null,
          ): List<VaultItem> = withContext(Dispatchers.IO) {
              val expectedPreviewGeneration = if (includePreviews) {
                  requireNotNull(previewGeneration) { "Preview generation is required for Vault previews" }
              } else {
                  null
              }
              if (expectedPreviewGeneration != null) {
                  previewCacheMutex.lock()
              }
              try {
                  if (expectedPreviewGeneration != null) {
                      if (previewCacheGeneration.get() != expectedPreviewGeneration) {
                          return@withContext emptyList()
                      }
                      if (previewCacheNeedsCleanup.compareAndSet(true, false)) {
                          val previewRoot = File(context.cacheDir, VAULT_PREVIEW_DIR)
                          if (previewRoot.exists() && !previewRoot.deleteRecursively()) {
                              previewCacheNeedsCleanup.set(true)
                              throw IOException("Unable to clear stale Vault preview cache")
                          }
                      }
                      if (previewCacheGeneration.get() != expectedPreviewGeneration) {
                          return@withContext emptyList()
                      }
                  }
                  migrateLegacyItemsIfNeeded()
                  migrateLegacyCiphertextIfNeeded(session)
                  if (
                      expectedPreviewGeneration != null &&
                      previewCacheGeneration.get() != expectedPreviewGeneration
                  ) {
                      return@withContext emptyList()
                  }
                  vaultDao.getAllVaultItems().map { entity ->
                      val item = entity.toVaultItem()
                      if (expectedPreviewGeneration != null) {
                          item.copy(
                              previewUri = createPreviewUri(
                                  entity = entity,
                                  session = session,
                                  expectedPreviewGeneration = expectedPreviewGeneration,
                              ),
                          )
                      } else {
                          item
                      }
                  }
              } finally {
                  if (expectedPreviewGeneration != null) {
                      previewCacheMutex.unlock()
                  }
              }
          }
          '''
          service = replace_exact(service, old_list, new_list, 1, 'listItems serialization')

          old_clear = '''    fun clearPreviewCache() {
              previewCacheGeneration.incrementAndGet()
              previewCacheNeedsCleanup.set(true)
              runCatching {
                  File(context.cacheDir, VAULT_PREVIEW_DIR).deleteRecursively()
              }
          }
          '''
          new_clear = '''    suspend fun clearPreviewCache() = withContext(Dispatchers.IO) {
              previewCacheMutex.lock()
              try {
                  val previewRoot = File(context.cacheDir, VAULT_PREVIEW_DIR)
                  if (previewRoot.exists() && !previewRoot.deleteRecursively()) {
                      previewCacheNeedsCleanup.set(true)
                      throw IOException("Unable to clear Vault preview cache")
                  }
                  previewCacheNeedsCleanup.set(false)
              } finally {
                  previewCacheMutex.unlock()
              }
          }
          '''
          service = replace_exact(service, old_clear, new_clear, 1, 'IO-bound preview clear')

          bounds_anchor = '''            if (bounds.outWidth <= 0 || bounds.outHeight <= 0) {
                  return@runCatching null
              }
          
              val options = BitmapFactory.Options().apply {
          '''
          bounds_replacement = '''            if (bounds.outWidth <= 0 || bounds.outHeight <= 0) {
                  return@runCatching null
              }
              if (previewCacheGeneration.get() != expectedPreviewGeneration) {
                  return@runCatching null
              }
          
              val options = BitmapFactory.Options().apply {
          '''
          service = replace_exact(service, bounds_anchor, bounds_replacement, 1, 'post-bounds stale check')

          bitmap_anchor = '''            val bitmap = openVaultInput(entity, session).use { input ->
                  BitmapFactory.decodeStream(input, null, options)
              } ?: return@runCatching null
          
              previewFile.parentFile?.mkdirs()
          '''
          bitmap_replacement = '''            val bitmap = openVaultInput(entity, session).use { input ->
                  BitmapFactory.decodeStream(input, null, options)
              } ?: return@runCatching null
              if (previewCacheGeneration.get() != expectedPreviewGeneration) {
                  bitmap.recycle()
                  return@runCatching null
              }
          
              previewFile.parentFile?.mkdirs()
          '''
          service = replace_exact(service, bitmap_anchor, bitmap_replacement, 1, 'post-decode stale check')

          publish_anchor = '''                authCrypto.renameAtomically(tempPreview, previewFile)
                  Uri.fromFile(previewFile)
          '''
          publish_replacement = '''                authCrypto.renameAtomically(tempPreview, previewFile)
                  if (previewCacheGeneration.get() != expectedPreviewGeneration) {
                      runCatching { previewFile.delete() }
                      return@runCatching null
                  }
                  Uri.fromFile(previewFile)
          '''
          service = replace_exact(service, publish_anchor, publish_replacement, 1, 'post-publish stale check')

          service_path.write_text(service)
          PY
          git diff --check

      - name: Prove reviewed invariants
        shell: bash
        run: |
          set -euo pipefail
          main=app/src/main/java/com/photobook/app/MainActivity.kt
          vault=app/src/main/java/com/photobook/app/feature/vault/VaultService.kt
          test "$(grep -c 'vaultService.invalidatePreviewCache()' "$main")" -eq 1
          test "$(grep -c 'isPreviewLoadCurrent(previewGeneration)' "$main")" -eq 1
          test "$(grep -c 'suspend fun clearPreviewCache' "$vault")" -eq 1
          test "$(grep -c 'private val previewCacheMutex = Mutex()' "$vault")" -eq 1
          test "$(grep -c 'previewCacheMutex.lock()' "$vault")" -eq 2
          test "$(grep -c 'previewCacheMutex.unlock()' "$vault")" -eq 2
          test "$(grep -c 'internal fun invalidatePreviewCache' "$vault")" -eq 1
          test "$(grep -c 'internal fun isPreviewLoadCurrent' "$vault")" -eq 1
          test "$(grep -c 'return@withContext emptyList()' "$vault")" -ge 3
          test "$(grep -c 'runCatching { previewFile.delete() }' "$vault")" -eq 1
          ! grep -q 'fun clearPreviewCache() {' "$vault"
          ! grep -A2 'fun closeVault()' "$main" | grep -q 'clearPreviewCache()'

      - name: Compile production and test source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug

      - name: Commit only reviewed production delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PhotoBook verification"
          git config user.email "95069115+myProjectsRavi@users.noreply.github.com"
          git add app/src/main/java/com/photobook/app/MainActivity.kt \
                  app/src/main/java/com/photobook/app/feature/vault/VaultService.kt
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          git commit -m "Serialize and offload Vault preview cleanup"
          git push origin HEAD:fix/2.0.15-vault-preview-cache-lifecycle-v4
