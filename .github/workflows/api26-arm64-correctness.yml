name: API26 ARM64 Correctness (Disposable)

on:
  push:
    branches:
      - exp/2.0.15-api26-arm64-correctness

permissions:
  contents: read

jobs:
  api26-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: 04909b6e485c1ede12160aeac136598bee8d303f
    steps:
      - name: Checkout exact clean candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build exact minified ARM64 benchmark APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          chmod +x ./gradlew
          ./gradlew :app:assembleBenchmark
          apk="$(find app/build/outputs/apk/benchmark -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$apk" && test -f "$apk"
      - name: Install emulator host runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
      - name: Provision API26 ARM64 in correctness-only software mode
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort | tail -n 1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          IMAGE="system-images;android-26;google_apis;arm64-v8a"
          AVD="photobook-api26-arm64-correctness"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" build/reports/api26-arm64
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=0 emulator "$IMAGE"
          echo no | "$AVDMANAGER" create avd --force --name "$AVD" --package "$IMAGE" --device pixel_2 --path "$ANDROID_AVD_HOME/$AVD.avd"
          echo 'mode=software_emulation_correctness_only_no_performance_claim' | tee build/reports/api26-arm64/mode.txt
          nohup "$EMULATOR" -avd "$AVD" -accel off -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -memory 2048 -cores 2 > "$RUNNER_TEMP/api26-arm64-emulator.log" 2>&1 &
          pid=$!
          ready=false
          for _ in $(seq 1 450); do
            if "$ADB" get-state 2>/dev/null | grep -q '^device$'; then ready=true; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'ARM64 software emulator exited before ADB readiness'
              cat "$RUNNER_TEMP/api26-arm64-emulator.log"
              exit 1
            fi
            sleep 2
          done
          [[ "$ready" == true ]] || { cat "$RUNNER_TEMP/api26-arm64-emulator.log"; exit 1; }
          "$ADB" wait-for-device
          boot=false
          for _ in $(seq 1 450); do
            if [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then boot=true; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'ARM64 software emulator exited before boot completion'
              cat "$RUNNER_TEMP/api26-arm64-emulator.log"
              exit 1
            fi
            sleep 2
          done
          [[ "$boot" == true ]] || { cat "$RUNNER_TEMP/api26-arm64-emulator.log"; exit 1; }
          sdk="$("$ADB" shell getprop ro.build.version.sdk | tr -d '\r')"
          abi="$("$ADB" shell getprop ro.product.cpu.abi | tr -d '\r')"
          abilist="$("$ADB" shell getprop ro.product.cpu.abilist | tr -d '\r')"
          echo "sdk=$sdk abi=$abi abilist=$abilist" | tee build/reports/api26-arm64/device.txt
          [[ "$sdk" == 26 ]]
          echo "$abilist" | tr ',' '\n' | grep -Fx 'arm64-v8a'
      - name: Prove API26 minified light/dark startup and privacy
        shell: bash
        run: |
          set -euo pipefail
          report=build/reports/api26-arm64
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt 2>/dev/null | sort | tail -n 1)"
          apk="$(find app/build/outputs/apk/benchmark -type f -name '*arm64-v8a*.apk' | head -n 1)"
          "$AAPT" dump permissions "$apk" > "$report/permissions.txt"
          ! grep -q 'android.permission.INTERNET' "$report/permissions.txt"
          "$ADB" install -r "$apk"
          "$ADB" shell dumpsys package com.photobook.app > "$report/package.txt"
          if sed -n '/requested permissions:/,/install permissions:/p' "$report/package.txt" | grep -q 'android.permission.INTERNET'; then
            echo 'Installed API26 minified app requests INTERNET'
            exit 1
          fi
          for mode in no yes; do
            "$ADB" shell cmd uimode night "$mode" || true
            "$ADB" shell am force-stop com.photobook.app || true
            "$ADB" logcat -c
            "$ADB" shell am start -W -n com.photobook.app/.MainActivity | tee "$report/start-$mode.txt"
            grep -q 'Status: ok' "$report/start-$mode.txt"
            sleep 3
            "$ADB" shell dumpsys activity activities > "$report/activity-$mode.txt"
            grep -q 'com.photobook.app/.MainActivity' "$report/activity-$mode.txt"
            "$ADB" logcat -d > "$report/logcat-$mode.txt"
            if grep -Eqi 'FATAL EXCEPTION|AndroidRuntime.*Process: com.photobook.app|NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|NoSuchFieldError|UnsatisfiedLinkError' "$report/logcat-$mode.txt"; then
              echo "API26 minified startup failure in mode=$mode"
              exit 1
            fi
          done
          echo 'api26_arm64_minified_startup=PASS' | tee "$report/summary.txt"
      - name: Capture emulator log
        if: always()
        shell: bash
        run: |
          mkdir -p build/reports/api26-arm64
          cp "$RUNNER_TEMP/api26-arm64-emulator.log" build/reports/api26-arm64/emulator.log 2>/dev/null || true
      - name: Upload API26 ARM64 correctness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api26-arm64-correctness-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: build/reports/api26-arm64/
