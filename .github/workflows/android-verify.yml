name: Android Verification

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "codex/**"
      - "agent/**"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run Phase-0 verification
        run: bash tools/benchmark/run_phase0_local.sh

      - name: Upload Phase-0 verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase0-verification-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/schemas/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            build/reports/phase0/
            build/phase0-fixtures/*.json
            build/phase0-fixtures/*.jsonl
