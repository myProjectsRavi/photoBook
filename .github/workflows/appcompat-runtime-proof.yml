name: AppCompat Theme Runtime Proof (Disposable)

on:
  push:
    branches:
      - exp/2.0.15-appcompat-runtime-proof

permissions:
  contents: read

concurrency:
  group: appcompat-runtime-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply dependency-only substitution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          build = Path('app/build.gradle.kts')
          text = build.read_text()
          old = '    implementation("com.google.android.material:material:1.12.0")\n'
          new = '    implementation("androidx.appcompat:appcompat:1.6.1")\n'
          if text.count(old) != 1:
              raise SystemExit(f'Material dependency count={text.count(old)}')
          build.write_text(text.replace(old, new, 1))

          theme = Path('app/src/main/res/values/themes.xml').read_text()
          expected = 'parent="Theme.AppCompat.DayNight.NoActionBar"'
          if theme.count(expected) != 1:
              raise SystemExit('Committed AppCompat theme parent missing')
          PY
          git diff -- app/build.gradle.kts app/src/main/res/values/themes.xml

      - name: Prove host and minified build correctness
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :app:assembleRelease

      - name: Install emulator host runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0

      - name: Provision API 35 emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort | tail -n 1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          IMAGE="system-images;android-35;google_apis;x86_64"
          AVD="photobook-appcompat-proof-api35"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=0 emulator "$IMAGE"
          echo no | "$AVDMANAGER" create avd --force --name "$AVD" --package "$IMAGE" --device pixel_2 --path "$ANDROID_AVD_HOME/$AVD.avd"
          test -e /dev/kvm || { echo 'KVM unavailable'; exit 1; }
          sudo chmod 666 /dev/kvm
          "$EMULATOR" -accel-check
          nohup "$EMULATOR" -avd "$AVD" -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -memory 2048 -cores 2 > "$RUNNER_TEMP/appcompat-emulator.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 120); do
            if "$ADB" get-state 2>/dev/null | grep -q '^device$'; then break; fi
            kill -0 "$pid" 2>/dev/null || { cat "$RUNNER_TEMP/appcompat-emulator.log"; exit 1; }
            sleep 2
          done
          "$ADB" wait-for-device
          for _ in $(seq 1 120); do
            [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && break
            sleep 2
          done
          [[ "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]
          echo "sdk=$("$ADB" shell getprop ro.build.version.sdk | tr -d '\r') abi=$("$ADB" shell getprop ro.product.cpu.abi | tr -d '\r') abilist=$("$ADB" shell getprop ro.product.cpu.abilist | tr -d '\r')"

      - name: Prove light and dark startup plus bundled OCR health
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/appcompat-runtime-proof
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"

          adb_retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$ADB" "$@"; then
                return 0
              fi
              echo "ADB transient failure attempt=$attempt args=$*" >&2
              "$ADB" wait-for-device >/dev/null 2>&1 || true
              sleep 2
            done
            return 1
          }

          app_apk="$(find app/build/outputs/apk/debug -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test_apk="$(find app/build/outputs/apk/androidTest/debug -type f -name '*.apk' | head -n 1)"
          test -n "$app_apk" && test -f "$app_apk"
          test -n "$test_apk" && test -f "$test_apk"
          adb_retry install -r "$app_apk"
          adb_retry install -r "$test_apk"

          for mode in no yes; do
            adb_retry shell cmd uimode night "$mode"
            adb_retry shell am force-stop com.photobook.app
            adb_retry logcat -c
            adb_retry shell am start -W -n com.photobook.app/.MainActivity | tee "build/reports/appcompat-runtime-proof/start-$mode.txt"
            sleep 3
            adb_retry shell pidof com.photobook.app | tee "build/reports/appcompat-runtime-proof/pid-$mode.txt"
            adb_retry shell dumpsys activity activities > "build/reports/appcompat-runtime-proof/activity-$mode.txt"
            grep -q 'com.photobook.app/.MainActivity' "build/reports/appcompat-runtime-proof/activity-$mode.txt"
            adb_retry logcat -d > "build/reports/appcompat-runtime-proof/logcat-$mode.txt"
            if grep -Eqi 'FATAL EXCEPTION|AndroidRuntime.*Process: com.photobook.app|ResourcesNotFoundException|InflateException|NoClassDefFoundError' "build/reports/appcompat-runtime-proof/logcat-$mode.txt"; then
              echo "Theme/runtime failure in night=$mode"
              exit 1
            fi
          done

          instrumentation="$(adb_retry shell pm list instrumentation | tr -d '\r' | grep '(target=com.photobook.app)' | head -n 1 | sed -E 's/^instrumentation:([^ ]+).*/\1/')"
          test -n "$instrumentation"
          adb_retry shell am instrument -w -r \
            -e class com.photobook.app.ml.AppCompatRuntimeOcrInstrumentedTest \
            "$instrumentation" | tee build/reports/appcompat-runtime-proof/ocr.txt
          grep -Eq 'OK \(1 test\)|OK \(1 tests\)' build/reports/appcompat-runtime-proof/ocr.txt
          if grep -Eq 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' build/reports/appcompat-runtime-proof/ocr.txt; then
            echo 'Bundled OCR health smoke failed under AppCompat substitution'
            exit 1
          fi
          echo 'appcompat_runtime_proof=PASS' | tee build/reports/appcompat-runtime-proof/summary.txt

      - name: Capture emulator evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p build/reports/appcompat-runtime-proof
          printf 'head=%s\n' "$(git rev-parse HEAD)" > build/reports/appcompat-runtime-proof/source.txt
          cp "$RUNNER_TEMP/appcompat-emulator.log" build/reports/appcompat-runtime-proof/emulator.log 2>/dev/null

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appcompat-runtime-proof-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: build/reports/appcompat-runtime-proof/
