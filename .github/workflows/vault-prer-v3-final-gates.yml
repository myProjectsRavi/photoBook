name: Vault pre-R v3 Final Gates

on:
  push:
    branches:
      - exp/2.0.15-vault-prer-v3-final-gates

permissions:
  contents: read
  security-events: write

jobs:
  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify exact production source
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only d9f6a3579d6df0f1d4d7bcd27620a6256eaf6511...HEAD | tee /tmp/diff.txt
          test "$(cat /tmp/diff.txt)" = ".github/workflows/vault-prer-v3-final-gates.yml"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Fast compile and unit gate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest

  codeql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify exact production source
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only d9f6a3579d6df0f1d4d7bcd27620a6256eaf6511...HEAD | tee /tmp/diff.txt
          test "$(cat /tmp/diff.txt)" = ".github/workflows/vault-prer-v3-final-gates.yml"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Build for CodeQL extraction
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:assembleDebug -x test
      - name: Analyze locally
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results
          category: /language:java-kotlin/photobook-vault-prer-v3-final
      - name: Require zero Vault findings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee codeql-summary.txt
          import json
          from pathlib import Path

          sarifs = sorted(Path('codeql-results').rglob('*.sarif'))
          if not sarifs:
              raise SystemExit('FAIL: no CodeQL SARIF')
          findings = []
          for path in sarifs:
              data = json.loads(path.read_text(encoding='utf-8'))
              for run in data.get('runs', []):
                  for result in run.get('results', []):
                      locations = []
                      for loc in result.get('locations', []):
                          physical = loc.get('physicalLocation', {})
                          uri = physical.get('artifactLocation', {}).get('uri', '')
                          line = physical.get('region', {}).get('startLine')
                          locations.append((uri, line))
                      findings.append((result.get('ruleId', '<unknown>'), locations))

          print(f'codeql_results={len(findings)}')
          vault = []
          unexpected = []
          for rule, locations in findings:
              rendered = ','.join(f'{uri}:{line}' for uri, line in locations)
              print(f'rule={rule} locations={rendered}')
              is_vault = any('/feature/vault/' in uri for uri, _ in locations)
              known_md5 = (
                  rule == 'java/potentially-weak-cryptographic-algorithm' and
                  any(uri.endswith('DuplicatePhotoFinder.kt') for uri, _ in locations)
              )
              if is_vault:
                  vault.append((rule, locations))
              elif not known_md5:
                  unexpected.append((rule, locations))
          if vault:
              raise SystemExit(f'FAIL: Vault CodeQL findings remain: {vault}')
          if unexpected:
              raise SystemExit(f'FAIL: unexpected non-Vault findings: {unexpected}')
          print('vault_codeql=PASS_ZERO_VAULT_FINDINGS')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vault-prer-v3-codeql-${{ github.run_id }}
          path: |
            codeql-summary.txt
            codeql-results/
          retention-days: 14
