name: Verified Integration Correctness (Temporary)

on:
  push:
    branches:
      - stage/2.0.15-verified-integration

permissions:
  contents: read

concurrency:
  group: verified-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          echo "head=$(git rev-parse HEAD)"
          git status --short
      - name: Unit, lint, debug and release APK compilation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:verifyApkSize
