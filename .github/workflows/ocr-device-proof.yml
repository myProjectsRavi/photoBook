name: OCR Device Proof (Disposable)

on:
  push:
    branches:
      - exp/2.0.15-ocr-device-proof

permissions:
  contents: read

concurrency:
  group: ocr-device-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr-device-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact experiment head
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install emulator host runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0

      - name: Provision API 35 emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort | tail -n 1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          IMAGE="system-images;android-35;google_apis;x86_64"
          AVD="photobook-ocr-api35"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=0 emulator "$IMAGE"
          echo no | "$AVDMANAGER" create avd --force --name "$AVD" --package "$IMAGE" --device pixel_2 --path "$ANDROID_AVD_HOME/$AVD.avd"
          test -e /dev/kvm || { echo 'KVM unavailable'; exit 1; }
          sudo chmod 666 /dev/kvm
          "$EMULATOR" -accel-check
          nohup "$EMULATOR" -avd "$AVD" -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -memory 2048 -cores 2 > "$RUNNER_TEMP/ocr-emulator.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 120); do
            if "$ADB" get-state 2>/dev/null | grep -q '^device$'; then break; fi
            kill -0 "$pid" 2>/dev/null || { cat "$RUNNER_TEMP/ocr-emulator.log"; exit 1; }
            sleep 2
          done
          "$ADB" wait-for-device
          for _ in $(seq 1 120); do
            [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && break
            sleep 2
          done
          [[ "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]
          echo "sdk=$("$ADB" shell getprop ro.build.version.sdk | tr -d '\r') abi=$("$ADB" shell getprop ro.product.cpu.abi | tr -d '\r')"

      - name: Prebuild tests and trace production INTERNET provenance
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          mkdir -p build/reports/ocr-device-proof
          ./gradlew \
            :app:processReleaseMainManifest \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath \
            > build/reports/ocr-device-proof/release-runtime-dependencies.txt

          manifest="$(find app/build/intermediates/merged_manifest/release -type f -name AndroidManifest.xml | head -n 1)"
          test -n "$manifest" && test -f "$manifest"
          echo "release_manifest=$manifest" | tee build/reports/ocr-device-proof/manifest-provenance.txt
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo 'release_internet_present=YES' | tee -a build/reports/ocr-device-proof/manifest-provenance.txt
            grep -n -B 3 -A 3 'android.permission.INTERNET' "$manifest" \
              | tee -a build/reports/ocr-device-proof/manifest-provenance.txt
          else
            echo 'release_internet_present=NO' | tee -a build/reports/ocr-device-proof/manifest-provenance.txt
          fi

          # Android Gradle Plugin emits merge/blame intermediates with source attribution. Print every
          # small text/XML intermediate that mentions INTERNET so the contributing AAR can be identified
          # before any production manifest override is considered.
          while IFS= read -r candidate; do
            if grep -q 'android.permission.INTERNET' "$candidate" 2>/dev/null; then
              echo "--- provenance_file=$candidate" | tee -a build/reports/ocr-device-proof/manifest-provenance.txt
              grep -n -B 6 -A 6 'android.permission.INTERNET' "$candidate" 2>/dev/null \
                | head -n 80 \
                | tee -a build/reports/ocr-device-proof/manifest-provenance.txt
            fi
          done < <(find app/build/intermediates -type f \
            \( -name 'AndroidManifest.xml' -o -name '*blame*' -o -name '*report*.txt' \) \
            -size -5M | sort)

          echo '--- ML Kit / Play Services runtime dependency excerpt' \
            | tee -a build/reports/ocr-device-proof/manifest-provenance.txt
          grep -Ei 'mlkit|play-services|transport|datatransport|firebase' \
            build/reports/ocr-device-proof/release-runtime-dependencies.txt \
            | head -n 160 \
            | tee -a build/reports/ocr-device-proof/manifest-provenance.txt || true

      - name: Run real bundled OCR with host and emulator network blocked
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"
          uid="$(id -u)"

          # The debug/test APK may have debug-only network capabilities, so prove OCR independence at
          # the environment boundary: block non-loopback outbound traffic for runner/QEMU and enable
          # Android airplane mode before installing/running the test. Gradle is also forced offline.
          "$ADB" shell cmd connectivity airplane-mode enable || true
          "$ADB" shell svc wifi disable || true
          "$ADB" shell svc data disable || true
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 -m owner --uid-owner "$uid" -j REJECT
          cleanup() {
            sudo iptables -D OUTPUT -m owner --uid-owner "$uid" -j REJECT 2>/dev/null || true
            sudo iptables -D OUTPUT -o lo -j ACCEPT 2>/dev/null || true
          }
          trap cleanup EXIT

          airplane="$("$ADB" shell settings get global airplane_mode_on 2>/dev/null | tr -d '\r')"
          echo "airplane_mode=$airplane"
          [[ "$airplane" == "1" ]]
          if command -v curl >/dev/null && curl -fsS --connect-timeout 2 --max-time 3 https://www.google.com >/dev/null 2>&1; then
            echo 'Host outbound network unexpectedly reachable after firewall block'
            exit 1
          fi
          if "$ADB" shell 'command -v ping >/dev/null 2>&1'; then
            if "$ADB" shell ping -c 1 -W 1 8.8.8.8 >/dev/null 2>&1; then
              echo 'Emulator outbound network unexpectedly reachable'
              exit 1
            fi
          fi
          echo 'offline_network_gate=PASS'

          ./gradlew --offline :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.photobook.app.ml.LocalOcrEngineInstrumentedTest \
            --stacktrace

      - name: Capture evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p build/reports/ocr-device-proof
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"
          "$ADB" logcat -d > build/reports/ocr-device-proof/logcat.txt 2>/dev/null
          cp "$RUNNER_TEMP/ocr-emulator.log" build/reports/ocr-device-proof/emulator.log 2>/dev/null
          printf 'head=%s\n' "$(git rev-parse HEAD)" > build/reports/ocr-device-proof/source.txt

      - name: Upload OCR device evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ocr-device-proof-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/reports/ocr-device-proof/
