name: Vault v3 API30 Lint Boundary Fix

on:
  push:
    branches:
      - feature/2.0.15-vault-prer-recovery-v3
    paths:
      - .github/workflows/vault-v3-lint-boundary-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply guarded API30 boundary patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/photobook/app/feature/vault/VaultAuthCrypto.kt')
          s = p.read_text()
          start_marker = '        when (policy) {\n'
          end_marker = '\n        return KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, ANDROID_KEYSTORE).run {\n'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0 or s.find(start_marker, start + 1) >= 0:
              raise SystemExit('Ambiguous or missing primary-key policy block')
          block = s[start:end]
          if 'builder.setUserAuthenticationParameters(' not in block or 'setInvalidatedByBiometricEnrollment(true)' not in block:
              raise SystemExit('Primary-key policy block no longer matches expected semantics')
          replacement = '''        when (policy) {
              KeyPolicy.R_PLUS_COMBINED -> {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      configureRPlusPrimaryKey(builder)
                  } else {
                      throw IllegalStateException(
                          "Android 11+ Vault key policy requested below API 30",
                      )
                  }
              }
              KeyPolicy.PRE_R_BIOMETRIC -> {
                  check(Build.VERSION.SDK_INT < Build.VERSION_CODES.R)
                  @Suppress("DEPRECATION")
                  builder.setUserAuthenticationValidityDurationSeconds(-1)
                  builder.setInvalidatedByBiometricEnrollment(true)
              }
          }
          '''
          replacement = '\n'.join(line[4:] if line.startswith('    ') else line for line in replacement.splitlines()) + '\n'
          s = s[:start] + replacement + s[end:]

          anchor = '    private fun getOrCreateRecoveryKey(): SecretKey {\n'
          if s.count(anchor) != 1 or 'private fun configureRPlusPrimaryKey' in s:
              raise SystemExit('Recovery-key insertion anchor is ambiguous')
          helper = '''    @androidx.annotation.RequiresApi(Build.VERSION_CODES.R)
              private fun configureRPlusPrimaryKey(builder: KeyGenParameterSpec.Builder) {
                  builder.setUserAuthenticationParameters(
                      0,
                      KeyProperties.AUTH_BIOMETRIC_STRONG or KeyProperties.AUTH_DEVICE_CREDENTIAL,
                  )
              }

          '''
          helper = '\n'.join(line[4:] if line.startswith('    ') else line for line in helper.splitlines()) + '\n'
          s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s)
          PY

          rm .github/workflows/vault-v3-lint-boundary-fix.yml
          git diff --check
          test "$(git status --short | wc -l)" -eq 2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/vault-v3-lint-boundary-fix.yml app/src/main/java/com/photobook/app/feature/vault/VaultAuthCrypto.kt
          git commit -m "Make Android 11 Vault key API boundary explicit"
          git push origin HEAD:feature/2.0.15-vault-prer-recovery-v3
