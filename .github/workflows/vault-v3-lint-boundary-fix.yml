name: Vault v3 API30 Lint Boundary Fix

on:
  push:
    branches:
      - feature/2.0.15-vault-prer-recovery-v3
    paths:
      - .github/workflows/vault-v3-lint-boundary-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply guarded API30 boundary patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/photobook/app/feature/vault/VaultAuthCrypto.kt')
          s = p.read_text()
          old = '''        when (policy) {
              KeyPolicy.R_PLUS_COMBINED -> {
                  check(Build.VERSION.SDK_INT >= Build.VERSION_CODES.R)
                  builder.setUserAuthenticationParameters(
                      0,
                      KeyProperties.AUTH_BIOMETRIC_STRONG or KeyProperties.AUTH_DEVICE_CREDENTIAL,
                  )
              }
              KeyPolicy.PRE_R_BIOMETRIC -> {
                  check(Build.VERSION.SDK_INT < Build.VERSION_CODES.R)
                  @Suppress("DEPRECATION")
                  builder.setUserAuthenticationValidityDurationSeconds(-1)
                  builder.setInvalidatedByBiometricEnrollment(true)
              }
          }
          '''
          new = '''        when (policy) {
              KeyPolicy.R_PLUS_COMBINED -> {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      configureRPlusPrimaryKey(builder)
                  } else {
                      throw IllegalStateException(
                          "Android 11+ Vault key policy requested below API 30",
                      )
                  }
              }
              KeyPolicy.PRE_R_BIOMETRIC -> {
                  check(Build.VERSION.SDK_INT < Build.VERSION_CODES.R)
                  @Suppress("DEPRECATION")
                  builder.setUserAuthenticationValidityDurationSeconds(-1)
                  builder.setInvalidatedByBiometricEnrollment(true)
              }
          }
          '''
          old = '\n'.join(line[4:] if line.startswith('    ') else line for line in old.splitlines()) + '\n'
          new = '\n'.join(line[4:] if line.startswith('    ') else line for line in new.splitlines()) + '\n'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one API policy block, found {s.count(old)}')
          s = s.replace(old, new, 1)

          anchor = '''    private fun getOrCreateRecoveryKey(): SecretKey {
          '''
          anchor = '\n'.join(line[4:] if line.startswith('    ') else line for line in anchor.splitlines()) + '\n'
          helper = '''    @androidx.annotation.RequiresApi(Build.VERSION_CODES.R)
              private fun configureRPlusPrimaryKey(builder: KeyGenParameterSpec.Builder) {
                  builder.setUserAuthenticationParameters(
                      0,
                      KeyProperties.AUTH_BIOMETRIC_STRONG or KeyProperties.AUTH_DEVICE_CREDENTIAL,
                  )
              }

          '''
          helper = '\n'.join(line[4:] if line.startswith('    ') else line for line in helper.splitlines()) + '\n'
          if anchor not in s:
              raise SystemExit('Recovery key anchor missing')
          if 'private fun configureRPlusPrimaryKey' in s:
              raise SystemExit('API30 helper already exists')
          s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s)
          PY

          rm .github/workflows/vault-v3-lint-boundary-fix.yml
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected=$'.github/workflows/vault-v3-lint-boundary-fix.yml\napp/src/main/java/com/photobook/app/feature/vault/VaultAuthCrypto.kt'
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/vault-v3-lint-boundary-fix.yml app/src/main/java/com/photobook/app/feature/vault/VaultAuthCrypto.kt
          git commit -m "Make Android 11 Vault key API boundary explicit"
          git push origin HEAD:feature/2.0.15-vault-prer-recovery-v3
