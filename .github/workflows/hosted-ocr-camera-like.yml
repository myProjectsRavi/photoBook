name: Hosted Camera-like OCR Robustness (Disposable)

on:
  push:
    branches:
      - exp/2.0.15-hosted-max-acceptance
    paths:
      - .github/workflows/hosted-ocr-camera-like.yml

permissions:
  contents: read

jobs:
  robustness:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CANDIDATE_SHA: 9fd29f9987f6879f330b5b9cb4f33cde3c9b6d23
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prove production source unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$CANDIDATE_SHA"...HEAD | tee changed-files-camera-ocr.txt
          if git diff --name-only "$CANDIDATE_SHA"...HEAD | grep -E '^app/src/main/|^app/build.gradle.kts$|^app/proguard-rules.pro$|^gradle/|^build.gradle.kts$|^settings.gradle.kts$'; then
            echo 'Production/build source changed on hosted-proof branch' >&2
            exit 1
          fi
          test -f app/src/androidTest/java/com/photobook/app/ml/LocalOcrEngineRobustnessInstrumentedTest.kt
      - name: Install emulator host runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
      - name: Build app and robustness instrumentation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          manifest="$(find app/build/intermediates/merged_manifest/debug -type f -name AndroidManifest.xml -print -quit)"
          test -f "$manifest"
          ! grep -q 'android.permission.INTERNET' "$manifest"
      - name: Boot API35 emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -n1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          IMAGE='system-images;android-35;google_apis;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" build/reports/hosted-camera-ocr
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=0 emulator "$IMAGE"
          echo no | "$AVDMANAGER" create avd --force --name pb-camera-ocr --package "$IMAGE" --device pixel_2 --path "$ANDROID_AVD_HOME/pb-camera-ocr.avd"
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          nohup "$EMULATOR" -avd pb-camera-ocr -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -memory 2048 -cores 2 > "$RUNNER_TEMP/camera-ocr-emulator.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 150); do
            if "$ADB" get-state 2>/dev/null | grep -q '^device$'; then break; fi
            kill -0 "$pid" 2>/dev/null || { cat "$RUNNER_TEMP/camera-ocr-emulator.log"; exit 1; }
            sleep 2
          done
          "$ADB" wait-for-device
          for _ in $(seq 1 150); do
            [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && break
            sleep 2
          done
          [[ "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]
      - name: Cut network and run 5 camera-like OCR variants
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"
          uid="$(id -u)"
          REPORT="$GITHUB_WORKSPACE/build/reports/hosted-camera-ocr/summary.txt"
          "$ADB" shell cmd connectivity airplane-mode enable || true
          "$ADB" shell svc wifi disable || true
          "$ADB" shell svc data disable || true
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 -m owner --uid-owner "$uid" -j REJECT
          cleanup() {
            sudo iptables -D OUTPUT -m owner --uid-owner "$uid" -j REJECT 2>/dev/null || true
            sudo iptables -D OUTPUT -o lo -j ACCEPT 2>/dev/null || true
          }
          trap cleanup EXIT
          [[ "$("$ADB" shell settings get global airplane_mode_on | tr -d '\r')" == 1 ]]
          if curl -fsS --connect-timeout 2 --max-time 3 https://www.google.com >/dev/null 2>&1; then exit 1; fi
          app_apk="$(find app/build/outputs/apk/debug -type f -name '*arm64-v8a*.apk' -print -quit)"
          test_apk="$(find app/build/outputs/apk/androidTest/debug -type f -name '*.apk' -print -quit)"
          test -f "$app_apk" && test -f "$test_apk"
          "$ADB" install -r "$app_apk"
          "$ADB" install -r "$test_apk"
          "$ADB" shell dumpsys package com.photobook.app > "$RUNNER_TEMP/camera-ocr-package.txt"
          ! sed -n '/requested permissions:/,/install permissions:/p' "$RUNNER_TEMP/camera-ocr-package.txt" | grep -q 'android.permission.INTERNET'
          instrumentation="$("$ADB" shell pm list instrumentation | tr -d '\r' | grep '(target=com.photobook.app)' | head -n1 | sed -E 's/^instrumentation:([^ ]+).*/\1/')"
          test -n "$instrumentation"
          "$ADB" logcat -c
          "$ADB" shell am instrument -w -r -e class com.photobook.app.ml.LocalOcrEngineRobustnessInstrumentedTest "$instrumentation" | tee "$RUNNER_TEMP/camera-ocr-results.txt"
          grep -Eq 'OK \(5 tests?\)' "$RUNNER_TEMP/camera-ocr-results.txt"
          ! grep -Eq 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' "$RUNNER_TEMP/camera-ocr-results.txt"
          "$ADB" logcat -b crash -d > "$RUNNER_TEMP/camera-ocr-crash-buffer.txt" || true
          ! grep -Eqi 'Process: com\.photobook\.app|com\.photobook\.app.*(FATAL EXCEPTION|OutOfMemoryError|UnsatisfiedLinkError|dlopen failed)' "$RUNNER_TEMP/camera-ocr-crash-buffer.txt"
          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo 'offline_network_gate=PASS'
            echo 'installed_internet_permission=ABSENT'
            echo 'camera_like_variants=5'
            echo 'camera_like_ocr_robustness=PASS'
            echo 'NOTE=synthetic deterministic surrogate; not real-camera evidence'
          } | tee "$REPORT"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-camera-like-ocr-${{ github.run_id }}
          path: |
            build/reports/hosted-camera-ocr/
            changed-files-camera-ocr.txt
            ${{ runner.temp }}/camera-ocr-results.txt
            ${{ runner.temp }}/camera-ocr-crash-buffer.txt
            ${{ runner.temp }}/camera-ocr-emulator.log
          retention-days: 14
          if-no-files-found: warn
