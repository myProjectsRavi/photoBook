name: Vault pre-R Recovery v3 Wire

on:
  push:
    branches:
      - feature/2.0.15-vault-prer-recovery-v3
    paths:
      - .github/workflows/vault-prer-recovery-v3-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply focused Vault recovery integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/photobook/app/MainActivity.kt')
          text = main.read_text()
          import_anchor = 'import com.photobook.app.feature.vault.VaultService\n'
          import_line = 'import com.photobook.app.feature.vault.rememberVaultAuthenticator\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('MainActivity VaultService import anchor missing')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          start_marker = '    fun authenticateVault(onAuthenticated: (VaultCryptoSession) -> Unit) {\n'
          end_marker = '    fun requestMoveToTrash(photos: List<PhotoRecord>, archiveRetentionDays: Int? = null) {\n'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('MainActivity authenticateVault block anchors missing')
          text = text[:start] + '    val authenticateVault = rememberVaultAuthenticator(vaultService)\n\n' + text[end:]
          main.write_text(text)

          service = Path('app/src/main/java/com/photobook/app/feature/vault/VaultService.kt')
          text = service.read_text()
          if 'internal fun preparePreREnrollmentAfterCredential()' not in text:
              insert_at = text.find('    suspend fun listItems(\n')
              if insert_at < 0:
                  raise SystemExit('VaultService listItems anchor missing')
              wrappers = (
                  '    internal fun preparePreREnrollmentAfterCredential(): VaultPreRCredentialResult =\n'
                  '        authCrypto.preparePreREnrollmentAfterCredential()\n\n'
                  '    internal fun preparePreRRecoveryAfterCredential(): VaultPreRCredentialResult =\n'
                  '        authCrypto.preparePreRRecoveryAfterCredential()\n\n'
                  '    internal fun cancelAuthentication(preparation: VaultAuthPreparation) {\n'
                  '        authCrypto.cancelAuthentication(preparation)\n'
                  '    }\n\n'
              )
              text = text[:insert_at] + wrappers + text[insert_at:]
          service.write_text(text)

          crypto = Path('app/src/main/java/com/photobook/app/feature/vault/VaultAuthCrypto.kt')
          text = crypto.read_text()
          if 'policy == KeyPolicy.PRE_R_BIOMETRIC &&' not in text:
              marker = (
                  '        val preparation = runCatching {\n'
                  '            val key = getOrCreatePrimaryKey(policy)\n'
              )
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit('VaultAuthCrypto primary preparation anchor missing')
              guard = (
                  '        if (\n'
                  '            policy == KeyPolicy.PRE_R_BIOMETRIC &&\n'
                  '            BiometricManager.from(appContext).canAuthenticate(\n'
                  '                BiometricManager.Authenticators.BIOMETRIC_STRONG,\n'
                  '            ) != BiometricManager.BIOMETRIC_SUCCESS\n'
                  '        ) {\n'
                  '            val session = existingSessionHandle?.let(::sessionFrom)\n'
                  '                ?: sessionFromSerialized(serialized)\n'
                  '            serialized.fill(0)\n'
                  '            return VaultPreRCredentialResult.CredentialOnly(session)\n'
                  '        }\n\n'
              )
              text = text[:pos] + guard + text[pos:]
          crypto.write_text(text)
          PY

          cat > app/src/main/java/com/photobook/app/feature/vault/VaultAuthenticationCoordinator.kt <<'KOTLIN'
          package com.photobook.app.feature.vault

          import android.app.Activity
          import android.app.KeyguardManager
          import android.content.Context
          import android.os.Build
          import android.widget.Toast
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.biometric.BiometricManager
          import androidx.biometric.BiometricPrompt
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.platform.LocalContext
          import androidx.core.content.ContextCompat
          import androidx.fragment.app.FragmentActivity
          import com.photobook.app.R

          private enum class VaultCredentialAction {
              SETUP,
              RECOVER,
          }

          /**
           * Owns the complete Vault authentication UX while keeping the decrypt-capable key behind
           * Android Keystore authentication. Android 11+ uses the CryptoObject prompt directly;
           * Android 8-10 adds secure-lock-screen confirmation only for dual-wrap setup/recovery.
           */
          @Composable
          internal fun rememberVaultAuthenticator(
              vaultService: VaultService,
          ): ((VaultCryptoSession) -> Unit) -> Unit {
              val context = LocalContext.current
              val activity = context as? FragmentActivity
              var pendingCredentialAction by remember { mutableStateOf<VaultCredentialAction?>(null) }
              var pendingCompletion by remember {
                  mutableStateOf<((VaultCryptoSession) -> Unit)?>(null)
              }

              fun showFailure(message: CharSequence? = null) {
                  Toast.makeText(
                      context,
                      message ?: context.getString(R.string.vault_biometric_failed),
                      Toast.LENGTH_SHORT,
                  ).show()
              }

              fun launchBiometric(
                  preparation: VaultAuthPreparation,
                  onAuthenticated: (VaultCryptoSession) -> Unit,
              ) {
                  val host = activity
                  if (host == null) {
                      vaultService.cancelAuthentication(preparation)
                      showFailure()
                      return
                  }
                  if (
                      BiometricManager.from(context).canAuthenticate(preparation.promptAuthenticators) !=
                      BiometricManager.BIOMETRIC_SUCCESS
                  ) {
                      vaultService.cancelAuthentication(preparation)
                      showFailure()
                      return
                  }

                  val prompt = BiometricPrompt(
                      host,
                      ContextCompat.getMainExecutor(context),
                      object : BiometricPrompt.AuthenticationCallback() {
                          override fun onAuthenticationSucceeded(
                              result: BiometricPrompt.AuthenticationResult,
                          ) {
                              val authenticatedCipher = result.cryptoObject?.cipher
                              if (authenticatedCipher == null) {
                                  vaultService.cancelAuthentication(preparation)
                                  showFailure()
                                  return
                              }
                              val session = try {
                                  vaultService.completeAuthentication(preparation, authenticatedCipher)
                              } catch (_: Throwable) {
                                  vaultService.cancelAuthentication(preparation)
                                  showFailure()
                                  return
                              }
                              onAuthenticated(session)
                          }

                          override fun onAuthenticationError(
                              errorCode: Int,
                              errString: CharSequence,
                          ) {
                              vaultService.cancelAuthentication(preparation)
                              if (
                                  errorCode != BiometricPrompt.ERROR_NEGATIVE_BUTTON &&
                                  errorCode != BiometricPrompt.ERROR_USER_CANCELED &&
                                  errorCode != BiometricPrompt.ERROR_CANCELED
                              ) {
                                  showFailure(errString)
                              }
                          }
                      },
                  )
                  val builder = BiometricPrompt.PromptInfo.Builder()
                      .setTitle(context.getString(R.string.vault_biometric_title))
                      .setSubtitle(context.getString(R.string.vault_biometric_subtitle))
                      .setAllowedAuthenticators(preparation.promptAuthenticators)
                  if (
                      preparation.promptAuthenticators and
                      BiometricManager.Authenticators.DEVICE_CREDENTIAL == 0
                  ) {
                      builder.setNegativeButtonText(context.getString(android.R.string.cancel))
                  }
                  try {
                      prompt.authenticate(
                          builder.build(),
                          BiometricPrompt.CryptoObject(preparation.cipher),
                      )
                  } catch (_: Throwable) {
                      vaultService.cancelAuthentication(preparation)
                      showFailure()
                  }
              }

              val credentialLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.StartActivityForResult(),
              ) { result ->
                  val action = pendingCredentialAction
                  val completion = pendingCompletion
                  pendingCredentialAction = null
                  pendingCompletion = null
                  if (result.resultCode != Activity.RESULT_OK || action == null || completion == null) {
                      return@rememberLauncherForActivityResult
                  }
                  val credentialResult = try {
                      when (action) {
                          VaultCredentialAction.SETUP ->
                              vaultService.preparePreREnrollmentAfterCredential()
                          VaultCredentialAction.RECOVER ->
                              vaultService.preparePreRRecoveryAfterCredential()
                      }
                  } catch (_: Throwable) {
                      showFailure()
                      return@rememberLauncherForActivityResult
                  }
                  when (credentialResult) {
                      is VaultPreRCredentialResult.CredentialOnly ->
                          completion(credentialResult.session)
                      is VaultPreRCredentialResult.RequiresBiometric ->
                          launchBiometric(credentialResult.preparation, completion)
                  }
              }

              @Suppress("DEPRECATION")
              fun launchCredentialConfirmation(
                  action: VaultCredentialAction,
                  onAuthenticated: (VaultCryptoSession) -> Unit,
              ) {
                  val host = activity
                  if (host == null || Build.VERSION.SDK_INT < Build.VERSION_CODES.O) {
                      showFailure()
                      return
                  }
                  val keyguard = context.getSystemService(Context.KEYGUARD_SERVICE) as? KeyguardManager
                  if (keyguard?.isDeviceSecure != true) {
                      showFailure()
                      return
                  }
                  val intent = keyguard.createConfirmDeviceCredentialIntent(
                      context.getString(R.string.vault_biometric_title),
                      context.getString(R.string.vault_biometric_subtitle),
                  ) ?: run {
                      showFailure()
                      return
                  }
                  pendingCredentialAction = action
                  pendingCompletion = onAuthenticated
                  try {
                      credentialLauncher.launch(intent)
                  } catch (_: Throwable) {
                      pendingCredentialAction = null
                      pendingCompletion = null
                      showFailure()
                  }
              }

              return { onAuthenticated ->
                  if (activity == null) {
                      showFailure()
                  } else {
                      try {
                          launchBiometric(vaultService.prepareAuthentication(), onAuthenticated)
                      } catch (_: VaultCredentialSetupRequiredException) {
                          launchCredentialConfirmation(VaultCredentialAction.SETUP, onAuthenticated)
                      } catch (_: VaultCredentialRecoveryRequiredException) {
                          launchCredentialConfirmation(VaultCredentialAction.RECOVER, onAuthenticated)
                      } catch (_: Throwable) {
                          showFailure()
                      }
                  }
              }
          }
          KOTLIN

          rm .github/workflows/vault-prer-recovery-v3-wire.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/photobook/app/MainActivity.kt \
                  app/src/main/java/com/photobook/app/feature/vault/VaultService.kt \
                  app/src/main/java/com/photobook/app/feature/vault/VaultAuthCrypto.kt \
                  app/src/main/java/com/photobook/app/feature/vault/VaultAuthenticationCoordinator.kt \
                  .github/workflows/vault-prer-recovery-v3-wire.yml
          git commit -m "Complete pre-R Vault credential recovery integration"
          git push origin HEAD:feature/2.0.15-vault-prer-recovery-v3
