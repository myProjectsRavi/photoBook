name: API35 16K ARM64 4GB OCR Control (Disposable)

on:
  push:
    branches:
      - exp/2.0.15-api35-16k-arm64-4gb-control

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CANDIDATE_SHA: 04909b6e485c1ede12160aeac136598bee8d303f
    steps:
      - name: Checkout disposable workflow branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install emulator host runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0

      - name: Build exact candidate debug app and instrumentation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CANDIDATE_SHA"
          rm -rf "$RUNNER_TEMP/candidate"
          git worktree add --detach "$RUNNER_TEMP/candidate" "$CANDIDATE_SHA"
          test "$(git -C "$RUNNER_TEMP/candidate" rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C "$RUNNER_TEMP/candidate" status --porcelain)"
          cd "$RUNNER_TEMP/candidate"
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          manifest="$(find app/build/intermediates/merged_manifest/debug -type f -name AndroidManifest.xml -print -quit)"
          test -f "$manifest"
          ! grep -q 'android.permission.INTERNET' "$manifest"
          printf 'candidate_sha=%s\nproduction_candidate_modified=NO\ndebug_merged_manifest_internet=ABSENT\n' "$CANDIDATE_SHA" > "$GITHUB_WORKSPACE/report.txt"

      - name: Boot rooted API35 16K emulator with measured 4GB-class guest RAM
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -n1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          IMAGE='system-images;android-35;google_apis_ps16k;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=0 emulator "$IMAGE"
          echo no | "$AVDMANAGER" create avd --force --name pb16karm4g --package "$IMAGE" --device pixel_2 --path "$ANDROID_AVD_HOME/pb16karm4g.avd"
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          nohup "$EMULATOR" -avd pb16karm4g -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -memory 4096 -cores 2 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 150); do
            if "$ADB" get-state 2>/dev/null | grep -q '^device$'; then break; fi
            kill -0 "$pid" 2>/dev/null || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }
            sleep 2
          done
          "$ADB" wait-for-device
          for _ in $(seq 1 150); do
            [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && break
            sleep 2
          done
          [[ "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]
          "$ADB" root >/dev/null
          "$ADB" wait-for-device
          sdk="$("$ADB" shell getprop ro.build.version.sdk | tr -d '\r')"
          abi="$("$ADB" shell getprop ro.product.cpu.abi | tr -d '\r')"
          abilist="$("$ADB" shell getprop ro.product.cpu.abilist | tr -d '\r')"
          page="$("$ADB" shell getconf PAGE_SIZE | tr -d '\r')"
          mem_kb="$("$ADB" shell cat /proc/meminfo | tr -d '\r' | awk '/MemTotal:/ {print $2; exit}')"
          [[ "$sdk" == 35 ]]
          [[ "$page" == 16384 ]]
          [[ ",$abilist," == *,arm64-v8a,* ]]
          [[ "$mem_kb" =~ ^[0-9]+$ ]]
          (( mem_kb >= 3500000 ))
          "$ADB" shell setprop bionic.linker.16kb.app_compat.enabled false
          "$ADB" shell setprop pm.16kb.app_compat.disabled true
          bionic="$("$ADB" shell getprop bionic.linker.16kb.app_compat.enabled | tr -d '\r')"
          pm_disabled="$("$ADB" shell getprop pm.16kb.app_compat.disabled | tr -d '\r')"
          [[ "$bionic" == false ]]
          [[ "$pm_disabled" == true ]]
          {
            echo "sdk=$sdk"
            echo "runtime_host_abi=$abi"
            echo "abilist=$abilist"
            echo "page_size=$page"
            echo "mem_total_kb=$mem_kb"
            echo "bionic_16k_compat=$bionic"
            echo "pm_16k_compat_disabled=$pm_disabled"
          } | tee -a "$GITHUB_WORKSPACE/report.txt"

      - name: Run exact ARM64 candidate OCR five times fully offline
        working-directory: ${{ runner.temp }}/candidate
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          uid="$(id -u)"
          REPORT="$GITHUB_WORKSPACE/report.txt"
          "$ADB" shell cmd connectivity airplane-mode enable || true
          "$ADB" shell svc wifi disable || true
          "$ADB" shell svc data disable || true
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 -m owner --uid-owner "$uid" -j REJECT
          cleanup() {
            sudo iptables -D OUTPUT -m owner --uid-owner "$uid" -j REJECT 2>/dev/null || true
            sudo iptables -D OUTPUT -o lo -j ACCEPT 2>/dev/null || true
          }
          trap cleanup EXIT
          [[ "$("$ADB" shell settings get global airplane_mode_on | tr -d '\r')" == 1 ]]
          if curl -fsS --connect-timeout 2 --max-time 3 https://www.google.com >/dev/null 2>&1; then exit 1; fi
          if "$ADB" shell 'command -v ping >/dev/null 2>&1'; then ! "$ADB" shell ping -c 1 -W 1 8.8.8.8 >/dev/null 2>&1; fi
          echo 'offline_network_gate=PASS' | tee -a "$REPORT"

          app_apk="$(find app/build/outputs/apk/debug -type f -name '*arm64-v8a*.apk' -print -quit)"
          test_apk="$(find app/build/outputs/apk/androidTest/debug -type f -name '*.apk' -print -quit)"
          test -f "$app_apk" && test -f "$test_apk"
          ! "$AAPT" dump permissions "$app_apk" | grep -q 'android.permission.INTERNET'
          sha256sum "$app_apk" | tee -a "$REPORT"
          "$ADB" install -r "$app_apk" | tee "$RUNNER_TEMP/install-app.txt"
          "$ADB" install -r "$test_apk" | tee "$RUNNER_TEMP/install-test.txt"
          grep -Fq Success "$RUNNER_TEMP/install-app.txt"
          grep -Fq Success "$RUNNER_TEMP/install-test.txt"
          "$ADB" shell dumpsys package com.photobook.app > "$RUNNER_TEMP/package.txt"
          ! sed -n '/requested permissions:/,/install permissions:/p' "$RUNNER_TEMP/package.txt" | grep -q 'android.permission.INTERNET'
          installed_abi="$("$ADB" shell dumpsys package com.photobook.app | sed -n 's/.*primaryCpuAbi=//p' | head -n1 | tr -d '\r' | xargs)"
          [[ "$installed_abi" == arm64-v8a ]]
          echo "installed_primary_cpu_abi=$installed_abi" | tee -a "$REPORT"

          "$ADB" shell am force-stop com.photobook.app
          "$ADB" shell am start -W -n com.photobook.app/.MainActivity | tee "$RUNNER_TEMP/startup.txt"
          grep -Fq 'Status: ok' "$RUNNER_TEMP/startup.txt"
          echo 'cold_startup=PASS' | tee -a "$REPORT"
          instrumentation="$("$ADB" shell pm list instrumentation | tr -d '\r' | grep '(target=com.photobook.app)' | head -n1 | sed -E 's/^instrumentation:([^ ]+).*/\1/')"
          test -n "$instrumentation"
          mkdir -p "$GITHUB_WORKSPACE/ocr-runs"
          passes=0
          for i in 1 2 3 4 5; do
            "$ADB" shell am force-stop com.photobook.app || true
            "$ADB" logcat -c || true
            set +e
            timeout 75 "$ADB" shell am instrument -w -r -e class com.photobook.app.ml.LocalOcrEngineInstrumentedTest "$instrumentation" > "$GITHUB_WORKSPACE/ocr-runs/run-$i.txt" 2>&1
            rc=$?
            set -e
            "$ADB" logcat -d -b crash > "$GITHUB_WORKSPACE/ocr-runs/crash-$i.txt" || true
            ok=0
            if [[ "$rc" -eq 0 ]] && grep -Eq 'OK \(1 test\)|OK \(1 tests\)' "$GITHUB_WORKSPACE/ocr-runs/run-$i.txt" && ! grep -Eq 'Process crashed|INSTRUMENTATION_FAILED|FAILURES' "$GITHUB_WORKSPACE/ocr-runs/run-$i.txt" && ! grep -Eqi 'FATAL EXCEPTION|Fatal signal|OutOfMemoryError|UnsatisfiedLinkError|dlopen failed|cannot locate symbol|bad ELF|alignment.*error|page size.*error' "$GITHUB_WORKSPACE/ocr-runs/crash-$i.txt"; then
              ok=1
              passes=$((passes+1))
            fi
            echo "ocr_run_$i rc=$rc pass=$ok" | tee -a "$REPORT"
            if [[ "$ok" -ne 1 ]]; then cat "$GITHUB_WORKSPACE/ocr-runs/run-$i.txt"; cat "$GITHUB_WORKSPACE/ocr-runs/crash-$i.txt"; fi
          done
          echo "ocr_passes=$passes/5" | tee -a "$REPORT"
          [[ "$passes" -eq 5 ]]
          echo 'api35_16k_arm64_4gb_control=PASS' | tee -a "$REPORT"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api35-16k-arm64-4gb-${{ github.run_id }}
          path: |
            report.txt
            ocr-runs/
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/startup.txt
            ${{ runner.temp }}/package.txt
          retention-days: 14
          if-no-files-found: warn
