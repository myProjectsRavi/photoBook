name: Vault Preview Final V2 Corrected Play Delivery

on:
  push:
    branches:
      - exp/2.0.15-vault-preview-final-v2-play-corrected
    paths:
      - .github/workflows/vault-preview-final-v2-play-corrected.yml

permissions:
  contents: read

env:
  CANDIDATE_SHA: 9fd29f9987f6879f330b5b9cb4f33cde3c9b6d23
  HARNESS_PATH: .github/workflows/vault-preview-final-v2-play-corrected.yml

jobs:
  corrected-play-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prove harness-only branch delta
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$CANDIDATE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = "$HARNESS_PATH"
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build exact candidate AAB
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease :app:verifyReleaseBundleSize
          test -f app/build/outputs/bundle/release/app-release.aab
      - name: Verify candidate AAB identity size and signing state
        shell: bash
        run: |
          set -euo pipefail
          report=build/reports/final-v2-play-corrected
          mkdir -p "$report"
          aab=app/build/outputs/bundle/release/app-release.aab
          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "aab_bytes=$(stat -c %s "$aab")"
            echo "aab_sha256=$(sha256sum "$aab" | awk '{print $1}')"
            echo "version_metadata=$(./gradlew -q :app:printReleaseMetadata | tr '\n' ' ')"
          } | tee "$report/aab-identity.txt"
          jarsigner -verify -verbose -certs "$aab" > "$report/jarsigner.txt" 2>&1 || true
          cat "$report/jarsigner.txt"
          if zipinfo -1 "$aab" | grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC)$'; then
            grep -qi 'jar verified' "$report/jarsigner.txt"
            echo 'aab_signing_state=SIGNED' | tee -a "$report/aab-identity.txt"
          else
            grep -qi 'jar is unsigned' "$report/jarsigner.txt"
            echo 'aab_signing_state=UNSIGNED' | tee -a "$report/aab-identity.txt"
          fi
      - name: Verify bundletool and corrected Play delivery
        shell: bash
        run: |
          set -euo pipefail
          report=build/reports/final-v2-play-corrected
          curl -fL --retry 3 --retry-delay 2 -o bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  bundletool.jar' | sha256sum -c -
          echo "bundletool_version=$(java -jar bundletool.jar version)" | tee "$report/play-delivery.txt"
          cat > "$report/arm64-api36.json" <<'JSON'
          {"supportedAbis":["arm64-v8a"],"supportedLocales":["en"],"screenDensity":420,"sdkVersion":36}
          JSON
          cat > "$report/armeabi-api26.json" <<'JSON'
          {"supportedAbis":["armeabi-v7a"],"supportedLocales":["en"],"screenDensity":320,"sdkVersion":26}
          JSON
          for spec in arm64-api36 armeabi-api26; do
            java -jar bundletool.jar build-apks \
              --bundle=app/build/outputs/bundle/release/app-release.aab \
              --output="$report/$spec.apks" \
              --device-spec="$report/$spec.json" \
              --overwrite
            size_csv="$report/$spec-size.csv"
            java -jar bundletool.jar get-size total \
              --apks="$report/$spec.apks" \
              --device-spec="$report/$spec.json" > "$size_csv"
            cat "$size_csv" | tee -a "$report/play-delivery.txt"
            header="$(head -n 1 "$size_csv" | tr -d '\r')"
            values="$(tail -n 1 "$size_csv" | tr -d '\r')"
            test "$header" = 'MIN,MAX'
            minimum="${values%%,*}"
            maximum="${values##*,}"
            [[ "$minimum" =~ ^[0-9]+$ ]]
            [[ "$maximum" =~ ^[0-9]+$ ]]
            limit=$((15 * 1024 * 1024))
            mib="$(awk -v b="$maximum" 'BEGIN { printf "%.3f", b/1024/1024 }')"
            margin=$((limit - maximum))
            {
              echo "device=$spec"
              echo "delivered_min_bytes=$minimum"
              echo "delivered_max_bytes=$maximum"
              echo "delivered_max_mib=$mib"
              echo "delivered_margin_to_15mib=$margin"
            } | tee -a "$report/play-delivery.txt"
            test "$maximum" -lt "$limit"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: photobook-candidate-aab-9fd29f-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            app/build/outputs/bundle/release/app-release.aab
            build/reports/final-v2-play-corrected/
