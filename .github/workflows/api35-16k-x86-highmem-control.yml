name: API35 16K x86_64 High-Memory Control (Disposable)

on:
  push:
    branches: [exp/2.0.15-api35-16k-x86-highmem-control]

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CANDIDATE_SHA: 04909b6e485c1ede12160aeac136598bee8d303f
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install emulator host runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
      - name: Prepare exact candidate with ephemeral x86_64 packaging only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CANDIDATE_SHA"
          git worktree add --detach "$RUNNER_TEMP/candidate" "$CANDIDATE_SHA"
          test "$(git -C "$RUNNER_TEMP/candidate" rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("${{ runner.temp }}/candidate/app/build.gradle.kts")
          s = p.read_text()
          assert s.count('excludes += setOf("**/x86/**", "**/x86_64/**")') == 1
          assert s.count('include("arm64-v8a", "armeabi-v7a")') == 1
          s = s.replace('excludes += setOf("**/x86/**", "**/x86_64/**")', 'excludes += setOf("**/x86/**")')
          s = s.replace('include("arm64-v8a", "armeabi-v7a")', 'include("arm64-v8a", "armeabi-v7a", "x86_64")')
          p.write_text(s)
          PY
          [[ "$(git -C "$RUNNER_TEMP/candidate" diff --name-only)" == 'app/build.gradle.kts' ]]
          git -C "$RUNNER_TEMP/candidate" diff -- app/build.gradle.kts > "$GITHUB_WORKSPACE/ephemeral-x86.patch"
          printf 'candidate_sha=%s\nproduction_candidate_modified=NO\nephemeral_change=x86_64_packaging_only\n' "$CANDIDATE_SHA" > "$GITHUB_WORKSPACE/report.txt"
      - name: Build diagnostic x86_64 app and instrumentation
        working-directory: ${{ runner.temp }}/candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          apk="$(find app/build/outputs/apk/debug -type f -name '*x86_64*.apk' | head -n1)"
          test -f "$apk"
          unzip -l "$apk" | grep -F 'lib/x86_64/libmlkit_google_ocr_pipeline.so'
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          ! "$AAPT" dump permissions "$apk" | grep -q android.permission.INTERNET
          sha256sum "$apk" >> "$GITHUB_WORKSPACE/report.txt"
      - name: Boot API35 16K emulator with 4GB guest and compat mode off
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -n1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          IMAGE='system-images;android-35;google_apis_ps16k;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user" ANDROID_EMULATOR_HOME="$RUNNER_TEMP/android-user" ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=0 emulator "$IMAGE"
          echo no | "$AVDMANAGER" create avd --force --name pb16khm --package "$IMAGE" --device pixel_2 --path "$ANDROID_AVD_HOME/pb16khm.avd"
          sudo chmod 666 /dev/kvm
          nohup "$EMULATOR" -avd pb16khm -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -memory 4096 -cores 2 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 150); do "$ADB" get-state 2>/dev/null | grep -q '^device$' && break; kill -0 "$pid" || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }; sleep 2; done
          "$ADB" wait-for-device
          for _ in $(seq 1 150); do [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && break; sleep 2; done
          [[ "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]
          [[ "$("$ADB" shell getconf PAGE_SIZE | tr -d '\r')" == 16384 ]]
          [[ "$("$ADB" shell getprop ro.product.cpu.abi | tr -d '\r')" == x86_64 ]]
          mem_kb="$("$ADB" shell cat /proc/meminfo | tr -d '\r' | awk '/MemTotal:/ {print $2; exit}')"
          echo "mem_total_kb=$mem_kb" | tee -a "$GITHUB_WORKSPACE/report.txt"
          (( mem_kb >= 3500000 ))
          "$ADB" root >/dev/null
          "$ADB" wait-for-device
          [[ "$("$ADB" shell id -u | tr -d '\r')" == 0 ]]
          "$ADB" shell setprop bionic.linker.16kb.app_compat.enabled false
          "$ADB" shell setprop pm.16kb.app_compat.disabled true
          [[ "$("$ADB" shell getprop bionic.linker.16kb.app_compat.enabled | tr -d '\r')" == false ]]
          [[ "$("$ADB" shell getprop pm.16kb.app_compat.disabled | tr -d '\r')" == true ]]
          printf 'page_size=16384\nruntime_abi=x86_64_native\ncompat_mode_off=VERIFIED\n' | tee -a "$GITHUB_WORKSPACE/report.txt"
      - name: Run bundled OCR three times offline and distinguish LMK from native crash
        working-directory: ${{ runner.temp }}/candidate
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"; ADB="$SDK_ROOT/platform-tools/adb"; uid="$(id -u)"; REPORT="$GITHUB_WORKSPACE/report.txt"
          "$ADB" shell cmd connectivity airplane-mode enable || true; "$ADB" shell svc wifi disable || true; "$ADB" shell svc data disable || true
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT; sudo iptables -I OUTPUT 2 -m owner --uid-owner "$uid" -j REJECT
          cleanup(){ sudo iptables -D OUTPUT -m owner --uid-owner "$uid" -j REJECT 2>/dev/null || true; sudo iptables -D OUTPUT -o lo -j ACCEPT 2>/dev/null || true; }; trap cleanup EXIT
          [[ "$("$ADB" shell settings get global airplane_mode_on | tr -d '\r')" == 1 ]]
          if curl -fsS --connect-timeout 2 --max-time 3 https://www.google.com >/dev/null 2>&1; then exit 1; fi
          app_apk="$(find app/build/outputs/apk/debug -type f -name '*x86_64*.apk' | head -n1)"; test_apk="$(find app/build/outputs/apk/androidTest/debug -type f -name '*.apk' | head -n1)"
          "$ADB" install -r "$app_apk" | grep -F Success; "$ADB" install -r "$test_apk" | grep -F Success
          sleep 15
          instrumentation="$("$ADB" shell pm list instrumentation | tr -d '\r' | grep '(target=com.photobook.app)' | head -n1 | sed -E 's/^instrumentation:([^ ]+).*/\1/')"; test -n "$instrumentation"
          "$ADB" logcat -c
          for i in 1 2 3; do
            out="$RUNNER_TEMP/ocr-$i.txt"; set +e; "$ADB" shell am instrument -w -r -e class com.photobook.app.ml.LocalOcrEngineInstrumentedTest "$instrumentation" > "$out" 2>&1; rc=$?; set -e; cat "$out"
            if [[ "$rc" -ne 0 ]] || ! grep -Eq 'OK \(1 tests?\)' "$out"; then
              "$ADB" logcat -d > "$RUNNER_TEMP/logcat.txt" || true
              if grep -F "lowmemorykiller: Kill 'com.photobook.app'" "$RUNNER_TEMP/logcat.txt"; then echo "ocr_run_$i=FAIL_LMK" | tee -a "$REPORT"; else echo "ocr_run_$i=FAIL_NON_LMK" | tee -a "$REPORT"; fi
              exit 1
            fi
            echo "ocr_run_$i=PASS" | tee -a "$REPORT"
          done
          "$ADB" logcat -d > "$RUNNER_TEMP/logcat.txt"
          ! grep -Eqi 'FATAL EXCEPTION|Fatal signal|UnsatisfiedLinkError|dlopen failed|cannot locate symbol|bad ELF' "$RUNNER_TEMP/logcat.txt"
          echo 'api35_16k_x86_highmem_control=PASS' | tee -a "$REPORT"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api35-16k-x86-highmem-${{ github.run_id }}
          path: |
            report.txt
            ephemeral-x86.patch
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/logcat.txt
            ${{ runner.temp }}/ocr-1.txt
            ${{ runner.temp }}/ocr-2.txt
            ${{ runner.temp }}/ocr-3.txt
          retention-days: 14
          if-no-files-found: warn
