name: OCR Camera-like Robustness (Disposable)

on:
  push:
    branches:
      - exp/2.0.15-ocr-camera-like-robustness

permissions:
  contents: read

jobs:
  robustness:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: 04909b6e485c1ede12160aeac136598bee8d303f
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prove production tree is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$CANDIDATE_SHA"...HEAD | tee changed-files.txt
          test "$(wc -l < changed-files.txt)" -eq 2
          grep -Fxq '.github/workflows/ocr-camera-like-robustness.yml' changed-files.txt
          grep -Fxq 'app/src/androidTest/java/com/photobook/app/ml/LocalOcrEngineRobustnessInstrumentedTest.kt' changed-files.txt
          if git diff --name-only "$CANDIDATE_SHA"...HEAD | grep -E '^app/src/main/|^app/build.gradle.kts$|^app/proguard-rules.pro$'; then
            echo 'FAIL: production source changed' >&2
            exit 1
          fi
          echo 'production_tree_delta=NONE'
      - name: Install emulator host runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
      - name: Build app and robustness instrumentation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          manifest="$(find app/build/intermediates/merged_manifest/debug -type f -name AndroidManifest.xml | head -n1)"
          test -f "$manifest"
          ! grep -q 'android.permission.INTERNET' "$manifest"
          echo 'debug_merged_manifest_internet=ABSENT'
      - name: Provision API35 emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort | tail -n1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          IMAGE="system-images;android-35;google_apis;x86_64"
          AVD="photobook-ocr-robustness-api35"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=0 emulator "$IMAGE"
          echo no | "$AVDMANAGER" create avd --force --name "$AVD" --package "$IMAGE" --device pixel_2 --path "$ANDROID_AVD_HOME/$AVD.avd"
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          nohup "$EMULATOR" -avd "$AVD" -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -memory 2048 -cores 2 > "$RUNNER_TEMP/ocr-robustness-emulator.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 120); do
            if "$ADB" get-state 2>/dev/null | grep -q '^device$'; then break; fi
            kill -0 "$pid" 2>/dev/null || { cat "$RUNNER_TEMP/ocr-robustness-emulator.log"; exit 1; }
            sleep 2
          done
          "$ADB" wait-for-device
          for _ in $(seq 1 120); do
            [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && break
            sleep 2
          done
          [[ "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]
          echo "sdk=$("$ADB" shell getprop ro.build.version.sdk | tr -d '\r') abi=$("$ADB" shell getprop ro.product.cpu.abi | tr -d '\r') abilist=$("$ADB" shell getprop ro.product.cpu.abilist | tr -d '\r')" | tee ocr-robustness-report.txt
      - name: Cut network and run camera-like OCR robustness suite
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"
          uid="$(id -u)"
          REPORT="$GITHUB_WORKSPACE/ocr-robustness-report.txt"
          "$ADB" shell cmd connectivity airplane-mode enable || true
          "$ADB" shell svc wifi disable || true
          "$ADB" shell svc data disable || true
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 -m owner --uid-owner "$uid" -j REJECT
          cleanup() {
            sudo iptables -D OUTPUT -m owner --uid-owner "$uid" -j REJECT 2>/dev/null || true
            sudo iptables -D OUTPUT -o lo -j ACCEPT 2>/dev/null || true
          }
          trap cleanup EXIT
          [[ "$("$ADB" shell settings get global airplane_mode_on | tr -d '\r')" == 1 ]]
          if curl -fsS --connect-timeout 2 --max-time 3 https://www.google.com >/dev/null 2>&1; then
            echo 'FAIL: host outbound network reachable' >&2
            exit 1
          fi
          if "$ADB" shell 'command -v ping >/dev/null 2>&1'; then
            ! "$ADB" shell ping -c 1 -W 1 8.8.8.8 >/dev/null 2>&1
          fi
          echo 'offline_network_gate=PASS' | tee -a "$REPORT"

          app_apk="$(find app/build/outputs/apk/debug -type f -name '*arm64-v8a*.apk' | head -n1)"
          test_apk="$(find app/build/outputs/apk/androidTest/debug -type f -name '*.apk' | head -n1)"
          test -f "$app_apk" && test -f "$test_apk"
          "$ADB" install -r "$app_apk"
          "$ADB" install -r "$test_apk"
          "$ADB" shell dumpsys package com.photobook.app > "$RUNNER_TEMP/package.txt"
          ! sed -n '/requested permissions:/,/install permissions:/p' "$RUNNER_TEMP/package.txt" | grep -q 'android.permission.INTERNET'
          echo 'installed_internet_permission=ABSENT' | tee -a "$REPORT"

          instrumentation="$("$ADB" shell pm list instrumentation | tr -d '\r' | grep '(target=com.photobook.app)' | head -n1 | sed -E 's/^instrumentation:([^ ]+).*/\1/')"
          test -n "$instrumentation"
          "$ADB" logcat -c
          "$ADB" shell am instrument -w -r \
            -e class com.photobook.app.ml.LocalOcrEngineRobustnessInstrumentedTest \
            "$instrumentation" | tee "$RUNNER_TEMP/ocr-robustness.txt"
          grep -Eq 'OK \(5 tests?\)' "$RUNNER_TEMP/ocr-robustness.txt"
          ! grep -Eq 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' "$RUNNER_TEMP/ocr-robustness.txt"
          "$ADB" logcat -d > "$RUNNER_TEMP/ocr-robustness-logcat.txt"
          if grep -Eqi 'FATAL EXCEPTION|OutOfMemoryError|UnsatisfiedLinkError|dlopen failed' "$RUNNER_TEMP/ocr-robustness-logcat.txt"; then
            echo 'FAIL: fatal/native/OOM marker in robustness logcat' >&2
            exit 1
          fi
          echo 'camera_like_variants=5' | tee -a "$REPORT"
          echo 'camera_like_ocr_robustness=PASS' | tee -a "$REPORT"
          echo 'NOTE=synthetic deterministic surrogate; not real-camera evidence' | tee -a "$REPORT"
      - name: Upload robustness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ocr-camera-like-robustness-${{ github.run_id }}
          path: |
            ocr-robustness-report.txt
            changed-files.txt
            ${{ runner.temp }}/ocr-robustness.txt
            ${{ runner.temp }}/ocr-robustness-logcat.txt
            ${{ runner.temp }}/ocr-robustness-emulator.log
          retention-days: 14
          if-no-files-found: warn
