name: Phase 2 Finalize ViewModel Generation

on:
  push:
    branches:
      - "agent/phase2-index-search-v2"
    paths:
      - "tools/phase2/finalize_viewmodel_generation.py"
      - ".github/workflows/phase2-finalize-viewmodel.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/phase2-index-search-v2
          fetch-depth: 0
      - name: Finalize ViewModel generation handling
        run: python3 tools/phase2/finalize_viewmodel_generation.py
      - name: Validate patch
        run: |
          git diff --check
          git diff -- app/src/main/java/com/photobook/app/ui/viewmodel/MainViewModel.kt
      - name: Commit ViewModel finalization
        run: |
          if git diff --quiet -- app/src/main/java/com/photobook/app/ui/viewmodel/MainViewModel.kt; then
            echo "No MainViewModel changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/photobook/app/ui/viewmodel/MainViewModel.kt
          git commit -m "phase2: keep search post-processing on one generation"
          git push origin HEAD:agent/phase2-index-search-v2
