name: R8 Debug Attributes Measurement (Disposable)

on:
  push:
    branches:
      - "exp/2.0.15-r8-debug-attributes-measurement"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Inject best-known config and remove explicit debug attributes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          build = Path("app/build.gradle.kts")
          s = build.read_text()
          old_ndk = '            ndk {\n                debugSymbolLevel = "SYMBOL_TABLE"\n            }\n'
          new_ndk = '            ndk {\n                debugSymbolLevel = "SYMBOL_TABLE"\n                abiFilters += listOf("arm64-v8a", "armeabi-v7a")\n            }\n'
          assert s.count(old_ndk) == 1
          s = s.replace(old_ndk, new_ndk, 1)
          old_split = '        abi {\n            isEnable = true\n            reset()\n            include("arm64-v8a", "armeabi-v7a")'
          new_split = '        abi {\n            isEnable = false\n            reset()\n            include("arm64-v8a", "armeabi-v7a")'
          assert s.count(old_split) == 1
          build.write_text(s.replace(old_split, new_split, 1))

          rules = Path("app/proguard-rules.pro")
          r = rules.read_text()
          removable = [
              '-keepattributes SourceFile,LineNumberTable\n',
              '-renamesourcefileattribute SourceFile\n',
              '-keep class com.google.mlkit.** { *; }\n',
              '-keep class androidx.security.crypto.** { *; }\n',
              '-keep class com.google.crypto.tink.** { *; }\n',
              '-keep class * extends androidx.room.RoomDatabase { *; }\n',
              '-keep @androidx.room.Entity class * { *; }\n',
              '-keep @androidx.room.Dao interface * { *; }\n',
              '-keep class * extends androidx.work.Worker { *; }\n',
              '-keep class * extends androidx.work.CoroutineWorker { *; }\n',
              '-keep class * extends androidx.work.ListenableWorker { *; }\n',
              '-keep class com.google.zxing.** { *; }\n',
          ]
          for rule in removable:
              assert r.count(rule) == 1, rule
              r = r.replace(rule, '', 1)
          rules.write_text(r)
          PY
          git diff -- app/build.gradle.kts app/proguard-rules.pro

      - name: Run unit tests, lint, and build AAB
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:bundleRelease -x :app:verifyReleaseBundleSize

      - name: Report size and retrace metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/r8-debug-attributes
          python3 - <<'PY' | tee build/reports/r8-debug-attributes/result.txt
          from pathlib import Path
          import re, zipfile
          aab = Path("app/build/outputs/bundle/release/app-release.aab")
          mapping_path = Path("app/build/outputs/mapping/release/mapping.txt")
          limit = 20 * 1024 * 1024
          with zipfile.ZipFile(aab) as z:
              infos = [i for i in z.infolist() if not i.is_dir()]
              total = aab.stat().st_size
              mapping_entry = next(i for i in infos if i.filename.endswith('/proguard.map'))
              print(f"aab_bytes={total}")
              print(f"aab_mib={total/1024/1024:.3f}")
              print(f"under_20_mib={total <= limit}")
              print(f"over_gate_bytes={max(total-limit,0)}")
              print(f"mapping_compressed_bytes={mapping_entry.compress_size}")
              print(f"mapping_uncompressed_bytes={mapping_entry.file_size}")
          text = mapping_path.read_text(errors='replace')
          line_mapping_count = sum(1 for line in text.splitlines() if re.match(r'^\s*\d+:\d+:', line))
          class_mapping_count = sum(1 for line in text.splitlines() if line and not line.startswith(' ') and ' -> ' in line and line.endswith(':'))
          print(f"mapping_line_entries={line_mapping_count}")
          print(f"mapping_class_entries={class_mapping_count}")
          PY

      - name: Upload measurement report
        uses: actions/upload-artifact@v7
        with:
          name: r8-debug-attributes-${{ github.run_id }}
          path: build/reports/r8-debug-attributes/result.txt
          if-no-files-found: error
          retention-days: 14
