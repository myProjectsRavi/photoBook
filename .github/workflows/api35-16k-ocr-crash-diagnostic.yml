name: API35 16K OCR Crash Diagnostic (Disposable)

on:
  push:
    branches:
      - exp/2.0.15-api35-16k-ocr-crash-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CANDIDATE_SHA: 04909b6e485c1ede12160aeac136598bee8d303f
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install emulator host runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
      - name: Checkout exact candidate and build debug artifacts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CANDIDATE_SHA"
          rm -rf "$RUNNER_TEMP/candidate"
          git worktree add --detach "$RUNNER_TEMP/candidate" "$CANDIDATE_SHA"
          test "$(git -C "$RUNNER_TEMP/candidate" rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C "$RUNNER_TEMP/candidate" status --porcelain)"
          cd "$RUNNER_TEMP/candidate"
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Boot rooted API35 16K emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -n1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          IMAGE="system-images;android-35;google_apis_ps16k;x86_64"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=0 emulator "$IMAGE"
          echo no | "$AVDMANAGER" create avd --force --name pb16kdiag --package "$IMAGE" --device pixel_2 --path "$ANDROID_AVD_HOME/pb16kdiag.avd"
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          nohup "$EMULATOR" -avd pb16kdiag -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -memory 2048 -cores 2 > "$RUNNER_TEMP/16k-diagnostic-emulator.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 150); do
            if "$ADB" get-state 2>/dev/null | grep -q '^device$'; then break; fi
            kill -0 "$pid" 2>/dev/null || { cat "$RUNNER_TEMP/16k-diagnostic-emulator.log"; exit 1; }
            sleep 2
          done
          "$ADB" wait-for-device
          for _ in $(seq 1 150); do
            [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && break
            sleep 2
          done
          [[ "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]
          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "sdk=$("$ADB" shell getprop ro.build.version.sdk | tr -d '\r')"
            echo "abi=$("$ADB" shell getprop ro.product.cpu.abi | tr -d '\r')"
            echo "abilist=$("$ADB" shell getprop ro.product.cpu.abilist | tr -d '\r')"
            echo "page_size=$("$ADB" shell getconf PAGE_SIZE | tr -d '\r')"
          } | tee 16k-crash-diagnostic-report.txt
          [[ "$("$ADB" shell getconf PAGE_SIZE | tr -d '\r')" == 16384 ]]
          [[ ",$("$ADB" shell getprop ro.product.cpu.abilist | tr -d '\r')," == *,arm64-v8a,* ]]
          "$ADB" root | tee -a 16k-crash-diagnostic-report.txt
          "$ADB" wait-for-device
          [[ "$("$ADB" shell id -u | tr -d '\r')" == 0 ]]
          "$ADB" shell setprop bionic.linker.16kb.app_compat.enabled false
          "$ADB" shell setprop pm.16kb.app_compat.disabled true
          echo "bionic_16k_compat=$("$ADB" shell getprop bionic.linker.16kb.app_compat.enabled | tr -d '\r')" | tee -a 16k-crash-diagnostic-report.txt
          echo "pm_16k_compat_disabled=$("$ADB" shell getprop pm.16kb.app_compat.disabled | tr -d '\r')" | tee -a 16k-crash-diagnostic-report.txt
      - name: Install exact candidate, reproduce OCR crash, always capture diagnostics
        shell: bash
        run: |
          set -u -o pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          CANDIDATE="$RUNNER_TEMP/candidate"
          REPORT="$GITHUB_WORKSPACE/16k-crash-diagnostic-report.txt"
          uid="$(id -u)"
          mkdir -p "$GITHUB_WORKSPACE/16k-diagnostics"

          "$ADB" shell cmd connectivity airplane-mode enable >/dev/null 2>&1 || true
          "$ADB" shell svc wifi disable >/dev/null 2>&1 || true
          "$ADB" shell svc data disable >/dev/null 2>&1 || true
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 -m owner --uid-owner "$uid" -j REJECT
          cleanup() {
            sudo iptables -D OUTPUT -m owner --uid-owner "$uid" -j REJECT 2>/dev/null || true
            sudo iptables -D OUTPUT -o lo -j ACCEPT 2>/dev/null || true
          }
          trap cleanup EXIT

          app_apk="$(find "$CANDIDATE/app/build/outputs/apk/debug" -type f -name '*arm64-v8a*.apk' | head -n1)"
          test_apk="$(find "$CANDIDATE/app/build/outputs/apk/androidTest/debug" -type f -name '*.apk' | head -n1)"
          test -f "$app_apk" || exit 2
          test -f "$test_apk" || exit 2
          if "$AAPT" dump permissions "$app_apk" | grep -q 'android.permission.INTERNET'; then exit 3; fi
          "$ADB" install -r "$app_apk" | tee "$GITHUB_WORKSPACE/16k-diagnostics/install-app.txt"
          "$ADB" install -r "$test_apk" | tee "$GITHUB_WORKSPACE/16k-diagnostics/install-test.txt"
          "$ADB" shell dumpsys package com.photobook.app > "$GITHUB_WORKSPACE/16k-diagnostics/package.txt"

          "$ADB" logcat -c
          "$ADB" shell am force-stop com.photobook.app
          "$ADB" shell am start -W -n com.photobook.app/.MainActivity | tee "$GITHUB_WORKSPACE/16k-diagnostics/startup.txt"
          startup_rc=${PIPESTATUS[0]}
          echo "startup_rc=$startup_rc" | tee -a "$REPORT"
          sleep 2

          instrumentation="$("$ADB" shell pm list instrumentation | tr -d '\r' | grep '(target=com.photobook.app)' | head -n1 | sed -E 's/^instrumentation:([^ ]+).*/\1/')"
          echo "instrumentation=$instrumentation" | tee -a "$REPORT"
          test -n "$instrumentation" || exit 4

          set +e
          "$ADB" shell am instrument -w -r -e class com.photobook.app.ml.LocalOcrEngineInstrumentedTest "$instrumentation" > "$GITHUB_WORKSPACE/16k-diagnostics/ocr-instrumentation.txt" 2>&1
          ocr_rc=$?
          set -e
          echo "ocr_instrumentation_rc=$ocr_rc" | tee -a "$REPORT"
          cat "$GITHUB_WORKSPACE/16k-diagnostics/ocr-instrumentation.txt" | tee -a "$REPORT"
          sleep 2

          "$ADB" logcat -d > "$GITHUB_WORKSPACE/16k-diagnostics/logcat-all.txt" 2>&1 || true
          "$ADB" logcat -b crash -d > "$GITHUB_WORKSPACE/16k-diagnostics/logcat-crash.txt" 2>&1 || true
          "$ADB" shell dumpsys activity exit-info com.photobook.app > "$GITHUB_WORKSPACE/16k-diagnostics/exit-info.txt" 2>&1 || true
          "$ADB" shell dmesg > "$GITHUB_WORKSPACE/16k-diagnostics/dmesg.txt" 2>&1 || true
          "$ADB" shell 'ls -la /data/tombstones' > "$GITHUB_WORKSPACE/16k-diagnostics/tombstones-list.txt" 2>&1 || true
          "$ADB" shell 'for f in /data/tombstones/tombstone_*; do [ -f "$f" ] && { echo "===== $f ====="; cat "$f"; }; done' > "$GITHUB_WORKSPACE/16k-diagnostics/tombstones.txt" 2>&1 || true
          "$ADB" shell 'ls -la /data/anr' > "$GITHUB_WORKSPACE/16k-diagnostics/anr-list.txt" 2>&1 || true
          "$ADB" shell 'for f in /data/anr/*; do [ -f "$f" ] && { echo "===== $f ====="; cat "$f"; }; done' > "$GITHUB_WORKSPACE/16k-diagnostics/anr.txt" 2>&1 || true

          grep -Ei 'com\.photobook\.app|signal [0-9]+|SIG[A-Z]+|Abort message|UnsatisfiedLinkError|dlopen|linker|tombstone|native crash|Fatal signal|page size|alignment' "$GITHUB_WORKSPACE/16k-diagnostics/logcat-all.txt" | tail -n 250 > "$GITHUB_WORKSPACE/16k-diagnostics/relevant-logcat.txt" || true
          grep -Ei 'com\.photobook\.app|signal [0-9]+|SIG[A-Z]+|Abort message|UnsatisfiedLinkError|dlopen|linker|page size|alignment|backtrace|Build fingerprint' "$GITHUB_WORKSPACE/16k-diagnostics/tombstones.txt" | head -n 400 > "$GITHUB_WORKSPACE/16k-diagnostics/relevant-tombstone.txt" || true

          if grep -Eq 'OK \(1 tests?\)' "$GITHUB_WORKSPACE/16k-diagnostics/ocr-instrumentation.txt" && [[ "$ocr_rc" -eq 0 ]]; then
            echo 'ocr_16k_reproduction=PASS_UNEXPECTEDLY' | tee -a "$REPORT"
            exit 0
          fi
          echo 'ocr_16k_reproduction=CRASH_REPRODUCED' | tee -a "$REPORT"
          # Intentional nonzero after diagnostics are safely written.
          exit 1
      - name: Upload crash diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api35-16k-ocr-crash-diagnostic-${{ github.run_id }}
          path: |
            16k-crash-diagnostic-report.txt
            16k-diagnostics/
            ${{ runner.temp }}/16k-diagnostic-emulator.log
          retention-days: 14
          if-no-files-found: error
