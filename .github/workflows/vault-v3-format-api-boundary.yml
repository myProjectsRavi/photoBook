name: Vault v3 API30 Boundary Format

on:
  push:
    branches:
      - feature/2.0.15-vault-prer-recovery-v3
    paths:
      - .github/workflows/vault-v3-format-api-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Normalize exact Kotlin block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/photobook/app/feature/vault/VaultAuthCrypto.kt')
          s = p.read_text()
          flat = (
              "    when (policy) {\n"
              "KeyPolicy.R_PLUS_COMBINED -> {\n"
              "    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n"
              "        configureRPlusPrimaryKey(builder)\n"
              "    } else {\n"
              "        throw IllegalStateException(\n"
              "            \"Android 11+ Vault key policy requested below API 30\",\n"
              "        )\n"
              "    }\n"
              "}\n"
              "KeyPolicy.PRE_R_BIOMETRIC -> {\n"
              "    check(Build.VERSION.SDK_INT < Build.VERSION_CODES.R)\n"
              "    @Suppress(\"DEPRECATION\")\n"
              "    builder.setUserAuthenticationValidityDurationSeconds(-1)\n"
              "    builder.setInvalidatedByBiometricEnrollment(true)\n"
              "}\n"
              "}\n"
          )
          proper = (
              "        when (policy) {\n"
              "            KeyPolicy.R_PLUS_COMBINED -> {\n"
              "                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n"
              "                    configureRPlusPrimaryKey(builder)\n"
              "                } else {\n"
              "                    throw IllegalStateException(\n"
              "                        \"Android 11+ Vault key policy requested below API 30\",\n"
              "                    )\n"
              "                }\n"
              "            }\n"
              "            KeyPolicy.PRE_R_BIOMETRIC -> {\n"
              "                check(Build.VERSION.SDK_INT < Build.VERSION_CODES.R)\n"
              "                @Suppress(\"DEPRECATION\")\n"
              "                builder.setUserAuthenticationValidityDurationSeconds(-1)\n"
              "                builder.setInvalidatedByBiometricEnrollment(true)\n"
              "            }\n"
              "        }\n"
          )
          flat_helper = (
              "@androidx.annotation.RequiresApi(Build.VERSION_CODES.R)\n"
              "private fun configureRPlusPrimaryKey(builder: KeyGenParameterSpec.Builder) {\n"
              "    builder.setUserAuthenticationParameters(\n"
              "        0,\n"
              "        KeyProperties.AUTH_BIOMETRIC_STRONG or KeyProperties.AUTH_DEVICE_CREDENTIAL,\n"
              "    )\n"
              "}\n"
          )
          proper_helper = (
              "    @androidx.annotation.RequiresApi(Build.VERSION_CODES.R)\n"
              "    private fun configureRPlusPrimaryKey(builder: KeyGenParameterSpec.Builder) {\n"
              "        builder.setUserAuthenticationParameters(\n"
              "            0,\n"
              "            KeyProperties.AUTH_BIOMETRIC_STRONG or KeyProperties.AUTH_DEVICE_CREDENTIAL,\n"
              "        )\n"
              "    }\n"
          )
          if s.count(flat) != 1 or s.count(flat_helper) != 1:
              raise SystemExit('Flattened Vault API boundary block not found exactly once')
          p.write_text(s.replace(flat, proper, 1).replace(flat_helper, proper_helper, 1))
          PY
          rm .github/workflows/vault-v3-format-api-boundary.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/vault-v3-format-api-boundary.yml app/src/main/java/com/photobook/app/feature/vault/VaultAuthCrypto.kt
          git commit -m "Normalize Vault API30 boundary formatting"
          git push origin HEAD:feature/2.0.15-vault-prer-recovery-v3
