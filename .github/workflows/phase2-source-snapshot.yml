name: Phase 2 Source Snapshot

on:
  push:
    branches:
      - "agent/phase2-index-search-v2"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Stage source
        run: |
          mkdir -p build/phase2-source
          cp app/src/main/java/com/photobook/app/ui/viewmodel/MainViewModel.kt build/phase2-source/MainViewModel.kt
      - name: Upload source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: phase2-source-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: build/phase2-source/MainViewModel.kt
